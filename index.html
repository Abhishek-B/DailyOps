/* ---- end-of-shift review: this is where notes and reasons are collected --- */
function openReview(lk) {
  const day = today(), L = day.lists[lk], m = LIST_META[lk];
  if (isSupabaseMode() && !L.id) { toast(`No ${m.label.toLowerCase()} checklist has been published yet`, 'warn'); return; }
  const st = listStats(L);
  const pending = L.tasks.filter(t => t.status !== 'done');
  const done = L.tasks.filter(t => t.status === 'done');
  const draft = {};
  pending.forEach(t => { draft[t.id] = { status: t.status === 'pending' ? '' : t.status, reason: t.reason || '' }; });

  const reasonBtns = t => Object.entries(REASONS).map(([k, r]) =>
    `<button data-reason="${k}" data-for="${t.id}" class="${draft[t.id].status === k ? 'is-sel' : ''}">${r.label}</button>`).join('');

  const pendingHtml = pending.length ? `
    <div class="sec-title" style="margin-bottom:6px">${plural(pending.length, 'task')} not ticked off</div>
    <div class="tiny mut" style="margin-bottom:10px">Tell the manager why — this goes straight into the end-of-day report.</div>
    ${pending.map(t => `
      <div class="review-item" data-item="${t.id}">
        <div class="row" style="gap:8px;align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:14px">${esc(t.title)}</div>
            ${t.critical ? '<span class="chip chip-accent" style="margin-top:5px">Critical</span>' : ''}
          </div>
        </div>
        <div class="reason-opts">${reasonBtns(t)}</div>
        <textarea class="textarea" data-detail="${t.id}" rows="2"
          style="margin-top:8px;min-height:52px;display:${draft[t.id].status ? 'block' : 'none'}"
          placeholder="Add detail${'…'}">${esc(draft[t.id].reason)}</textarea>
      </div>`).join('')}` : `
    <div class="banner banner-ok" style="margin-bottom:14px">${ic('check', 17)}<div>
      <b>Every task is ticked off.</b> Nothing outstanding on the ${esc(m.label.toLowerCase())} list.</div></div>`;

  const notesHtml = done.length ? `
    <details style="margin-top:16px">
      <summary style="cursor:pointer;font-size:13px;font-weight:620;color:var(--ink-2);padding:8px 0">
        Add a note to something you completed (${done.length})</summary>
      <div style="padding-top:6px">
        ${done.map(t => `
          <div style="padding:9px 0;border-bottom:1px solid var(--line)">
            <div class="tiny" style="font-weight:600;margin-bottom:5px">${esc(t.title)}</div>
            <input class="input" data-note="${t.id}" placeholder="Optional note${'…'}" value="${esc(t.note || '')}">
          </div>`).join('')}
      </div>
    </details>` : '';

  openModal(`
    <div class="modal-head"><div style="flex:1">
      <div class="modal-title">Submit the ${esc(m.label.toLowerCase())} checklist</div>
      <div class="modal-sub">${st.done} of ${st.total} ticked off · ${esc(fmtDate(day.date))}</div>
    </div>
    <button class="iconbtn" data-x="close" aria-label="Close">${ic('x', 18)}</button></div>
    <div class="modal-body">${pendingHtml}${notesHtml}</div>
    <div class="modal-foot">
      <button class="btn" data-x="close">Keep working</button>
      <button class="btn btn-primary" data-x="submit">${ic('send', 16)} Send to manager</button>
    </div>`, {
    wide: true,
    after(root) {
      root.querySelectorAll('[data-x=close]').forEach(b => b.onclick = closeModal);
      root.querySelectorAll('[data-reason]').forEach(b => b.onclick = () => {
        const id = b.dataset.for;
        draft[id].status = b.dataset.reason;
        root.querySelectorAll(`[data-for="${id}"]`).forEach(x => x.classList.toggle('is-sel', x === b));
        const ta = root.querySelector(`[data-detail="${id}"]`);
        ta.style.display = 'block';
        ta.placeholder = REASONS[b.dataset.reason].needsDetail ? 'What blocked it? (required)' : 'Add detail (optional)…';
      });
      root.querySelector('[data-x=submit]').onclick = async () => {
        for (const t of pending) {
          const d = draft[t.id];
          d.reason = (root.querySelector(`[data-detail="${t.id}"]`) || {}).value || '';
          if (!d.status) { toast(`Pick a reason for "${t.title.slice(0, 34)}…"`, 'warn'); root.querySelector(`[data-item="${t.id}"]`).scrollIntoView({ block: 'center' }); return; }
          if (REASONS[d.status].needsDetail && !d.reason.trim()) { toast('A blocked task needs a short explanation', 'warn'); root.querySelector(`[data-detail="${t.id}"]`).focus(); return; }
        }
        const previous = pending.concat(done).map(t => ({ t, status: t.status, reason: t.reason, note: t.note, doneBy: t.doneBy, doneAt: t.doneAt }));
        pending.forEach(t => { t.status = draft[t.id].status; t.reason = draft[t.id].reason.trim(); });
        done.forEach(t => { const el = root.querySelector(`[data-note="${t.id}"]`); if (el) t.note = el.value.trim(); });
        const oldChecklist = { submitted: L.submitted, submittedBy: L.submittedBy, submittedAt: L.submittedAt };
        L.submitted = true; L.submittedBy = me().id; L.submittedAt = new Date().toISOString();
        if (isSupabaseMode()) {
          try {
            await Promise.all(pending.concat(done).map(t => persistTask(t)));
            await persistChecklist(L);
          } catch (error) {
            try { await loadSupabaseState(); }
            catch (reloadError) {
              previous.forEach(x => Object.assign(x.t, { status: x.status, reason: x.reason, note: x.note, doneBy: x.doneBy, doneAt: x.doneAt }));
              Object.assign(L, oldChecklist);
            }
            render(); toast(dbError(error), 'warn'); return;
          }
        } else {
          save(); runTriggers();
        }
        closeModal(); render();
        toast(`${m.full} checklist sent to the manager`, 'ok');
      };
    }
  });
}

      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-x="close">Cancel</button>
      <button class="btn btn-primary" data-x="save">Add task</button></div>`, {
    after(root) {
      let list = lk, crit = false;
      root.querySelectorAll('[data-x=close]').forEach(b => b.onclick = closeModal);
      root.querySelectorAll('#nt-list button').forEach(b => b.onclick = () => {
        list = b.dataset.k;
        root.querySelectorAll('#nt-list button').forEach(x => x.classList.toggle('is-active', x === b));
      });
      const sw = root.querySelector('#nt-crit');
      sw.onclick = () => { crit = !crit; sw.classList.toggle('is-on', crit); };
      root.querySelector('#nt-title').focus();
      root.querySelector('[data-x=save]').onclick = () => {
        const title = root.querySelector('#nt-title').value.trim();
        if (!title) { toast('Give the task a name', 'warn'); return; }
        const day = today();
        day.lists[list].tasks.push({
          id: uid('x'), tplId: null, title, detail: root.querySelector('#nt-detail').value.trim(),
          critical: crit, source: 'adhoc', addedBy: me().id, addedAt: new Date().toISOString(),
          status: 'pending', doneBy: null, doneAt: null, note: '', reason: ''
        });
        day.lists[list].completeNotified = false;
        R.list = list; save(); closeModal(); render();
        toast(`Added to today's ${LIST_META[list].label.toLowerCase()} list`, 'ok');
      };
    }
  });
}

      root.querySelector('[data-x=save]').onclick = () => {
        const name = root.querySelector('#vn-name').value.trim();
        const sub = root.querySelector('#vn-sub').value.trim();
        const cutoff = root.querySelector('#vn-cut').value || '23:30';
        if (!name) { toast('Give the venue a name', 'warn'); return; }
        if (v) { Object.assign(v, { name, sub, cutoff, accent }); }
        else {
          const nv = newVenue(name, sub, accent);
          nv.cutoff = cutoff;
          S.session.venueId = nv.id;
          R.tab = 'templates';
        }
        save(); closeModal(); render();
        toast(v ? 'Venue updated' : `${name} added — build its checklists next`, 'ok');
      };
    }
  });
}

/* ---- copy a checklist template from another venue ----------------------- */
function openCopyTemplate() {
  const others = S.venues.filter(v => v.id !== V().id);
  if (!others.length) { toast('There is only one venue', 'warn'); return; }
  let src = others[0].id, lists = { open: true, close: true };

  openModal(`
    <div class="modal-head"><div style="flex:1">
      <div class="modal-title">Copy checklists</div>
      <div class="modal-sub">Into <b>${esc(V().name)}</b>. Copied tasks are added — nothing already there is removed.</div>
    </div><button class="iconbtn" data-x="close" aria-label="Close">${ic('x', 18)}</button></div>
    <div class="modal-body stack" style="gap:13px">
      <div class="field"><label class="label" for="cp-src">Copy from</label>
        <select class="select" id="cp-src">${others.map(v =>
          `<option value="${v.id}">${esc(v.name)} — ${TPL(v.id).open.length + TPL(v.id).close.length} tasks</option>`).join('')}</select></div>
      <div class="field"><label class="label">Which lists</label>
        <div class="row wrap" style="gap:6px" id="cp-lists">
          ${['open','close'].map(k => `<button class="chip chip-accent" data-k="${k}" style="cursor:pointer;height:28px;padding:0 11px">${LIST_META[k].full}</button>`).join('')}
        </div></div>
    </div>
    <div class="modal-foot"><button class="btn" data-x="close">Cancel</button>
      <button class="btn btn-primary" data-x="save">Copy across</button></div>`, {
    after(root) {
      root.querySelectorAll('[data-x=close]').forEach(b => b.onclick = closeModal);
      root.querySelector('#cp-src').onchange = e => { src = e.target.value; };
      root.querySelector('#cp-lists').addEventListener('click', e => {
        const b = e.target.closest('[data-k]'); if (!b) return;
        lists[b.dataset.k] = !lists[b.dataset.k];
        b.classList.toggle('chip-accent', lists[b.dataset.k]);
      });
      root.querySelector('[data-x=save]').onclick = () => {
        if (!lists.open && !lists.close) { toast('Pick at least one list', 'warn'); return; }
        let n = 0;
        ['open','close'].forEach(k => {
          if (!lists[k]) return;
          const have = new Set(TPL()[k].map(t => t.title.toLowerCase()));
          TPL(src)[k].forEach(t => {
            if (have.has(t.title.toLowerCase())) return;
            TPL()[k].push({ id: uid('t'), title: t.title, detail: t.detail, critical: t.critical });
            n++;
          });
        });
        save(); closeModal(); render();
        toast(n ? `${plural(n, 'task')} copied from ${venue(src).name}` : 'Nothing new to copy', n ? 'ok' : 'warn');
      };
    }
  });
}

/* ---- notification preview ---------------------------------------------- */

  const n = S.notifications.find(x => x.id === id); if (!n) return;
  n.read = true; save();
  const body = n.channel === 'sms'
    ? `<div class="tiny mut" style="margin-bottom:9px">SMS to ${esc(n.to)} · ${esc(fmtDT(n.at))}</div>
       <div class="sms-bubble">${esc(n.text)}</div>
       <div class="tiny mut" style="margin-top:12px">${n.text.length} characters · ${Math.ceil(n.text.length / 160)} segment(s)</div>`
    : `<div class="mailpv">
        <div class="mailpv-head">
          <div class="kvline"><span>From</span><span>Peachy Checklists &lt;no-reply@peachybar.com.au&gt;</span></div>
          <div class="kvline"><span>To</span><span>${esc(n.to)}</span></div>
          <div class="kvline"><span>Subject</span><span><b>${esc(n.subject)}</b></span></div>

        </div>
        <div class="mailpv-body">${n.html}</div>

  openModal(`
    <div class="modal-head"><div style="flex:1">

      <div class="modal-sub">${n.kind === 'end-of-day' ? 'End-of-day summary' : 'List completed'} · delivery stubbed</div>
    </div><button class="iconbtn" data-x="close" aria-label="Close">${ic('x', 18)}</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot"><button class="btn" data-x="close">Close</button></div>`, {
    wide: true,
    after(root) { root.querySelectorAll('[data-x=close]').forEach(b => b.onclick = closeModal); },
    onClose: render
  });
}

/* ---- a past day, read-only --------------------------------------------- */
function openDay(key) {
  const day = DAYS()[key]; if (!day) return;
  const d = dayStats(day);
  const block = lk => {
    const L = day.lists[lk], s = listStats(L);

        <div style="flex:1"><div class="h3">${LIST_META[lk].full}</div>

    </div><button class="iconbtn" data-x="close" aria-label="Close">${ic('x', 18)}</button></div>
    <div class="modal-body" style="background:var(--bg)">${block('open')}${block('close')}</div>
    <div class="modal-foot">
      <button class="btn" data-x="csv">${ic('dl', 15)} Export this day</button>
      <button class="btn btn-primary" data-x="close">Done</button></div>`, {
    wide: true,
    after(root) {
      root.querySelectorAll('[data-x=close]').forEach(b => b.onclick = closeModal);
      root.querySelector('[data-x=csv]').onclick = () =>
        exportCsv([key], `${V().name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${key}.csv`);
    }
  });
}

/* ==========================================================================
   ACTIONS
   ========================================================================== */
async function toggleTask(lk, id) {
  const day = today(), L = day.lists[lk];
  if (L.submitted) { toast('This list is submitted — reopen it to make changes', 'warn'); return; }
  if (!me().active) { toast('This account is disabled', 'warn'); return; }
  const t = L.tasks.find(x => x.id === id); if (!t) return;
  const previous = { status: t.status, doneBy: t.doneBy, doneAt: t.doneAt, reason: t.reason };
  if (t.status === 'done') { t.status = 'pending'; t.doneBy = null; t.doneAt = null; }
  else { t.status = 'done'; t.doneBy = me().id; t.doneAt = new Date().toISOString(); t.reason = ''; }
  if (isSupabaseMode()) {
    try { await persistTask(t); render(); }
    catch (error) {
      Object.assign(t, previous); render(); toast(dbError(error), 'warn');
    }
    return;
  }
  save(); runTriggers(); render();
}

function syncTemplate(lk) {
  const day = today(), L = day.lists[lk], tpl = TPL()[lk];
  const byTpl = {}; L.tasks.forEach(t => { if (t.tplId) byTpl[t.tplId] = t; });
  const kept = tpl.map(x => {
    const ex = byTpl[x.id];
    if (ex) { ex.title = x.title; ex.detail = x.detail; ex.critical = x.critical; delete byTpl[x.id]; return ex; }
    return instanceFromTemplate(x);
  });
  const orphansDone = Object.values(byTpl).filter(t => t.status === 'done');
  L.tasks = kept.concat(orphansDone, L.tasks.filter(t => t.source === 'adhoc'));
  L.completeNotified = false;
  save(); runTriggers(); render();
  toast(`${LIST_META[lk].full} list synced with the template`, 'ok');
}

/* pulling someone off shift has to clear them from every venue, not just this one */
function unrosterEverywhere(userId) {
  S.venues.forEach(v => {
    const d = today(v.id);
    ['open','close'].forEach(k => { d.roster[k] = d.roster[k].filter(x => x !== userId); });
  });
}

async function reopenList(lk) {
  const L = today().lists[lk];
  const previous = { submitted: L.submitted, submittedBy: L.submittedBy, submittedAt: L.submittedAt };
  L.submitted = false; L.submittedBy = null; L.submittedAt = null;
  if (isSupabaseMode()) {
    try { await persistChecklist(L); render(); toast('List reopened'); }
    catch (error) { Object.assign(L, previous); render(); toast(dbError(error), 'warn'); }
    return;
  }
  save(); render(); toast('List reopened');
}

async function coverShift(lk) {
  const day = today(), list = day.roster[lk];
  if (list.includes(me().id)) return;
  if (isSupabaseMode()) {
    const { error } = await DB.from('roster_assignments').upsert({
      venue_id: V().id, user_id: me().id, work_date: day.date, shift_type: lk
    }, { onConflict: 'venue_id,user_id,work_date,shift_type' });
    if (error) { toast(dbError(error), 'warn'); return; }
  }
  list.push(me().id); save(); render(); toast(`You're on the ${LIST_META[lk].label.toLowerCase()} shift`, 'ok');
}

async function tickAll(lk) {
  const L = today().lists[lk];
  if (L.submitted) { toast('Reopen the list first', 'warn'); return; }
  const changed = L.tasks.filter(t => t.status !== 'done');
  changed.forEach(t => { t.status = 'done'; t.doneBy = me().id; t.doneAt = new Date().toISOString(); t.reason = ''; });
  if (isSupabaseMode()) {
    try { await Promise.all(changed.map(t => persistTask(t))); render(); }
    catch (error) { await loadSupabaseState(); render(); toast(dbError(error), 'warn'); }
    return;
  }
  save(); runTriggers(); render();
}

function handleAct(act, ds) {
  if (isSupabaseMode() && ['add-task', 'del-task', 'sync-tpl', 'eod', 'roster', 'add-user', 'edit-user', 'toggle-user', 'toggle-user-venue', 'del-user', 'tpl-add', 'tpl-edit', 'tpl-crit', 'tpl-del', 'tpl-up', 'tpl-down', 'test-notif', 'setting-toggle', 'venue-accent', 'add-venue', 'edit-venue', 'copy-tpl', 'del-venue', 'reset-day', 'reset-all'].includes(act)) {
    toast('This action is planned for the Supabase phase 2 adapter', 'warn');
    return;
  }
  const day = today();
  switch (act) {
    case 'review':    openReview(ds.list); break;
    case 'add-task':  openAddTask(ds.list || R.list); break;
    case 'del-task': {
      const L = day.lists[ds.list];
      L.tasks = L.tasks.filter(t => t.id !== ds.id);
      save(); runTriggers(); render(); toast('Task removed'); break;
    }
    case 'cover':    coverShift(ds.list); break;
    case 'reopen':  reopenList(ds.list); break;
    case 'tick-all': tickAll(ds.list); break;
    case 'sync-tpl':  syncTemplate(ds.list); break;
    case 'eod': {
      if (day.reported) { toast(`${V().name} has already been reported today — see Alerts`, 'warn'); R.tab = 'alerts'; render(); break; }
      runTriggers({ forceEod: true, venueId: V().id }); render(); break;
    }
    case 'roster': {
      const arr = day.roster[ds.list];
      const i = arr.indexOf(ds.id);
      if (i >= 0) arr.splice(i, 1); else arr.push(ds.id);
      save(); render(); break;
    }
    case 'add-user':    openUserEditor(null); break;
    case 'edit-user':   openUserEditor(ds.id); break;
    case 'toggle-user': {
      const u = user(ds.id); u.active = !u.active;
      if (!u.active) unrosterEverywhere(ds.id);
      save(); render(); toast(`${u.name.split(' ')[0]} ${u.active ? 'can now sign in' : 'no longer has access'}`); break;
    }
    case 'toggle-user-venue': {
      const u = user(ds.id), i = u.venues.indexOf(ds.venue);
      if (i >= 0) {
        if (u.venues.length < 2) { toast('They need at least one venue', 'warn'); break; }
        u.venues.splice(i, 1);
        ['open','close'].forEach(k => { const d = today(ds.venue); d.roster[k] = d.roster[k].filter(x => x !== ds.id); });
      } else u.venues.push(ds.venue);
      save(); render();
      toast(`${u.name.split(' ')[0]} ${i >= 0 ? 'removed from' : 'added to'} ${venue(ds.venue).name}`); break;
    }
    case 'del-user': {
      const u = user(ds.id);
      confirmModal(`Remove ${u.name}?`, 'Their past checklist history stays in the record. This cannot be undone.', 'Remove', () => {
        S.users = S.users.filter(x => x.id !== ds.id);
        unrosterEverywhere(ds.id);
        if (S.session.userId === ds.id) S.session.userId = S.users.find(x => x.role === 'manager').id;
        save(); render(); toast('Employee removed');
      }, true); break;
    }
    case 'tpl-add':  openTemplateEditor(ds.list, null); break;
    case 'tpl-edit': openTemplateEditor(ds.list, ds.id); break;
    case 'tpl-crit': {
      const t = TPL()[ds.list].find(x => x.id === ds.id); t.critical = !t.critical; save(); render(); break;
    }
    case 'tpl-del': {
      const arr = TPL()[ds.list], t = arr.find(x => x.id === ds.id);
      confirmModal('Remove from template?', `"${t.title}" will stop appearing on new ${LIST_META[ds.list].label.toLowerCase()} lists.`, 'Remove', () => {
        TPL()[ds.list] = arr.filter(x => x.id !== ds.id); save(); render(); toast('Removed from the template');
      }, true); break;
    }
    case 'tpl-up': case 'tpl-down': {
      const arr = TPL()[ds.list], i = arr.findIndex(x => x.id === ds.id);
      const j = act === 'tpl-up' ? i - 1 : i + 1;
      if (j < 0 || j >= arr.length) break;
      [arr[i], arr[j]] = [arr[j], arr[i]]; save(); render(); break;
    }
    case 'view-day':  openDay(ds.key); break;
    case 'csv-all':   exportCsv(Object.keys(DAYS()).sort().reverse(), `${V().name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-checklists.csv`); break;
    case 'csv-group': exportAllVenues(); break;
    case 'open-notif': openNotif(ds.id); break;
    case 'mark-read': S.notifications.forEach(n => n.read = true); save(); render(); break;
    case 'test-notif': {
      const built = buildEndOfDay(V(), day, false);
      built.subject = '[Test] ' + built.subject;
      Notifier.push('end-of-day', built, { dayKey: day.date });
      render(); toast('Test notification composed — open it to preview', 'ok'); break;
    }
    case 'setting-toggle': V()[ds.key] = !V()[ds.key]; save(); render(); break;
    case 'venue-accent':   V().accent = ds.key; save(); render(); break;
    case 'goto-venue': {
      if (ds.id === S.session.venueId) break;
      S.session.venueId = ds.id; R.list = 'open';
      save(); render(); scrollTop(); toast(`Switched to ${V().name}`); break;
    }
    case 'add-venue':  openVenueEditor(null); break;
    case 'edit-venue': openVenueEditor(ds.id); break;
    case 'copy-tpl':   openCopyTemplate(); break;
    case 'del-venue': {
      if (S.venues.length < 2) { toast('You need at least one venue', 'warn'); break; }
      const v = venue(ds.id);
      confirmModal(`Remove ${v.name}?`, 'Its checklists, roster and history go with it. Alerts already sent are kept. This cannot be undone.', 'Remove venue', () => {
        S.venues = S.venues.filter(x => x.id !== ds.id);
        delete S.templates[ds.id]; delete S.days[ds.id];
        S.users.forEach(u => { u.venues = u.venues.filter(x => x !== ds.id); });
        S.users.filter(u => u.role === 'employee' && !u.venues.length).forEach(u => { u.venues = [S.venues[0].id]; });
        if (S.session.venueId === ds.id) S.session.venueId = S.venues[0].id;
        save(); render(); toast(`${v.name} removed`);
      }, true); break;
    }
    case 'reset-day': {
      confirmModal(`Reset today at ${V().name}?`, 'Both lists go back to the template with nothing ticked. Other venues and all history are untouched.', 'Reset today', () => {
        const roster = DAYS()[dayKey()].roster;
        DAYS()[dayKey()] = makeDay(dayKey(), roster, V().id);
        save(); render(); toast(`Today reset for ${V().name}`, 'ok');
      }, true); break;
    }
    case 'reset-all': {
      confirmModal('Wipe all demo data?', 'Everything goes back to the seeded demo — staff, templates, history and alerts.', 'Wipe and reseed', () => {
        localStorage.removeItem(STORE_KEY); S = defaultState(); save();
        R = { tab: 'today', list: 'open', historyKey: null };
        render(); toast('Demo data reset', 'ok');
      }, true); break;
    }
  }
}

/* ==========================================================================
   WIRING
   ========================================================================== */
function scrollTop() { const c = $('#content'); if (c) c.scrollTop = 0; }

$('#app').addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && $('#app').contains(a) && !e.target.closest('#modal-root')) { e.preventDefault(); handleAct(a.dataset.act, a.dataset); return; }
  const t = e.target.closest('[data-task]');
  if (t && !e.target.closest('#modal-root')) { toggleTask(t.dataset.list, t.dataset.task); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { R.tab = tab.dataset.tab; render(); scrollTop(); return; }
  const seg = e.target.closest('.segmented [data-list]');
  if (seg) { R.list = seg.dataset.list; render(); return; }
});

$('#user-switch').addEventListener('change', e => {
  S.session.userId = e.target.value;
  R.tab = 'today';
  ensureVenue();
  save(); render(); scrollTop();
  const n = venuesFor(me()).length;
  toast(`Now viewing as ${me().name}${isMgr() ? ' (manager)' : ` · ${n === 1 ? V().name : plural(n, 'venue')}`}`);
});

$('#venue-switch').addEventListener('change', e => {
  S.session.venueId = e.target.value;
  R.list = 'open';
  save(); render(); scrollTop();
  toast(`Switched to ${V().name}`);
});

$('#btn-theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('dailyops.theme', next); } catch (e) {}
  renderChrome();
});

$('#btn-mobile').addEventListener('click', () => {
  document.body.classList.toggle('mobile-view');
  try { localStorage.setItem('dailyops.mobile', document.body.classList.contains('mobile-view') ? '1' : '0'); } catch (e) {}
  renderChrome();
});

$('#btn-alerts').addEventListener('click', () => { R.tab = 'alerts'; render(); scrollTop(); });

$('#page').addEventListener('change', e => {
  const el = e.target.closest('[data-set]');
  if (!el) return;
  V()[el.dataset.set] = el.value;
  save(); render();
  toast('Saved');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-root').classList.contains('is-open')) closeModal();
});

/* ------------------------------------------------------------------- init */
function tickClock() {
  const el = $('#sb-time');
  if (el) el.textContent = new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function showAuthError(message) {
  const el = $('#auth-error');
  el.textContent = message || '';
  el.hidden = !message;
}

function showLogin(message) {
  $('#app').hidden = true;
  $('#auth-screen').hidden = false;
  showAuthError(message);
}

function showApp() {
  $('#auth-screen').hidden = true;
  $('#app').hidden = false;
}

async function signIn(event) {
  event.preventDefault();
  if (!DB) return;
  const button = $('#login-submit');
  button.disabled = true;
  showAuthError('');
  const email = $('#login-email').value.trim();
  const password = $('#login-password').value;
  const { data, error } = await DB.auth.signInWithPassword({ email, password });
  if (error) {
    button.disabled = false;
    showAuthError(error.message);
    return;
  }
  AUTH.session = data.session;
  try {
    await loadSupabaseState();
    button.disabled = false;
    showApp(); render();
  } catch (error) {
    button.disabled = false;
    await DB.auth.signOut();
    showLogin(dbError(error));
  }
}

async function startApp() {
  try {
    const th = localStorage.getItem('dailyops.theme');
    if (th) document.documentElement.dataset.theme = th;
    else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
    if (localStorage.getItem('dailyops.mobile') === '1') document.body.classList.add('mobile-view');
  } catch (e) {}

  if (isSupabaseMode()) {
    $('#app').hidden = true;
    if (!window.supabase || !window.supabase.createClient) {
      showLogin('The Supabase client library did not load. Check the network connection and try again.');
      return;
    }
    DB = window.supabase.createClient(PUBLIC_SUPABASE_CONFIG.url, PUBLIC_SUPABASE_CONFIG.publishableKey);
    const { data, error } = await DB.auth.getSession();
    if (error) { showLogin(error.message); return; }
    AUTH.session = data.session;
    DB.auth.onAuthStateChange((event, session) => {
      AUTH.session = session;
      if (event === 'SIGNED_OUT') { S = null; showLogin(); }
    });
    if (!AUTH.session) { showLogin(); return; }
    try {
      await loadSupabaseState();
      showApp(); render();
    } catch (error) {
      await DB.auth.signOut();
      showLogin(dbError(error));
    }
    tickClock();
    setInterval(tickClock, 30000);
    console.info('%cDailyOps — Supabase phase 1', 'font-weight:700;font-size:13px');
    return;
  }

  load();
  showApp();
  tickClock();
  render();

  // cutoff watcher — in production this is a scheduled backend job, not a timer
  setInterval(() => { tickClock(); if (runTriggers()) render(); }, 30000);

  console.info('%cDailyOps — Shift Checklist (demo, multi-venue)', 'font-weight:700;font-size:13px');
  console.info(`${S.venues.length} venues: ${S.venues.map(v => v.name).join(', ')}`);
  console.info('Notifications are stubbed: see Notifier.deliver(). State lives in localStorage["' + STORE_KEY + '"].');
}

$('#login-form').addEventListener('submit', signIn);
$('#btn-logout').addEventListener('click', async () => {
  if (DB) await DB.auth.signOut();
});

startApp();
</script>
