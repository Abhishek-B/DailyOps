/* ==========================================================================
   MANAGER · HISTORY & STATS
   ========================================================================== */
function historySubmissionLabel(day) {
  const open = day.lists.open.submitted, close = day.lists.close.submitted;
  if (open && close) return 'Both submitted';
  if (open) return 'Opening submitted';
  if (close) return 'Closing submitted';
  return 'Not submitted';
}

function pageSupabaseHistory() {
  const state = SUPABASE_HISTORY;
  const context = V();
  const venueName = context ? venueDisplayLabel(context) : 'selected venue';
  const head = `<div class="page-head row-b wrap">
    <div><div class="page-title">History</div>
      <div class="page-sub">Historical Daily Operations for <b>${esc(venueName)}</b>, kept as a read-only record.</div></div>
    <div class="row wrap" style="gap:8px">
      <button class="btn btn-sm" data-act="history-reload">${ic('reset', 15)} Refresh</button>
      <button class="btn btn-sm btn-primary" data-act="csv-all" ${state.loading || state.error || !state.days.length ? 'disabled' : ''}>${ic('dl', 15)} Export CSV</button>
    </div>
  </div>`;
  if (context && state.venueId && state.venueId !== context.realId) return `${head}<div class="empty"><div class="empty-icon">${ic('clock', 20)}</div><div>Loading historical operations for this venue…</div></div>`;
  if (state.loading) return `${head}<div class="empty"><div class="empty-icon">${ic('clock', 20)}</div><div>Loading historical operations…</div><div class="tiny mut" style="margin-top:5px">Reading recent submitted and completed shift records from Supabase.</div></div>`;
  if (state.error) return `${head}<div class="banner banner-warn">${ic('warn', 17)}<div>${esc(state.error)}<br><button class="btn btn-sm" data-act="history-reload" style="margin-top:9px">Try again</button></div></div>`;

  const days = state.days || [];
  const totals = days.reduce((summary, day) => {
    const stats = dayStats(day);
    summary.total += stats.total;
    summary.done += stats.done;
    summary.listCount += ['open', 'close'].filter(lk => day.lists[lk].id).length;
    summary.criticalMissed += ['open', 'close'].reduce((count, lk) =>
      count + day.lists[lk].tasks.filter(task => task.critical && task.status !== 'done').length, 0);
    summary.submitted += ['open', 'close'].filter(lk => day.lists[lk].submitted).length;
    return summary;
  }, { total: 0, done: 0, listCount: 0, criticalMissed: 0, submitted: 0 });

  const missCount = {};
  const perUser = {};
  days.forEach(day => ['open', 'close'].forEach(lk => day.lists[lk].tasks.forEach(task => {
    if (task.status !== 'done') missCount[task.title] = (missCount[task.title] || 0) + 1;
    if (task.status === 'done' && task.doneBy) {
      perUser[task.doneBy] = perUser[task.doneBy] || { done: 0, shifts: new Set() };
      perUser[task.doneBy].done++;
      perUser[task.doneBy].shifts.add(`${day.date}:${lk}`);
    }
  })));
  const worst = Object.entries(missCount).sort((a, b) => b[1] - a[1])[0];
  const historyPercent = totals.total ? Math.round((totals.done / totals.total) * 100) : 0;
  const dayRows = days.map(day => {
    const stats = dayStats(day);
    const criticalMissed = ['open', 'close'].reduce((count, lk) =>
      count + day.lists[lk].tasks.filter(task => task.critical && task.status !== 'done').length, 0);
    return `<tr>
      <td class="nowrap"><b>${esc(fmtDateShort(day.date))}</b></td>
      <td style="min-width:120px"><div class="row" style="gap:8px">
        <div class="bar" style="flex:1;min-width:60px"><i style="width:${stats.total ? stats.pct : 0}%;background:${stats.pct === 100 ? 'var(--ok)' : 'var(--accent)'}"></i></div>
        <span class="tiny num nowrap" style="font-weight:640">${stats.total ? `${stats.pct}%` : '—'}</span></div></td>
      <td class="num nowrap hide-sm">${stats.open.total ? `${stats.open.done}/${stats.open.total}` : '—'}</td>
      <td class="num nowrap hide-sm">${stats.close.total ? `${stats.close.done}/${stats.close.total}` : '—'}</td>
      <td class="num"><span class="chip ${stats.missed ? 'chip-warn' : 'chip-ok'}">${stats.missed}</span></td>
      <td class="num"><span class="chip ${criticalMissed ? 'chip-danger' : 'chip-ok'}">${criticalMissed}</span></td>
      <td><span class="chip ${day.lists.open.submitted && day.lists.close.submitted ? 'chip-ok' : 'chip-warn'}">${esc(historySubmissionLabel(day))}</span></td>
      <td style="text-align:right"><button class="btn btn-sm btn-ghost" data-act="view-history-day" data-key="${day.date}">View ${ic('right', 13)}</button></td>
    </tr>`;
  }).join('');

  const staffStats = Object.entries(perUser).map(([id, stats]) => ({
    id, done: stats.done, shifts: stats.shifts.size,
    avg: stats.shifts.size ? Math.round(stats.done / stats.shifts.size) : 0
  })).sort((a, b) => b.done - a.done);
  const topDone = staffStats[0] ? staffStats[0].done : 1;
  const staffRows = staffStats.map(stats => `<tr>
    <td><div class="row" style="gap:9px">${avatarHtml(stats.id, 'sm')}<span>${esc(uname(stats.id))}</span></div></td>
    <td class="num"><b>${stats.done}</b></td>
    <td class="num hide-sm">${stats.shifts}</td>
    <td class="num hide-sm">${stats.avg}</td>
    <td style="min-width:90px"><div class="bar"><i style="width:${Math.round(stats.done / topDone * 100)}%"></i></div></td>
  </tr>`).join('');

  return `${head}<div class="stack">
    <div class="banner banner-info">${ic('info', 17)}<div>Showing the most recent ${days.length} prior operation day${days.length === 1 ? '' : 's'} for this venue. Task titles, statuses, attribution, notes, and reasons are read from immutable daily snapshots.</div></div>
    <div class="stats">
      <div class="stat"><div class="stat-k">Days logged</div><div class="stat-v">${days.length}</div><div class="stat-s">recent prior operation days</div></div>
      <div class="stat"><div class="stat-k">Completion</div><div class="stat-v">${historyPercent}%</div><div class="stat-s">${totals.done} of ${totals.total} tasks</div></div>
      <div class="stat"><div class="stat-k">Outstanding</div><div class="stat-v">${totals.total - totals.done}</div><div class="stat-s">incomplete tasks</div></div>
      <div class="stat"><div class="stat-k">Critical missed</div><div class="stat-v">${totals.criticalMissed}</div><div class="stat-s">incomplete critical tasks</div></div>
      <div class="stat"><div class="stat-k">Submitted</div><div class="stat-v">${totals.submitted}/${totals.listCount}</div><div class="stat-s">shift records submitted</div></div>
      <div class="stat"><div class="stat-k">Most missed</div><div class="stat-v" style="font-size:16px;letter-spacing:-.01em;line-height:1.25;margin-top:6px">${worst ? esc(worst[0]) : '—'}</div><div class="stat-s">${worst ? `${worst[1]}×` : 'nothing missed'}</div></div>
    </div>

    <div class="card">
      <div class="card-head"><div style="flex:1"><div class="h3">Daily record</div><div class="tiny mut">Opening and Closing Shift records are read-only here. Use Today's Operations for current-day changes.</div></div></div>
      <div class="tablewrap"><table class="tbl">
        <thead><tr><th>Date</th><th>Completion</th><th class="hide-sm">Opening</th><th class="hide-sm">Closing</th><th>Outstanding</th><th>Critical</th><th>Submission</th><th></th></tr></thead>
        <tbody>${dayRows || `<tr><td colspan="8" class="mut" style="text-align:center;padding:22px">No historical operations yet.</td></tr>`}</tbody>
      </table></div>
    </div>

    <div class="card">
      <div class="card-head"><div style="flex:1"><div class="h3">Completion attribution</div><div class="tiny mut">Tasks completed by profile across the loaded historical period. Inactive profiles remain included for historical accuracy.</div></div><span class="tiny mut">${totals.submitted} shift submissions</span></div>
      <div class="tablewrap"><table class="tbl">
        <thead><tr><th>Person</th><th class="num">Tasks done</th><th class="num hide-sm">Shifts worked</th><th class="num hide-sm">Avg / shift</th><th>Share</th></tr></thead>
        <tbody>${staffRows || `<tr><td colspan="5" class="mut" style="text-align:center;padding:22px">No completed tasks in this period.</td></tr>`}</tbody>
      </table></div>
    </div>
  </div>`;
}

function pageHistory() {
  if (isSupabaseMode()) return pageSupabaseHistory();
  const keys = localHistoryKeys(V().id);
  const recent = keys.slice(0, 30);
  const totals = recent.reduce((a, k) => { const d = dayStats(DAYS()[k]); a.t += d.total; a.d += d.done; return a; }, { t: 0, d: 0 });

  const missCount = {};
  recent.forEach(k => ['open','close'].forEach(lk => DAYS()[k].lists[lk].tasks.forEach(t => {
    if (t.status !== 'done') missCount[t.title] = (missCount[t.title] || 0) + 1;
  })));
  const worst = Object.entries(missCount).sort((a, b) => b[1] - a[1])[0];

  const perUser = {};
  recent.forEach(k => ['open','close'].forEach(lk => DAYS()[k].lists[lk].tasks.forEach(t => {
    if (t.status === 'done' && t.doneBy) {
      perUser[t.doneBy] = perUser[t.doneBy] || { done: 0, shifts: new Set() };
      perUser[t.doneBy].done++; perUser[t.doneBy].shifts.add(k + lk);
    }
  })));
  const rosterCount = {};
  recent.forEach(k => ['open','close'].forEach(lk => DAYS()[k].roster[lk].forEach(id => {
    rosterCount[id] = rosterCount[id] || { assigned: 0 }; rosterCount[id].assigned++;
  })));

  const staffStats = S.users.filter(u => u.role === 'employee').map(u => {
    const p = perUser[u.id] || { done: 0, shifts: new Set() };
    const shifts = p.shifts.size;
    return { u, done: p.done, shifts, avg: shifts ? Math.round(p.done / shifts) : 0, rostered: (rosterCount[u.id] || {}).assigned || 0 };
  }).sort((a, b) => b.done - a.done);

  const dayRows = recent.map(k => {
    const day = DAYS()[k], d = dayStats(day);
    return `<tr>
      <td class="nowrap"><b>${esc(fmtDateShort(k))}</b>${k === dayKey() ? ' <span class="chip chip-accent">Today</span>' : ''}</td>
      <td style="min-width:120px"><div class="row" style="gap:8px">
        <div class="bar" style="flex:1;min-width:60px"><i style="width:${d.pct}%;background:${d.pct === 100 ? 'var(--ok)' : 'var(--accent)'}"></i></div>
        <span class="tiny num nowrap" style="font-weight:640">${d.pct}%</span></div></td>
      <td class="num nowrap hide-sm">${d.open.done}/${d.open.total}</td>
      <td class="num nowrap hide-sm">${d.close.done}/${d.close.total}</td>
      <td class="num"><span class="chip ${d.missed ? 'chip-warn' : 'chip-ok'}">${d.missed}</span></td>
      <td style="text-align:right"><button class="btn btn-sm btn-ghost" data-act="view-day" data-key="${k}">View ${ic('right', 13)}</button></td>
    </tr>`;
  }).join('');

  return `
    <div class="page-head row-b wrap">
      <div>
        <div class="page-title">History</div>
        <div class="page-sub">Every shift operation recorded at <b>${esc(V().name)}</b>, kept as a record.</div>
      </div>
      <button class="btn btn-sm" data-act="csv-all">${ic('dl', 15)} Export CSV</button>
    </div>
    <div class="stack">
      <div class="stats">
        <div class="stat"><div class="stat-k">Days logged</div><div class="stat-v">${recent.length}</div><div class="stat-s">most recent 30</div></div>
        <div class="stat"><div class="stat-k">Completion</div><div class="stat-v">${pct(totals.d, totals.t)}%</div><div class="stat-s">${totals.d} of ${totals.t} tasks</div></div>
        <div class="stat"><div class="stat-k">Left undone</div><div class="stat-v">${totals.t - totals.d}</div><div class="stat-s">across all shifts</div></div>
        <div class="stat"><div class="stat-k">Most missed</div><div class="stat-v" style="font-size:16px;letter-spacing:-.01em;line-height:1.25;margin-top:6px">${worst ? esc(worst[0]) : '—'}</div><div class="stat-s">${worst ? `${worst[1]}×` : 'nothing missed'}</div></div>
      </div>

      <div class="card">
        <div class="card-head"><div class="h3">Daily record</div></div>
        <div class="tablewrap"><table class="tbl">
          <thead><tr><th>Date</th><th>Completion</th><th class="hide-sm">Opening</th><th class="hide-sm">Closing</th><th>Missed</th><th></th></tr></thead>
          <tbody>${dayRows || `<tr><td colspan="6" class="mut" style="text-align:center;padding:22px">No history yet.</td></tr>`}</tbody>
        </table></div>
      </div>

      <div class="card">
        <div class="card-head"><div style="flex:1"><div class="h3">Team performance</div>
          <div class="tiny mut">Tasks ticked off per person across the logged period.</div></div></div>
        <div class="tablewrap"><table class="tbl">
          <thead><tr><th>Employee</th><th class="num">Tasks done</th><th class="num hide-sm">Shifts worked</th><th class="num hide-sm">Avg / shift</th><th>Share</th></tr></thead>
          <tbody>${staffStats.map(s => {
            const top = staffStats[0].done || 1;
            return `<tr>
              <td><div class="row" style="gap:9px">${avatarHtml(s.u.id, 'sm')}<span>${esc(s.u.name)}</span>${s.u.active ? '' : '<span class="chip">disabled</span>'}</div></td>
              <td class="num"><b>${s.done}</b></td>
              <td class="num hide-sm">${s.shifts}</td>
              <td class="num hide-sm">${s.avg}</td>
              <td style="min-width:90px"><div class="bar"><i style="width:${Math.round(s.done / top * 100)}%"></i></div></td>
            </tr>`; }).join('')}</tbody>
        </table></div>
      </div>
    </div>`;
}

function pageAlerts() {
  const list = isSupabaseMode() ? SUPABASE_NOTIFICATIONS.rows : S.notifications;
  const coverRequests = SUPABASE_COVER_REQUESTS.rows || [];
  const coverItems = coverRequests.length ? coverRequests.map(request => {
    const employee = user(request.user_id) || {};
    const coveredFor = request.covered_for_user_id ? (user(request.covered_for_user_id) || {}) : null;
    const venueContext = venueCatalog().find(context => context.realId === request.venue_id);
    const unread = !request.manager_seen_at;
    return `<div class="alert-item ${unread ? 'is-unread' : ''}">
      <span class="alert-ic chip-info" style="background:var(--info-soft);color:var(--info)">${ic('users', 17)}</span>
      <span style="flex:1;min-width:0">
        <span style="display:block;font-weight:${unread ? '680' : '540'};letter-spacing:-.012em">${esc(employee.name || employee.email || 'An employee')} is covering ${esc(coveredFor ? (coveredFor.name || coveredFor.email || 'a rostered person') : 'a shift')}</span>
        <span class="tiny mut row wrap" style="margin-top:4px;gap:6px">
          ${venueContext ? `<span class="chip"><span class="venue-dot" style="width:7px;height:7px;background:${venueDotColor(venueContext)}"></span>${esc(venueContext.name)}</span>` : ''}
          <span>${esc(rosterShiftLabel(request.shift_type))} · ${esc(fmtDateShort(request.work_date))}</span>
        </span>
      </span>
      <span class="row" style="gap:6px">
        <span class="tiny mut nowrap">${esc(fmtDT(request.created_at))}</span>
        ${unread ? `<button class="btn btn-sm btn-ghost" data-act="cover-read" data-id="${request.id}">Mark read</button>` : '<span class="chip chip-ok">Read</span>'}
      </span>
    </div>`;
  }).join('') : `<div class="empty"><div class="empty-icon">${ic('users', 20)}</div><div>No shift cover requests.</div>
    <div class="tiny mut" style="margin-top:4px">Employees who confirm they are covering will appear here.</div></div>`;
  return `
    <div class="page-head row-b wrap">
      <div>
        <div class="page-title">Alerts</div>
        <div class="page-sub">Everything the app has sent you, across every venue.</div>
      </div>
      <div class="row" style="gap:8px">
        ${isSupabaseMode() ? `<button class="btn btn-sm btn-ghost" data-act="notifications-refresh">Refresh status</button>` : `<button class="btn btn-sm btn-ghost" data-act="mark-read">Mark all read</button>
        <button class="btn btn-sm" data-act="test-notif">${ic('bolt', 15)} Send test</button>`}
      </div>
    </div>
    <div class="stack">
      ${isSupabaseMode() ? `<div class="banner ${SUPABASE_NOTIFICATIONS.error ? 'banner-warn' : 'banner-info'}">${ic(SUPABASE_NOTIFICATIONS.error ? 'warn' : 'info', 17)}<div>
        ${SUPABASE_NOTIFICATIONS.error ? `<b>Delivery status is unavailable.</b> ${esc(SUPABASE_NOTIFICATIONS.error)}` : `<b>Telegram delivery is server-side.</b> Shift-complete messages are sent by the Edge Function, and end-of-day summaries are sent by Supabase Cron even when no browser is open.`}</div></div>` : `<div class="banner banner-info">${ic('info', 17)}<div>
        <b>Delivery is stubbed in this demo.</b> Messages are composed and logged exactly as they'd be sent, but nothing leaves the browser —
        open the console to see each one. Production Supabase mode uses Edge Functions instead.</div></div>`}
      ${isSupabaseMode() ? `<div class="card">
        <div class="card-head"><div class="h3">Shift cover requests</div>
          <div class="row" style="gap:7px;margin-left:auto">
            <span class="tiny mut">${plural(coverRequests.length, 'request')} · ${remoteUnreadCoverCount()} unread</span>
            <button class="btn btn-sm btn-ghost" data-act="cover-refresh">Refresh</button>
          </div></div>
        ${SUPABASE_COVER_REQUESTS.error ? `<div class="banner banner-warn" style="margin:14px">${ic('warn', 17)}<div>${esc(SUPABASE_COVER_REQUESTS.error)}</div></div>` : coverItems}
      </div>` : ''}
      <div class="card">
        <div class="card-head"><div class="h3">Inbox</div>
          <span class="tiny mut" style="margin-left:auto">${plural(list.length, 'message')} · ${unreadCount()} unread</span></div>
        <div>${list.length ? list.map(n => {
          const isEod = n.kind === 'end-of-day';
          const isReopened = n.kind === 'list-reopened';
          const isCover = n.kind === 'shift-cover';
          const isIncomplete = n.kind === 'list-incomplete';
          const failed = n.deliveryStatus === 'failed';
          const pending = n.deliveryStatus === 'pending';
          const tone = failed ? 'chip-danger' : isIncomplete ? 'chip-warn' : isEod || isReopened || isCover ? 'chip-info' : 'chip-ok';
          const statusLabel = n.deliveryStatus ? (failed ? 'Failed' : pending ? 'Pending' : 'Sent') : 'Preview';
          return `<button class="alert-item ${n.read ? '' : 'is-unread'}" data-act="open-notif" data-id="${n.id}">
            <span class="alert-ic ${tone}" style="background:var(--${failed ? 'danger' : isIncomplete ? 'warn' : isEod || isReopened || isCover ? 'info' : 'ok'}-soft);color:var(--${failed ? 'danger' : isIncomplete ? 'warn' : isEod || isReopened || isCover ? 'info' : 'ok'})">
              ${ic(n.channel === 'telegram' ? 'send' : n.channel === 'sms' ? 'sms' : 'mail', 17)}</span>
            <span style="flex:1;min-width:0">
              <span style="display:block;font-weight:${n.read ? '540' : '680'};letter-spacing:-.012em">${esc(n.subject)}</span>
              <span class="tiny mut row wrap" style="margin-top:4px;gap:6px">
                ${venueCatalog().length > 1 && n.venueName ? `<span class="chip"><span class="venue-dot" style="width:7px;height:7px;background:${
                  venueDotColor(venue(n.venueId) || { accent: 'graphite' })}"></span>${esc(n.venueName)}</span>` : ''}
                <span>${esc(notificationKindLabel(n.kind))} · ${n.channel === 'telegram' ? 'Telegram' : n.channel === 'sms' ? 'SMS' : 'Email'} → ${esc(n.to)}</span>
                <span class="chip ${failed ? 'chip-danger' : pending ? 'chip-warn' : 'chip-ok'}">${statusLabel}</span>
                ${failed && n.errorMessage ? `<span class="tiny" style="color:var(--danger)">${esc(n.errorMessage)}</span>` : ''}
              </span>
            </span>
            <span class="tiny mut nowrap">${esc(fmtDT(n.at))}</span>
          </button>`;
        }).join('') : SUPABASE_NOTIFICATIONS.loading ? `<div class="empty"><div>Loading delivery status…</div></div>` : `<div class="empty"><div class="empty-icon">${ic('mail', 20)}</div><div>No delivery events yet.</div>
          <div class="tiny mut" style="margin-top:4px">You'll see shift-complete, incomplete-submission and end-of-day Telegram status here.</div></div>`}</div>
      </div>
    </div>`;
}

function pageSettings() {
  const s = V();

/* ---- task metadata can be saved during the shift; review remains available */
function openTaskMeta(lk, taskId) {
  const day = today(), L = day.lists[lk], task = L.tasks.find(item => item.id === taskId);
  if (!task) return;
  if (L.submitted) { toast('This shift is submitted — reopen it to make changes', 'warn'); return; }
  if (!me().active) { toast('This account is disabled', 'warn'); return; }

  const m = LIST_META[lk];
  let draftStatus = task.status === 'done' ? 'done' : (REASONS[task.status] ? task.status : '');
  const currentStatus = task.status === 'done'
    ? 'Completed'
    : task.status === 'pending'
      ? 'Pending'
      : (REASONS[task.status] || REASONS.blocked).label;
  const reasonButtons = [
    `<button type="button" data-task-status="" class="${!draftStatus ? 'is-sel' : ''}">Leave pending</button>`,
    ...Object.entries(REASONS).map(([key, reason]) =>
      `<button type="button" data-task-status="${key}" class="${draftStatus === key ? 'is-sel' : ''}">${reason.label}</button>`)
  ].join('');
  const outcomeHtml = task.status === 'done'
    ? `<div class="banner banner-ok" style="margin-bottom:14px">${ic('check', 17)}<div><b>Completed.</b> Reopen the task first if it needs an incomplete reason.</div></div>`
    : `<div class="field">
        <label class="label">Incomplete outcome</label>
        <div class="reason-opts">${reasonButtons}</div>
        <textarea class="textarea" data-task-reason rows="2" style="margin-top:8px;min-height:52px;display:${draftStatus ? 'block' : 'none'}" placeholder="${draftStatus === 'blocked' ? 'What blocked it? (required)' : 'Add detail (optional)…'}">${esc(task.reason || '')}</textarea>
      </div>`;

  openModal(`
    <div class="modal-head"><div style="flex:1">
      <div class="modal-title">Add a note or reason</div>
      <div class="modal-sub">${esc(m.full)} · ${esc(currentStatus)} · ${esc(task.title)}</div>
    </div><button class="iconbtn" data-x="close" aria-label="Close">${ic('x', 18)}</button></div>
    <div class="modal-body stack" style="gap:16px">
      <div class="field">
        <label class="label" for="task-note-editor">Comment or note</label>
        <textarea class="textarea" id="task-note-editor" data-task-note rows="3" placeholder="Add a note as you work…">${esc(task.note || '')}</textarea>
      </div>
      ${outcomeHtml}
    </div>
    <div class="modal-foot">
      <button class="btn" data-x="close">Cancel</button>
      <button class="btn btn-primary" data-x="save">Save details</button>
    </div>`, {
    wide: true,
    after(root) {
      root.querySelectorAll('[data-x="close"]').forEach(button => button.onclick = closeModal);
      const reasonInput = root.querySelector('[data-task-reason]');
      const syncReasonControls = () => {
        root.querySelectorAll('[data-task-status]').forEach(button => {
          button.classList.toggle('is-sel', button.dataset.taskStatus === draftStatus);
        });
        if (!reasonInput) return;
        reasonInput.style.display = draftStatus ? 'block' : 'none';
        reasonInput.placeholder = draftStatus === 'blocked' ? 'What blocked it? (required)' : 'Add detail (optional)…';
      };
      root.querySelectorAll('[data-task-status]').forEach(button => button.onclick = () => {
        draftStatus = button.dataset.taskStatus;
        if (!draftStatus && reasonInput) reasonInput.value = '';
        syncReasonControls();
      });
      root.querySelector('[data-x="save"]').onclick = async () => {
        const note = (root.querySelector('[data-task-note]') || {}).value || '';
        const reason = reasonInput ? reasonInput.value : '';
        if (draftStatus === 'blocked' && !reason.trim()) {
          toast('A blocked task needs a short explanation', 'warn');
          reasonInput.focus();
          return;
        }

        const previous = {
          status: task.status, doneBy: task.doneBy, doneAt: task.doneAt,
          note: task.note, reason: task.reason
        };
        task.note = note.trim();
        if (task.status === 'done') {
          task.status = 'done';
          task.reason = '';
        } else {
          task.status = draftStatus || 'pending';
          task.reason = draftStatus ? reason.trim() : '';
          task.doneBy = null;
          task.doneAt = null;
        }

        try {
          if (isSupabaseMode()) await persistRemoteTask(task);
          else { save(); runTriggers(); }
          closeModal();
          render();
          toast('Task details saved', 'ok');
        } catch (error) {
          Object.assign(task, previous);
          console.error('[supabase] task note/reason update failed', { taskId: task.id, error });
          refreshSupabaseAccessAfterDeniedOperation(error, 'task-note-reason');
          render();
          toast('Could not save the task details. Please try again.', 'warn');
        }
      };
    }
  });
}

/* ---- end-of-shift review: this remains a bulk submit/review option -------- */
function openReview(lk) {
  const day = today(), L = day.lists[lk], m = LIST_META[lk];
  const st = listStats(L);
  const pending = L.tasks.filter(t => t.status !== 'done');
  const done = L.tasks.filter(t => t.status === 'done');
  const draft = {};
  pending.forEach(t => { draft[t.id] = { status: t.status === 'pending' ? '' : t.status, reason: t.reason || '' }; });

  const reasonBtns = t => Object.entries(REASONS).map(([k, r]) =>
    `<button data-reason="${k}" data-for="${t.id}" class="${draft[t.id].status === k ? 'is-sel' : ''}">${r.label}</button>`).join('');

  const pendingHtml = pending.length ? `
    <div class="sec-title" style="margin-bottom:6px">${plural(pending.length, 'task')} not ticked off</div>
    <div class="tiny mut" style="margin-bottom:10px">Tell the manager why — this goes straight into the end-of-day report.</div>
    ${pending.map(t => `
      <div class="review-item" data-item="${t.id}">
        <div class="row" style="gap:8px;align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:14px">${esc(t.title)}</div>
            ${t.critical ? '<span class="chip chip-accent" style="margin-top:5px">Critical</span>' : ''}
          </div>
        </div>
        <div class="reason-opts">${reasonBtns(t)}</div>
        <textarea class="textarea" data-detail="${t.id}" rows="2"
          style="margin-top:8px;min-height:52px;display:${draft[t.id].status ? 'block' : 'none'}"
          placeholder="Add detail${'…'}">${esc(draft[t.id].reason)}</textarea>
      </div>`).join('')}` : `
    <div class="banner banner-ok" style="margin-bottom:14px">${ic('check', 17)}<div>
      <b>Every task is ticked off.</b> Nothing outstanding on the ${esc(m.full.toLowerCase())}.</div></div>`;

  const notesHtml = done.length ? `
    <details style="margin-top:16px">
      <summary style="cursor:pointer;font-size:13px;font-weight:620;color:var(--ink-2);padding:8px 0">
        Add a note to something you completed (${done.length})</summary>
      <div style="padding-top:6px">
        ${done.map(t => `
          <div style="padding:9px 0;border-bottom:1px solid var(--line)">
            <div class="tiny" style="font-weight:600;margin-bottom:5px">${esc(t.title)}</div>
            <input class="input" data-note="${t.id}" placeholder="Optional note${'…'}" value="${esc(t.note || '')}">
          </div>`).join('')}
      </div>
    </details>` : '';

  openModal(`
    <div class="modal-head"><div style="flex:1">
      <div class="modal-title">${isMgr() ? `Review the ${esc(m.full)}` : `Submit the ${esc(m.full)}`}</div>
      <div class="modal-sub">${st.done} of ${st.total} ticked off · ${esc(fmtDate(day.date))}</div>
    </div>
    <button class="iconbtn" data-x="close" aria-label="Close">${ic('x', 18)}</button></div>
    <div class="modal-body">${pendingHtml}${notesHtml}</div>
    <div class="modal-foot">
      <button class="btn" data-x="close">Keep working</button>
      <button class="btn btn-primary" data-x="submit">${ic('send', 16)} ${isMgr() ? (L.submitted ? 'Save changes' : 'Submit shift') : 'Send to manager'}</button>
    </div>`, {
    wide: true,
    after(root) {
      root.querySelectorAll('[data-x=close]').forEach(b => b.onclick = closeModal);
      root.querySelectorAll('[data-reason]').forEach(b => b.onclick = () => {
        const id = b.dataset.for;
        draft[id].status = b.dataset.reason;
        root.querySelectorAll(`[data-for="${id}"]`).forEach(x => x.classList.toggle('is-sel', x === b));
        const ta = root.querySelector(`[data-detail="${id}"]`);
        ta.style.display = 'block';
        ta.placeholder = REASONS[b.dataset.reason].needsDetail ? 'What blocked it? (required)' : 'Add detail (optional)…';
      });
      root.querySelector('[data-x=submit]').onclick = async () => {
        for (const t of pending) {
          const d = draft[t.id];
          d.reason = (root.querySelector(`[data-detail="${t.id}"]`) || {}).value || '';
          if (!d.status) { toast(`Pick a reason for "${t.title.slice(0, 34)}…"`, 'warn'); root.querySelector(`[data-item="${t.id}"]`).scrollIntoView({ block: 'center' }); return; }
          if (REASONS[d.status].needsDetail && !d.reason.trim()) { toast('A blocked task needs a short explanation', 'warn'); root.querySelector(`[data-detail="${t.id}"]`).focus(); return; }
        }
        const previousTasks = pending.concat(done).map(t => ({
          task: t,
          values: {
            status: t.status, doneBy: t.doneBy, doneAt: t.doneAt,
            note: t.note, reason: t.reason
          }
        }));
        const previousList = {
          submitted: L.submitted, submittedBy: L.submittedBy, submittedAt: L.submittedAt
        };
        pending.forEach(t => { t.status = draft[t.id].status; t.reason = draft[t.id].reason.trim(); });
        done.forEach(t => { const el = root.querySelector(`[data-note="${t.id}"]`); if (el) t.note = el.value.trim(); });
        L.submitted = true; L.submittedBy = me().id; L.submittedAt = new Date().toISOString();
        if (isSupabaseMode()) {
          try {
            await Promise.all(pending.concat(done).map(t => persistRemoteTask(t)));
            await persistRemoteChecklist(L);
          } catch (error) {
            previousTasks.forEach(({ task, values }) => Object.assign(task, values));
            Object.assign(L, previousList);
            console.error('[supabase] checklist submission failed', { checklistId: L.id, error });
            refreshSupabaseAccessAfterDeniedOperation(error, 'shift-submit');
            try { await loadSupabaseToday(); }
            catch (reloadError) { console.error('[supabase] checklist resync after submission failure failed', reloadError); }
            render();
            toast(`Could not save the ${m.full.toLowerCase()}. Please try again.`, 'warn');
            return;
          }
        } else {
          save(); runTriggers();
        }
        closeModal(); render();
        if (isSupabaseMode()) requestSupabaseListComplete(L.id);
        toast(`${m.full} submitted`, 'ok');
      };
    }
  });
}

/* ---- add a one-off task to today --------------------------------------- */
function openAddTask(lk) {
  if (!isMgr()) { toast('Only a venue manager can add a one-off task.', 'warn'); return; }
  const current = today().lists[lk];
  if (current.submitted) { toast('Reopen the shift before adding a task.', 'warn'); return; }
  const m = LIST_META[lk];
  openModal(`
    <div class="modal-head"><div style="flex:1">
      <div class="modal-title">One-off task</div>
      <div class="modal-sub">Added to today's ${esc(m.full.toLowerCase())} only — the template stays untouched.</div>
    </div><button class="iconbtn" data-x="close" aria-label="Close">${ic('x', 18)}</button></div>
    <div class="modal-body stack" style="gap:13px">
      <div class="field"><label class="label" for="nt-title">Task</label>
        <input class="input" id="nt-title" placeholder="e.g. Chase the linen delivery" autofocus></div>
      <div class="field"><label class="label" for="nt-detail">Detail <span class="mut">(optional)</span></label>
        <textarea class="textarea" id="nt-detail" rows="2" placeholder="Anything the team needs to know"></textarea></div>
      <div class="field"><label class="label">Which shift</label>
        <div class="pill-toggle" id="nt-list">
          ${['open','close'].map(k => `<button data-k="${k}" class="${k === lk ? 'is-active' : ''}">${LIST_META[k].full}</button>`).join('')}
        </div></div>
      <div class="row-b" style="padding-top:4px">
        <div><div style="font-weight:600;font-size:14px">Critical</div><div class="tiny mut">Flagged in the report if it's missed</div></div>
        <button class="switch" id="nt-crit"></button>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-x="close">Cancel</button>
      <button class="btn btn-primary" data-x="save">Add task</button></div>`, {
    after(root) {
      let list = lk, crit = false;
      root.querySelectorAll('[data-x=close]').forEach(b => b.onclick = closeModal);
      root.querySelectorAll('#nt-list button').forEach(b => b.onclick = () => {
        list = b.dataset.k;
        root.querySelectorAll('#nt-list button').forEach(x => x.classList.toggle('is-active', x === b));
      });
      const sw = root.querySelector('#nt-crit');
      sw.onclick = () => { crit = !crit; sw.classList.toggle('is-on', crit); };
      root.querySelector('#nt-title').focus();
      const saveButton = root.querySelector('[data-x=save]');
      let saving = false;
      saveButton.onclick = async () => {
        if (saving) return;
        const title = root.querySelector('#nt-title').value.trim();
        if (!title) { toast('Give the task a name', 'warn'); return; }
        const detail = root.querySelector('#nt-detail').value.trim();
        const day = today(), target = day.lists[list];
        if (target.submitted) { toast('Reopen the shift before adding a task.', 'warn'); return; }
        saving = true;
        saveButton.disabled = true;
        try {
          if (isSupabaseMode()) {
            const task = await insertRemoteDailyTask(target, {
              sortOrder: nextRemoteSortOrder(target), title, detail, critical: crit, source: 'adhoc'
            });
            target.tasks.push(task);
          } else {
            target.tasks.push({
              id: uid('x'), tplId: null, title, detail,
              critical: crit, source: 'adhoc', addedBy: me().id, addedAt: new Date().toISOString(),
              status: 'pending', doneBy: null, doneAt: null, note: '', reason: ''
            });
            target.completeNotified = false;
            save();
          }
          R.list = list;
          closeModal(); render();
          toast(`Added to today's ${LIST_META[list].full.toLowerCase()}`, 'ok');
        } catch (error) {

/* ---- template task add / edit ------------------------------------------ */
function remoteTemplateId(listType, venueId) {
  const context = supabaseVenueContext(venueId || (V() && V().id));
  const bucket = context && SUPABASE_TEMPLATES.byVenue[context.realId];
  return bucket && bucket.templateIds[listType];
}

async function insertRemoteTemplateTask(listType, fields, venueId) {
  const templateId = remoteTemplateId(listType, venueId);
  if (!templateId) throw new Error(`No ${LIST_META[listType].full} template exists for this venue.`);
  const { error } = await DB.from('template_tasks').insert({
    id: crypto.randomUUID(),
    template_id: templateId,
    sort_order: fields.sortOrder,
    title: fields.title,
    detail: fields.detail || null,
    critical: !!fields.critical
  });
  if (error) throw error;
}

async function updateRemoteTemplateTask(taskId, fields) {
  const { error } = await DB.from('template_tasks')
    .update(fields)
    .eq('id', taskId);
  if (error) throw error;
}

async function deleteRemoteTemplateTask(taskId) {
  const { error } = await DB.from('template_tasks')
    .delete()
    .eq('id', taskId);
  if (error) throw error;
}

async function refreshRemoteTemplates() {
  await loadSupabaseTemplates();
  render();
}

function mutateRemoteTemplate(lockKey, details, action, successMessage) {
  if (REMOTE_MUTATIONS.has(lockKey)) return;
  REMOTE_MUTATIONS.add(lockKey);
  (async () => {
    try {
      await action();
      await refreshRemoteTemplates();
      toast(successMessage, 'ok');
    } catch (error) {
      console.error('[supabase] template mutation failed', { ...details, error });
      refreshSupabaseAccessAfterDeniedOperation(error, 'template-mutation');
      toast('Could not save the template change. Please try again.', 'warn');
    } finally {
      REMOTE_MUTATIONS.delete(lockKey);
    }
  })();
}

function openTemplateEditor(lk, id) {

  openModal(`

      sw.onclick = () => { crit = !crit; sw.classList.toggle('is-on', crit); };

        const title = root.querySelector('#tt-title').value.trim();

        else tpl.push({ id: uid('t'), title, detail, critical: crit });
        save(); closeModal(); render();
        toast(t ? 'Template updated' : 'Added to the template', 'ok');
      };
    }
  });
}

/* ---- platform-admin Auth user creation -------------------------------- */
async function invokeSupabaseCreateUser(payload) {
  const result = await DB.functions.invoke('create-user', { body: payload });
  if (!result.error) return result.data;
  refreshSupabaseAccessAfterDeniedOperation(result.error, 'create-user');

  let message = 'The user could not be created. Please try again.';
  const response = result.error.context;
  if (response && typeof response.json === 'function') {
    try {
      const body = await response.json();
      if (body && typeof body.error === 'string') message = body.error;
    } catch (error) {
      console.warn('[supabase] could not read create-user error response', error);
    }
  }
  const failure = new Error(message);
  failure.status = response && response.status;
  throw failure;
}

async function invokeSupabaseUserAccess(payload) {
  const result = await DB.functions.invoke('manage-user-access', { body: payload });
  if (!result.error) return result.data;
  refreshSupabaseAccessAfterDeniedOperation(result.error, 'manage-user-access');

  let message = 'Could not update organisation access. Please try again.';
  const response = result.error.context;
  if (response && typeof response.json === 'function') {
    try {
      const body = await response.json();
      if (body && typeof body.error === 'string') message = body.error;
    } catch (error) {
      console.warn('[supabase] could not read organisation access error response', error);
    }
  }
  const failure = new Error(message);
  failure.status = response && response.status;
  throw failure;
}

            toast(error.message || 'Could not change that organisation role.', 'warn');

      root.querySelectorAll('[data-admin-remove]').forEach(button => button.onclick = () => {
        if (protectedLocked) return;
        const membershipRoot = button.closest('[data-admin-membership]');
        const organisationId = membershipRoot.dataset.adminMembership;
        const current = memberships.find(member => member.organisationId === organisationId);
        if (!current) return;
        const managerCount = supabaseMembersForOrganisation(organisationId)
          .filter(member => member.role === 'manager' && member.active).length;
        const warning = `This removes ${profile.display_name || 'the user'} from ${organisationName(organisationId)}, removes their venue access there, and clears current and future roster and cover assignments. Historical attribution, their login account, profile, and other organisation memberships remain intact.${current.role === 'manager' && managerCount === 1 ? ` This will leave ${organisationName(organisationId)} with no organisation-scoped manager.` : ''}`;
        closeModal();
        confirmModal('Remove organisation access?', warning, 'Remove access', async () => {
          try {
            await invokeSupabaseUserAccess({
              action: 'remove_organisation_membership',
              user_id: userId,
              organisation_id: organisationId
            });
            await refreshSupabaseTeamAfterAccessChange();
            toast(`Removed ${profile.display_name || 'user'} from ${organisationName(organisationId)}`, 'ok');
          } catch (error) {
            console.error('[supabase] organisation access removal failed', { userId, organisationId, error });

            toast(error.message || 'Could not remove that organisation access.', 'warn');
          }
        }, true);
      });
      const addButton = root.querySelector('[data-admin-add]');
      if (addButton && availableOrganisations.length && !protectedLocked) addButton.onclick = async () => {
        const organisationId = root.querySelector('#admin-add-org').value;
        const role = root.querySelector('#admin-add-role').value;
        addButton.disabled = true;

        <button class="switch ${member.active ? 'is-on' : ''}" id="us-active" ${member.id === AUTH.profile.id || protectedLocked ? 'disabled title="This account is protected by DailyOps security policy"' : ''}></button>
      </div>
      ${protectedLocked ? '<div class="banner banner-warn">' + ic('warn', 17) + '<div><b>Master administrator · Protected account.</b> This account is protected by DailyOps security policy. Access and venue membership cannot be changed by another account.</div></div>' : ''}
    </div>
    <div class="modal-foot"><button class="btn" data-x="close">Cancel</button>
      <button class="btn btn-primary" data-x="save">Save changes</button></div>`, {
    after(root) {
      let active = member.active;
      root.querySelectorAll('[data-x=close]').forEach(button => button.onclick = closeModal);
      root.querySelector('#us-active').onclick = () => {
        if (member.id === AUTH.profile.id || protectedLocked) return;
        active = !active;
        root.querySelector('#us-active').classList.toggle('is-on', active);
      };
      root.querySelector('#us-venues').addEventListener('click', event => {
        const button = event.target.closest('[data-venue]'); if (!button || !isEmployee || protectedLocked) return;
        const venueId = button.dataset.venue;
        if (picked.has(venueId)) picked.delete(venueId); else picked.add(venueId);
        button.classList.toggle('chip-accent', picked.has(venueId));
      });
      root.querySelector('#us-name').focus();
      root.querySelector('[data-x=save]').onclick = async () => {
        const saveButton = root.querySelector('[data-x=save]');
        const name = root.querySelector('#us-name').value.trim();
        const phone = root.querySelector('#us-phone').value.trim();
        if (!name) { toast('A display name is required', 'warn'); return; }
        saveButton.disabled = true;
        try {
          const profileResult = await DB.from('profiles').update({ display_name: name, phone: phone || null, active })
            .eq('id', member.id).select('id,active').maybeSingle();
          if (profileResult.error) throw profileResult.error;
          if (!profileResult.data) throw new Error('The profile was not updated; RLS may have denied the operation.');

          if (isEmployee && !protectedLocked) {
            const current = new Set(member.explicitVenueIds);
            const added = [...picked].filter(venueId => !current.has(venueId));
            const removed = [...current].filter(venueId => !picked.has(venueId));
            for (const venueId of added) {
              const result = await DB.from('venue_members').insert({ venue_id: venueId, user_id: member.id });
              if (result.error && result.error.code !== '23505') throw result.error;
            }
            for (const venueId of removed) {
              const result = await DB.from('venue_members').delete()
                .eq('venue_id', venueId).eq('user_id', member.id);
              if (result.error) throw result.error;
              await clearSupabaseFutureRoster(member.id, [venueId]);
            }
            if (!active) await clearSupabaseFutureRoster(member.id, member.venueIds);
          }

          await loadSupabaseTeam();
          await loadSupabaseToday();
          if (SUPABASE_ROSTER_WEEK.start === R.rosterWeekStart) await loadSupabaseRosterWeek(R.rosterWeekStart, true);
          closeModal();
          render();
          toast(`${name.split(' ')[0]} updated`, 'ok');
        } catch (error) {
          console.error('[supabase] team member update failed', { userId: member.id, error });
          refreshSupabaseAccessAfterDeniedOperation(error, 'team-member-update');
          toast('Could not save that team member. Please try again.', 'warn');
          saveButton.disabled = false;
        }
      };
    }
  });
}

function openCopyTemplate() {
  const others = venueCatalog().filter(v => v.id !== V().id &&
    (!isSupabaseMode() || v.organisationRole === 'manager'));
  if (!others.length) { toast('There is only one venue', 'warn'); return; }
  let src = others[0].id, lists = { open: true, close: true };

  openModal(`
    <div class="modal-head"><div style="flex:1">
      <div class="modal-title">Copy shift tasks</div>
      <div class="modal-sub">Into <b>${esc(V().name)}</b>. Copied tasks are added — nothing already there is removed.</div>
    </div><button class="iconbtn" data-x="close" aria-label="Close">${ic('x', 18)}</button></div>
    <div class="modal-body stack" style="gap:13px">
      <div class="field"><label class="label" for="cp-src">Copy from</label>
        <select class="select" id="cp-src">${others.map(v =>
          `<option value="${v.id}">${esc(v.name)} — ${TPL(v.id).open.length + TPL(v.id).close.length} tasks</option>`).join('')}</select></div>
      <div class="field"><label class="label">Which shifts</label>
        <div class="row wrap" style="gap:6px" id="cp-lists">
          ${['open','close'].map(k => `<button class="chip chip-accent" data-k="${k}" style="cursor:pointer;height:28px;padding:0 11px">${LIST_META[k].full}</button>`).join('')}
        </div></div>
    </div>
    <div class="modal-foot"><button class="btn" data-x="close">Cancel</button>
      <button class="btn btn-primary" data-x="save">Copy across</button></div>`, {
    after(root) {
      root.querySelectorAll('[data-x=close]').forEach(b => b.onclick = closeModal);
      root.querySelector('#cp-src').onchange = e => { src = e.target.value; };
      root.querySelector('#cp-lists').addEventListener('click', e => {
        const b = e.target.closest('[data-k]'); if (!b) return;
        lists[b.dataset.k] = !lists[b.dataset.k];
        b.classList.toggle('chip-accent', lists[b.dataset.k]);
      });
      root.querySelector('[data-x=save]').onclick = async () => {
        if (!lists.open && !lists.close) { toast('Pick at least one shift', 'warn'); return; }
        const saveButton = root.querySelector('[data-x=save]');
        if (isSupabaseMode()) {
          saveButton.disabled = true;
          let copied = 0;
          try {
            for (const k of ['open', 'close']) {
              if (!lists[k]) continue;
              const destination = TPL()[k];
              const have = new Set(destination.map(t => routineTaskKey(t)));
              let nextOrder = destination.length;
              for (const task of TPL(src)[k]) {
                const key = routineTaskKey(task);
                if (have.has(key)) continue;
                await insertRemoteTemplateTask(k, {
                  sortOrder: nextOrder++,
                  title: task.title,
                  detail: task.detail,
                  critical: task.critical
                }, V().id);
                have.add(key);
                copied++;
              }
            }
            await refreshRemoteTemplates();
            closeModal();
            toast(copied ? `${plural(copied, 'task')} copied from ${venue(src).name}` : 'Nothing new to copy', copied ? 'ok' : 'warn');
          } catch (error) {
            console.error('[supabase] template copy failed', { sourceVenueId: src, error });
            refreshSupabaseAccessAfterDeniedOperation(error, 'template-copy');
            toast('Could not copy those routine tasks. Please try again.', 'warn');
            saveButton.disabled = false;
          }
          return;
        }
        let n = 0;
        ['open','close'].forEach(k => {
          if (!lists[k]) return;
          const have = new Set(TPL()[k].map(t => t.title.toLowerCase()));
          TPL(src)[k].forEach(t => {
            if (have.has(t.title.toLowerCase())) return;
            TPL()[k].push({ id: uid('t'), title: t.title, detail: t.detail, critical: t.critical });
            n++;
          });
        });
        save(); closeModal(); render();
        toast(n ? `${plural(n, 'task')} copied from ${venue(src).name}` : 'Nothing new to copy', n ? 'ok' : 'warn');
      };
    }
  });
}

function toggleTask(lk, id) {
  const day = today(), L = day.lists[lk];
  if (L.submitted) { toast('This shift is submitted — reopen it to make changes', 'warn'); return; }
  if (!me().active) { toast('This account is disabled', 'warn'); return; }
  const t = L.tasks.find(x => x.id === id); if (!t) return;
  if (isSupabaseMode()) {
    if (REMOTE_MUTATIONS.has(t.id)) return;
    REMOTE_MUTATIONS.add(t.id);
    const previous = { status: t.status, doneBy: t.doneBy, doneAt: t.doneAt, reason: t.reason };
    if (t.status === 'done') { t.status = 'pending'; t.doneBy = null; t.doneAt = null; }
    else { t.status = 'done'; t.doneBy = me().id; t.doneAt = new Date().toISOString(); t.reason = ''; }
    persistRemoteTask(t).then(() => {
      render();
    }).catch(error => {
      Object.assign(t, previous);
      console.error('[supabase] task status update failed', { taskId: id, error });
      refreshSupabaseAccessAfterDeniedOperation(error, 'task-status');
      render();
      toast('Could not save that task change. Please try again.', 'warn');
    }).finally(() => REMOTE_MUTATIONS.delete(t.id));
    return;
  }
  if (t.status === 'done') { t.status = 'pending'; t.doneBy = null; t.doneAt = null; }
  else { t.status = 'done'; t.doneBy = me().id; t.doneAt = new Date().toISOString(); t.reason = ''; }
  save(); runTriggers(); render();
}

function syncTemplate(lk) {
  if (isSupabaseMode()) {
    reapplyRemoteRoutineTasks(lk);
    return;
  }
  const day = today(), L = day.lists[lk], tpl = TPL()[lk];
  const byTpl = {}; L.tasks.forEach(t => { if (t.tplId) byTpl[t.tplId] = t; });
  const kept = tpl.map(x => {
    const ex = byTpl[x.id];
    if (ex) { ex.title = x.title; ex.detail = x.detail; ex.critical = x.critical; delete byTpl[x.id]; return ex; }
    return instanceFromTemplate(x);
  });
  const orphansDone = Object.values(byTpl).filter(t => t.status === 'done');
  L.tasks = kept.concat(orphansDone, L.tasks.filter(t => t.source === 'adhoc'));
  L.completeNotified = false;
  save(); runTriggers(); render();
  toast(`${LIST_META[lk].full} synced with the template`, 'ok');
}

/* Re-apply the current Supabase template to today's snapshot. Existing task
   state and one-off tasks are retained; only missing routine snapshots are added. */
async function reapplyRemoteRoutineTasks(lk) {
  if (!isMgr()) { toast('Only a venue manager can re-apply routine tasks.', 'warn'); return; }
  const day = today(), L = day.lists[lk];
  if (L.submitted) { toast('Reopen the shift before re-applying routine tasks.', 'warn'); return; }
  const lockKey = `reapply:${L.id}`;
  if (REMOTE_MUTATIONS.has(lockKey)) return;
  const routine = (TPL()[lk] || []);
  const existingIds = new Set(L.tasks
    .filter(task => task.source === 'template' && task.tplId)
    .map(task => task.tplId));
  const existingTitles = new Set(L.tasks
    .filter(task => task.source === 'template')
    .map(routineTaskKey));
  const missing = [];
  routine.forEach(task => {
    const key = routineTaskKey(task);
    if (existingIds.has(task.id) || existingTitles.has(key)) return;
    existingTitles.add(key);
    missing.push(task);
  });
  if (!missing.length) {
    toast(`${LIST_META[lk].full} is already up to date`, 'ok');
    return;
  }

  REMOTE_MUTATIONS.add(lockKey);
  let added = 0;
  try {
    let sortOrder = nextRemoteSortOrder(L);
    for (const task of missing) {
      const remoteTask = await insertRemoteDailyTask(L, {
        sortOrder: sortOrder++,
        title: task.title,
        detail: task.detail || '',
        critical: !!task.critical,
        source: 'template',
        templateTaskId: task.id
      });
      L.tasks.push(remoteTask);
      added++;
    }
    await loadSupabaseToday();
    render();
    toast(`${plural(added, 'routine task')} added to ${LIST_META[lk].full}`, 'ok');
  } catch (error) {
    console.error('[supabase] routine task re-apply failed', { checklistId: L.id, listType: lk, error });
    refreshSupabaseAccessAfterDeniedOperation(error, 'routine-reapply');
    try { await loadSupabaseToday(); }
    catch (reloadError) { console.error('[supabase] routine task re-apply resync failed', reloadError); }
    render();
    toast('Could not re-apply routine tasks. Please try again.', 'warn');
  } finally {
    REMOTE_MUTATIONS.delete(lockKey);
  }
}

async function toggleRemoteRoster(lk, userId, workDate, venueId) {
  if (!isMgr()) { toast('Only a manager can change the roster.', 'warn'); return; }
  const context = venueCatalog().find(item => item.realId === venueId) || V();
  const member = supabaseMemberForUser(userId, context.organisationId);
  if (!member || member.role !== 'employee' || !member.active || !member.venueIds.includes(context.realId)) {
    toast('That employee is not active or does not have access to this venue.', 'warn');
    return;
  }
  const date = workDate || dayKey();
  const currentDay = date === dayKey() ? today() : null;
  const existingId = currentDay && currentDay.rosterAssignmentIds && currentDay.rosterAssignmentIds[lk]
    ? currentDay.rosterAssignmentIds[lk][userId]
    : (SUPABASE_ROSTER_WEEK.rows || []).find(row =>
      row.venue_id === context.realId && row.user_id === userId && row.work_date === date && row.shift_type === lk
    )?.id;
  const lockKey = `roster:${context.realId}:${date}:${lk}:${userId}`;
  if (REMOTE_MUTATIONS.has(lockKey)) return;
  REMOTE_MUTATIONS.add(lockKey);
  try {
    if (existingId) {
      const result = await DB.from('roster_assignments').delete().eq('id', existingId);
      if (result.error) throw result.error;
    } else {
      const result = await DB.from('roster_assignments').insert({
        id: crypto.randomUUID(), venue_id: context.realId, user_id: userId,
        work_date: date, shift_type: lk
      });
      if (result.error && result.error.code !== '23505') throw result.error;
    }
    if (date === dayKey()) await loadSupabaseToday();
    if (SUPABASE_ROSTER_WEEK.start === R.rosterWeekStart) {
      await loadSupabaseRosterWeek(R.rosterWeekStart, true);
    }
    render();
    toast(`${member.displayName.split(' ')[0]} ${existingId ? 'removed from' : 'added to'} the ${LIST_META[lk].label.toLowerCase()} shift`, 'ok');
  } catch (error) {
    console.error('[supabase] roster assignment change failed', { venueId: context.realId, date, userId, listType: lk, error });
    refreshSupabaseAccessAfterDeniedOperation(error, 'roster-mutation');
    toast('Could not save that roster change. Please try again.', 'warn');
  } finally {
    REMOTE_MUTATIONS.delete(lockKey);
  }
}

async function toggleRemoteMemberActive(userId, organisationId) {

  const profile = SUPABASE_TEAM.profilesById[userId];
  if (!member && !profile) return;
  if (isProtectedProfile(userId) && userId !== AUTH.profile.id) {
    toast('The master administrator account is protected by DailyOps security policy.', 'warn');
    return;
  }
  if (userId === AUTH.profile.id) { toast('You cannot disable your own signed-in access.', 'warn'); return; }
  const lockKey = `member-active:${organisationId || 'global'}:${userId}`;
  if (REMOTE_MUTATIONS.has(lockKey)) return;
  REMOTE_MUTATIONS.add(lockKey);
  try {
    const active = !(member ? member.active : profile.active);
    const result = await DB.from('profiles').update({ active }).eq('id', userId).select('id,active').maybeSingle();
    if (result.error) throw result.error;
    if (!result.data) throw new Error('The profile active state was not updated; RLS may have denied the operation.');
    if (!active) {
      const directoryMember = isPlatformAdmin() ? supabaseDirectoryMemberForUser(userId) : member;
      await clearSupabaseFutureRoster(userId, directoryMember ? directoryMember.venueIds : []);

    render();
    const displayName = member?.displayName || profile.display_name || profileLoginLabel(profile.email) || 'User';
    toast(`${displayName.split(' ')[0]} ${active ? 'can now access DailyOps' : 'is now inactive'}`, 'ok');
  } catch (error) {
    console.error('[supabase] team member active state update failed', { userId, error });
    refreshSupabaseAccessAfterDeniedOperation(error, 'profile-active-update');
    toast('Could not update that member’s active state. Please try again.', 'warn');
  } finally {
    REMOTE_MUTATIONS.delete(lockKey);
  }
}

      render(); toast('Could not reopen this shift. Please try again.', 'warn');

async function removeRemoteAdhocTask(lk, taskId) {
  if (!isMgr()) { toast('Only a venue manager can remove a one-off task.', 'warn'); return; }

  if (!task || task.source !== 'adhoc') { toast('Only one-off tasks can be removed.', 'warn'); return; }

      .delete()
      .eq('id', taskId)
      .eq('source', 'adhoc')
      .select('id')
      .maybeSingle();
    if (error) throw error;
    if (!data) throw new Error('The one-off task was not deleted; RLS may have denied the operation.');

async function saveSupabaseCoverRequest(lk, coveredForUserId) {
  const day = today();
  const context = V();
  const lockKey = `cover:${context.realId}:${day.date}:${lk}:${me().id}`;
  if (REMOTE_MUTATIONS.has(lockKey)) return;
  REMOTE_MUTATIONS.add(lockKey);
  try {
    const assignmentResult = await DB.from('roster_assignments').insert({
      id: crypto.randomUUID(), venue_id: context.realId, user_id: me().id,
      work_date: day.date, shift_type: lk
    });
    if (assignmentResult.error && assignmentResult.error.code !== '23505') throw assignmentResult.error;

    const requestPayload = {
      id: crypto.randomUUID(), venue_id: context.realId, user_id: me().id,
      covered_for_user_id: coveredForUserId, work_date: day.date, shift_type: lk
    };
    const requestResult = await DB.from('shift_cover_requests')
      .insert(requestPayload)
      .select('id')
      .maybeSingle();
    let coverRequestId = requestResult.data?.id || null;
    if (requestResult.error && requestResult.error.code === '23505') {
      const existing = await DB.from('shift_cover_requests')
        .select('id')
        .eq('venue_id', context.realId)
        .eq('user_id', me().id)
        .eq('work_date', day.date)
        .eq('shift_type', lk)
        .single();
      if (existing.error) throw existing.error;
      coverRequestId = existing.data.id;
    } else if (requestResult.error) {
      throw requestResult.error;
    }
    if (!coverRequestId) throw new Error('Cover request was not returned by Supabase');

    await loadSupabaseToday();
    await loadSupabaseMyRosterWeek(SUPABASE_MY_ROSTER_WEEK.start || rosterWeekStartKey(dayKey()), true);
    render();
    await requestSupabaseShiftCoverNotification(coverRequestId);
    toast(`You're on the ${LIST_META[lk].label.toLowerCase()} shift — manager notified`, 'ok');
  } catch (error) {
    console.error('[supabase] self-cover request failed', { venueId: context.realId, listType: lk, error });
    refreshSupabaseAccessAfterDeniedOperation(error, 'cover-request');
    toast('Could not save your cover request. Please try again.', 'warn');
  } finally {
    REMOTE_MUTATIONS.delete(lockKey);
  }
}

async function coverShift(lk) {
  if (isSupabaseMode()) {
    openSupabaseCoverModal(lk);
    return;
  }
  const day = today(), list = day.roster[lk];
  if (list.includes(me().id)) return;
  list.push(me().id); save(); render(); toast(`You're on the ${LIST_META[lk].label.toLowerCase()} shift`, 'ok');
}

async function tickAll(lk) {
  const L = today().lists[lk];
  if (L.submitted) { toast('Reopen the shift first', 'warn'); return; }
  const changed = L.tasks.filter(t => t.status !== 'done');
  if (isSupabaseMode()) {
    const previous = changed.map(t => ({ task: t, status: t.status, doneBy: t.doneBy, doneAt: t.doneAt, reason: t.reason }));
    changed.forEach(t => { t.status = 'done'; t.doneBy = me().id; t.doneAt = new Date().toISOString(); t.reason = ''; });
    try {
      await Promise.all(changed.map(t => persistRemoteTask(t)));
      render();
    } catch (error) {
      previous.forEach(x => Object.assign(x.task, { status: x.status, doneBy: x.doneBy, doneAt: x.doneAt, reason: x.reason }));
      console.error('[supabase] task bulk update failed', { checklistId: L.id, error });
      refreshSupabaseAccessAfterDeniedOperation(error, 'task-bulk-update');
      try { await loadSupabaseToday(); }
      catch (reloadError) { console.error('[supabase] checklist resync after bulk update failure failed', reloadError); }
      render(); toast('Could not save all task changes. Please try again.', 'warn');
    }
    return;
  }
  changed.forEach(t => { t.status = 'done'; t.doneBy = me().id; t.doneAt = new Date().toISOString(); t.reason = ''; });
  save(); runTriggers(); render();
}

function handleAct(act, ds) {
  const day = today();
  switch (act) {
    case 'review':    openReview(ds.list); break;
    case 'task-meta': openTaskMeta(ds.list, ds.id); break;
    case 'add-task':  openAddTask(ds.list || R.list); break;
    case 'del-task': {
      if (isSupabaseMode()) { removeRemoteAdhocTask(ds.list, ds.id); break; }
      const L = day.lists[ds.list];
      const task = L.tasks.find(item => item.id === ds.id);
      if (!task || task.source !== 'adhoc') { toast('Only one-off tasks can be removed.', 'warn'); break; }
      L.tasks = L.tasks.filter(t => t.id !== ds.id);
      save(); runTriggers(); render(); toast('Task removed'); break;
    }
    case 'cover':    coverShift(ds.list); break;
    case 'reopen':  reopenList(ds.list); break;
    case 'tick-all': tickAll(ds.list); break;
    case 'sync-tpl':  syncTemplate(ds.list); break;
    case 'eod': {
      if (isSupabaseMode()) { toast('End-of-day Telegram summary is sent by the scheduled server job after this venue cutoff. Check Alerts for delivery status.', 'info'); R.tab = 'alerts'; render(); loadSupabaseNotifications(); break; }
      if (day.reported) { toast(`${V().name} has already been reported today — see Alerts`, 'warn'); R.tab = 'alerts'; render(); break; }
      runTriggers({ forceEod: true, venueId: V().id }); render(); break;
    }
    case 'roster': {
      if (isSupabaseMode()) { toggleRemoteRoster(ds.list, ds.id); break; }
      const arr = day.roster[ds.list];
      const i = arr.indexOf(ds.id);
      if (i >= 0) arr.splice(i, 1); else arr.push(ds.id);
      save(); render(); break;
    }
    case 'create-user': {
      if (isSupabaseMode()) openSupabaseCreateUser();
      else toast('Create user is available only in Supabase mode.', 'warn');
      break;
    }
    case 'add-user':    openUserEditor(null); break;
    case 'edit-user': {
      if (isSupabaseMode() && isPlatformAdmin()) openSupabaseAdminUserAccessEditor(ds.id);
      else openUserEditor(ds.id, ds.organisation);
      break;
    }
    case 'toggle-user': {
      if (isSupabaseMode()) { toggleRemoteMemberActive(ds.id, ds.organisation); break; }
      const u = user(ds.id); u.active = !u.active;
      if (!u.active) unrosterEverywhere(ds.id);
      save(); render(); toast(`${u.name.split(' ')[0]} ${u.active ? 'can now sign in' : 'no longer has access'}`); break;
    }
    case 'toggle-user-venue': {
      if (isSupabaseMode()) { toggleRemoteVenueMembership(ds.id, ds.venue); break; }
      const u = user(ds.id), i = u.venues.indexOf(ds.venue);
      if (i >= 0) {
        if (u.venues.length < 2) { toast('They need at least one venue', 'warn'); break; }
        u.venues.splice(i, 1);
        ['open','close'].forEach(k => { const d = today(ds.venue); d.roster[k] = d.roster[k].filter(x => x !== ds.id); });
      } else u.venues.push(ds.venue);
      save(); render();
      toast(`${u.name.split(' ')[0]} ${i >= 0 ? 'removed from' : 'added to'} ${venue(ds.venue).name}`); break;
    }
    case 'roster-week-prev':
      if (isSupabaseMode()) navigateSupabaseRosterWeek(-7);
      break;
    case 'roster-week-next':
      if (isSupabaseMode()) navigateSupabaseRosterWeek(7);
      break;
    case 'roster-week-today':
      if (isSupabaseMode()) resetSupabaseRosterWeek();
      break;
    case 'roster-week-reload':
      if (isSupabaseMode()) loadSupabaseRosterWeek(R.rosterWeekStart, true);
      break;
    case 'my-roster-prev':
      if (isSupabaseMode()) navigateSupabaseMyRosterWeek(-7);
      break;
    case 'my-roster-next':
      if (isSupabaseMode()) navigateSupabaseMyRosterWeek(7);
      break;
    case 'my-roster-today':
      if (isSupabaseMode()) resetSupabaseMyRosterWeek();
      break;
    case 'my-roster-reload':
      if (isSupabaseMode()) loadSupabaseMyRosterWeek(SUPABASE_MY_ROSTER_WEEK.start, true);
      break;
    case 'roster-week':
      if (isSupabaseMode()) toggleRemoteRoster(ds.list, ds.id, ds.date, ds.venue);
      break;
    case 'del-user': {
      if (isSupabaseMode()) { toast('Deactivate the member instead so historical attribution is retained.', 'warn'); break; }
      const u = user(ds.id);
      confirmModal(`Remove ${u.name}?`, 'Their past operational history stays in the record. This cannot be undone.', 'Remove', () => {
        S.users = S.users.filter(x => x.id !== ds.id);
        unrosterEverywhere(ds.id);
        if (S.session.userId === ds.id) S.session.userId = S.users.find(x => x.role === 'manager').id;
        save(); render(); toast('Employee removed');
      }, true); break;
    }
    case 'tpl-add':  openTemplateEditor(ds.list, null); break;
    case 'tpl-edit': openTemplateEditor(ds.list, ds.id); break;
    case 'tpl-crit': {
      const t = TPL()[ds.list].find(x => x.id === ds.id);
      if (!t) break;
      if (isSupabaseMode()) {
        mutateRemoteTemplate(`template-critical:${t.id}`, { listType: ds.list, taskId: t.id },
          () => updateRemoteTemplateTask(t.id, { critical: !t.critical }),
          t.critical ? 'Routine task marked non-critical' : 'Routine task marked critical');
      } else {
        t.critical = !t.critical; save(); render();
      }
      break;
    }
    case 'tpl-del': {
      const arr = TPL()[ds.list], t = arr.find(x => x.id === ds.id);
      confirmModal('Remove from template?', `"${t.title}" will stop appearing on new ${LIST_META[ds.list].label.toLowerCase()} lists.`, 'Remove', () => {
        if (isSupabaseMode()) {
          mutateRemoteTemplate(`template-delete:${t.id}`, { listType: ds.list, taskId: t.id },
            () => deleteRemoteTemplateTask(t.id),
            'Removed from the recurring template');
        } else {
          TPL()[ds.list] = arr.filter(x => x.id !== ds.id); save(); render(); toast('Removed from the template');
        }
      }, true); break;
    }
    case 'tpl-up': case 'tpl-down': {
      const arr = TPL()[ds.list], i = arr.findIndex(x => x.id === ds.id);
      const j = act === 'tpl-up' ? i - 1 : i + 1;
      if (j < 0 || j >= arr.length) break;
      if (isSupabaseMode()) {
        const reordered = arr.slice();
        [reordered[i], reordered[j]] = [reordered[j], reordered[i]];
        mutateRemoteTemplate(`template-reorder:${ds.list}`, { listType: ds.list },
          () => Promise.all(reordered.map((task, index) => updateRemoteTemplateTask(task.id, { sort_order: index }))),
          `${LIST_META[ds.list].full} routine tasks reordered`);
      } else {
        [arr[i], arr[j]] = [arr[j], arr[i]]; save(); render();
      }
      break;
    }
    case 'view-day':
      if (isSupabaseMode()) openSupabaseHistoryDay(ds.key);
      else openDay(ds.key);
      break;
    case 'view-history-day':
      if (isSupabaseMode()) openSupabaseHistoryDay(ds.key);
      break;
    case 'history-reload':
      if (isSupabaseMode()) loadSupabaseHistory(true);
      break;
    case 'csv-all':
      if (isSupabaseMode()) {
        if (SUPABASE_HISTORY.loading || SUPABASE_HISTORY.error) { toast('Historical operations are not ready to export.', 'warn'); break; }
        exportSupabaseHistory(SUPABASE_HISTORY.days, `${V().name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-historical-operations.csv`);
      } else exportCsv(localHistoryKeys(V().id), `${V().name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-operations.csv`);
      break;
    case 'csv-group':
      if (isSupabaseMode()) { toast('Export a selected venue from its History page.', 'warn'); break; }
      exportAllVenues();
      break;
    case 'open-notif': openNotif(ds.id); break;
    case 'telegram-add': openTelegramRecipientEditor(null); break;
    case 'telegram-edit': openTelegramRecipientEditor(ds.id); break;
    case 'telegram-test': testSupabaseTelegramRecipient(ds.id); break;
    case 'telegram-recipients-refresh': loadSupabaseNotificationRecipients(); break;
    case 'telegram-delete': {
      const recipient = SUPABASE_NOTIFICATION_RECIPIENTS.rows.find(row => row.id === ds.id);
      if (!recipient) break;
      confirmModal(`Remove ${recipient.profile?.display_name || 'this recipient'}?`, `They will no longer receive Telegram notifications for ${V().name}.`, 'Remove', () => removeSupabaseNotificationRecipient(ds.id), true);
      break;
    }
    case 'cover-read':
      if (isSupabaseMode()) markSupabaseCoverRequests([ds.id]);
      break;
    case 'cover-refresh':
      if (isSupabaseMode()) loadSupabaseCoverRequests();
      break;
    case 'notifications-refresh':
      if (isSupabaseMode()) loadSupabaseNotifications();
      break;
    case 'mark-read':
      S.notifications.forEach(n => n.read = true);
      save();
      render();
      if (isSupabaseMode()) markSupabaseCoverRequests(SUPABASE_COVER_REQUESTS.rows
        .filter(request => !request.manager_seen_at)
        .map(request => request.id));
      break;
    case 'test-notif': {
      const built = buildEndOfDay(V(), day, false);
      built.subject = '[Test] ' + built.subject;
      Notifier.push('end-of-day', built, { dayKey: day.date });
      render(); toast('Test notification composed — open it to preview', 'ok'); break;
    }
    case 'setting-toggle': V()[ds.key] = !V()[ds.key]; save(); render(); break;
    case 'venue-accent':   V().accent = ds.key; save(); render(); break;
    case 'goto-venue': {
      if (!selectVenue(ds.id)) break;
      R.list = 'open';
      if (!isSupabaseMode()) save();
      render(); scrollTop();
      syncSupabaseRealtimeForCurrentView();
      if (isSupabaseMode() && R.tab === 'team' && isMgr()) loadSupabaseRosterWeek(R.rosterWeekStart);
      if (isSupabaseMode() && R.tab === 'history' && isMgr()) loadSupabaseHistory(true);
      toast(`Switched to ${V().name}`); break;
    }
    case 'add-venue':
    case 'edit-venue':
    case 'del-venue': {
      if (isSupabaseMode()) { toast('Venue administration is deferred; this screen is read-only in Supabase mode.', 'warn'); break; }
      if (act === 'add-venue') openVenueEditor(null);
      else if (act === 'edit-venue') openVenueEditor(ds.id);
      else {
        if (S.venues.length < 2) { toast('You need at least one venue', 'warn'); break; }
        const v = venue(ds.id);
        confirmModal(`Remove ${v.name}?`, 'Its shift tasks, roster and history go with it. Alerts already sent are kept. This cannot be undone.', 'Remove venue', () => {
          S.venues = S.venues.filter(x => x.id !== ds.id);
          delete S.templates[ds.id]; delete S.days[ds.id];
          S.users.forEach(u => { u.venues = u.venues.filter(x => x !== ds.id); });
          S.users.filter(u => u.role === 'employee' && !u.venues.length).forEach(u => { u.venues = [S.venues[0].id]; });
          if (S.session.venueId === ds.id) S.session.venueId = S.venues[0].id;
          save(); render(); toast(`${v.name} removed`);
        }, true);
      }
      break;
    }
    case 'copy-tpl': {
      openCopyTemplate(); break;
    }
    case 'reset-day': {
      if (isSupabaseMode()) { openSupabaseResetConfirmation(); break; }
      confirmModal(`Reset today at ${V().name}?`, 'Both lists go back to the template with nothing ticked. Other venues and all history are untouched.', 'Reset today', () => {
        const roster = DAYS()[dayKey()].roster;
        DAYS()[dayKey()] = makeDay(dayKey(), roster, V().id);
        save(); render(); toast(`Today reset for ${V().name}`, 'ok');
      }, true); break;
    }
    case 'reset-all': {
      if (isSupabaseMode()) { toast('Demo reset is unavailable while using real Supabase venue identity.', 'warn'); break; }
      confirmModal('Wipe all demo data?', 'Everything goes back to the seeded demo — staff, templates, history and alerts.', 'Wipe and reseed', () => {
        localStorage.removeItem(STORE_KEY); S = defaultState(); save();
        R = { tab: 'today', list: 'open', historyKey: null };
        render(); toast('Demo data reset', 'ok');
      }, true); break;
    }
  }
}

function scrollTop() { const c = $('#content'); if (c) c.scrollTop = 0; }

async function saveSupabaseVenueCutoff(value) {
  if (!isPlatformAdmin()) {
    render();
    toast('Only an active platform admin can change the venue cutoff.', 'warn');
    return;
  }
  if (!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(value)) {
    render();
    toast('Enter a valid cutoff time in 24-hour format.', 'warn');
    return;
  }
  const context = V();
  const lockKey = 'venue-cutoff:' + context.realId;
  if (REMOTE_MUTATIONS.has(lockKey)) return;
  REMOTE_MUTATIONS.add(lockKey);
  try {
    const result = await DB.from('venues')
      .update({ cutoff_time: value })
      .eq('id', context.realId)
      .select('id,cutoff_time')
      .single();
    if (result.error) throw result.error;
    context.cutoff = String(result.data.cutoff_time || value).slice(0, 5);
    render();
    toast('End-of-day cutoff saved', 'ok');
  } catch (error) {
    console.error('[supabase] venue cutoff update failed', { venueId: context.realId, error });
    refreshSupabaseAccessAfterDeniedOperation(error, 'venue-settings');
    render();
    toast('Could not save the end-of-day cutoff.', 'warn');
  } finally {
    REMOTE_MUTATIONS.delete(lockKey);
  }
}

async function resetSupabaseTodayOperations() {
  if (!isSupabaseMode() || !DB || !isMgr()) return false;
  const context = V();
  const lockKey = 'reset-today:' + context.realId;
  if (REMOTE_MUTATIONS.has(lockKey)) return false;
  REMOTE_MUTATIONS.add(lockKey);
  let resetCompleted = false;
  try {
    const result = await DB.rpc('reset_today_operations', {
      p_venue_id: context.realId
    });
    if (result.error) throw result.error;
    resetCompleted = true;
    await loadSupabaseToday();
    render();
    syncSupabaseRealtimeForCurrentView();
    toast(`Today's Opening and Closing Shifts reset for ${context.name}`, 'ok');
    return true;
  } catch (error) {
    console.error('[supabase] reset today operations failed', {
      venueId: context.realId,
      error
    });
    refreshSupabaseAccessAfterDeniedOperation(error, 'reset-today');
    render();
    toast(
      resetCompleted
        ? 'Today was reset, but the refreshed data could not be loaded. Please refresh.'
        : 'Could not reset today\'s operations. No changes were applied.',
      'warn'
    );
    return false;
  } finally {
    REMOTE_MUTATIONS.delete(lockKey);
  }
}

function openSupabaseResetConfirmation() {
  if (!isSupabaseMode() || !isMgr()) {
    toast('Only a venue manager can reset today\'s operations.', 'warn');
    return;
  }
  const context = V();
  openModal(`
    <div class="modal-head"><div style="flex:1">
      <div class="modal-title">Reset today at ${esc(context.name)}?</div>
      <div class="modal-sub">This is a destructive reset for both shifts.</div>
    </div><button class="iconbtn" data-x="cancel" aria-label="Close">${ic('x', 18)}</button></div>
    <div class="modal-body">
      <div class="banner banner-warn">${ic('warn', 17)}<div>
        <b>All current-day progress will be discarded.</b> Opening and Closing Shift tasks will be rebuilt from the current active templates. One-off tasks, notes, reasons, completion details, submitted state and reopen details will be removed. Historical Telegram audit records will be kept. This cannot be undone.
      </div></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-x="cancel">Cancel</button>
      <button class="btn btn-danger" data-x="reset">Reset both shifts</button>
    </div>`, {
    after(root) {
      root.querySelectorAll('[data-x=cancel]').forEach(button => button.onclick = closeModal);
      root.querySelector('[data-x=reset]').onclick = async () => {
        const resetButton = root.querySelector('[data-x=reset]');
        const cancelButtons = root.querySelectorAll('[data-x=cancel]');
        resetButton.disabled = true;
        resetButton.textContent = 'Resetting…';
        cancelButtons.forEach(button => { button.disabled = true; });
        try {
          await resetSupabaseTodayOperations();
        } finally {
          closeModal();
        }
      };
    }
  });
}
