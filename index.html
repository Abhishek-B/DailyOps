<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DailyOps — Shift Checklist</title>
<meta name="description" content="DailyOps multi-venue opening and closing shift checklist demo" />
<style>
/* ==========================================================================
   DAILYOPS — SHIFT CHECKLIST
   Single-file demo. Design tokens -> layout -> components -> responsive.
   Responsive rules use @container so the "Mobile view" toggle and a genuinely
   narrow window both hit the exact same breakpoints.
   ========================================================================== */

/* ---------- reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
 [hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
h1,h2,h3,h4,p,figure { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent-soft); color: var(--ink); }

/* ---------- tokens ---------- */
:root {
  --bg:          #F6F7FB;
  --backdrop:    #EDEFF6;
  --surface:     #FFFFFF;
  --surface-2:   #F8F9FC;
  --surface-3:   #EEF1F7;
  --ink:         #151A27;
  --ink-2:       #465066;
  --muted:       #7E899F;
  --line:        #E2E6EF;
  --line-2:      #D3D9E6;

  /* --accent / --accent-hi / --accent-ink are overwritten per venue at runtime
     (see applyVenueAccent). Everything else derives from them. */
  --accent:      #B8451F;
  --accent-hi:   #C8532B;
  --accent-ink:  #FFFFFF;
  --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--surface));
  --accent-line: color-mix(in srgb, var(--accent) 32%, var(--surface));

  --ok:          #1A7F43;
  --ok-soft:     #E2F4E9;
  --warn:        #A25B06;
  --warn-soft:   #FBEEDA;
  --danger:      #B3261E;
  --danger-soft: #FBE6E4;
  --info:        #1F4FBF;
  --info-soft:   #E6ECFC;

  --focus:       var(--accent);
  --shadow-sm:   0 1px 2px rgba(26,21,18,.06), 0 1px 3px rgba(26,21,18,.04);
  --shadow-md:   0 2px 4px rgba(26,21,18,.05), 0 8px 20px rgba(26,21,18,.07);
  --shadow-lg:   0 12px 40px rgba(26,21,18,.16), 0 2px 8px rgba(26,21,18,.08);

  --r-sm: 9px; --r-md: 13px; --r-lg: 18px; --r-xl: 24px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
html[data-theme="dark"] {
  --bg:          #0B1020;
  --backdrop:    #080C18;
  --surface:     #11182B;
  --surface-2:   #151F36;
  --surface-3:   #1B2741;
  --ink:         #F5F7FB;
  --ink-2:       #C8D0DF;
  --muted:       #91A0BA;
  --line:        #26324B;
  --line-2:      #34425F;

  --accent:      #F08A5D;
  --accent-hi:   #F79C72;
  --accent-ink:  #2A1006;
  --accent-soft: color-mix(in srgb, var(--accent) 20%, var(--surface));
  --accent-line: color-mix(in srgb, var(--accent) 38%, var(--surface));

  --ok:          #56C98A;
  --ok-soft:     #17301F;
  --warn:        #E5A63C;
  --warn-soft:   #33260F;
  --danger:      #F4776D;
  --danger-soft: #351B19;
  --info:        #86A9F5;
  --info-soft:   #1A2340;

  --focus:       var(--accent);
  --shadow-sm:   0 1px 2px rgba(0,0,0,.4);
  --shadow-md:   0 2px 4px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.35);
  --shadow-lg:   0 16px 48px rgba(0,0,0,.55);
}

body {
  font-family: var(--sans);
  background: var(--backdrop);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.45;
}

/* ---------- shell ---------- */
.viewport { height: 100dvh; display: flex; align-items: center; justify-content: center; }
.frame { width: 100%; height: 100%; background: var(--bg); position: relative; }
.app {
  position: relative; height: 100%; display: flex; flex-direction: column;
  overflow: hidden; container-type: inline-size; container-name: app;
  background: var(--bg);
}
.auth-screen {
  min-height: 100%; display: grid; place-items: center; padding: 24px;
  background: var(--bg);
}
.auth-card {
  width: min(100%, 420px); padding: 28px; border: 1px solid var(--line);
  border-radius: var(--r-xl); background: var(--surface); box-shadow: var(--shadow-md);
}
.auth-brand { display: flex; align-items: center; gap: 11px; margin-bottom: 24px; }
.auth-brand .logo { width: 42px; height: 42px; }
.auth-title { font-size: 24px; font-weight: 720; letter-spacing: -.03em; }
.auth-sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.auth-error { color: var(--danger); background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--surface)); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13px; }
.auth-card .btn { width: 100%; justify-content: center; }
.statusbar { display: none; }

/* mobile-view toggle: shrink the frame; container queries do the rest */
body.mobile-view .viewport {
  background:
    radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
    var(--backdrop);
  padding: 20px;
}
body.mobile-view .frame {
  width: 402px; height: min(852px, 100dvh - 40px);
  border-radius: 46px; border: 11px solid #0B0908;
  box-shadow: var(--shadow-lg), 0 0 0 2px #2B2523, inset 0 0 0 1px rgba(255,255,255,.06);
  overflow: hidden;
}
body.mobile-view .app { border-radius: 35px; }
body.mobile-view .statusbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 30px 4px; font-size: 13px; font-weight: 650; letter-spacing: .01em;
  color: var(--ink); background: var(--surface); flex: 0 0 auto;
}
.statusbar .sb-right { display: flex; align-items: center; gap: 5px; }

/* ---------- top bar ---------- */
.topbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
  padding: 12px 18px; background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo {
  width: 34px; height: 34px; border-radius: 11px; flex: 0 0 auto;
  background: linear-gradient(140deg, var(--accent-hi), var(--accent));
  color: var(--accent-ink); display: grid; place-items: center;
  font-weight: 800; font-size: 15px; letter-spacing: -.03em;
  box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent);
}
.brand-text { min-width: 0; }
.brand-name { font-weight: 680; font-size: 14.5px; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-spacer { flex: 1 1 auto; }
.topbar-actions { display: flex; align-items: center; gap: 6px; }

.iconbtn {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  color: var(--ink-2); border: 1px solid transparent; position: relative; flex: 0 0 auto;
  transition: background .14s, color .14s, border-color .14s;
}
.iconbtn:hover { background: var(--surface-3); color: var(--ink); }
.iconbtn.is-on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.dot-badge {
  position: absolute; top: 5px; right: 5px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: var(--accent); color: var(--accent-ink);
  font-size: 10px; font-weight: 750; display: grid; place-items: center;
  border: 2px solid var(--surface);
}

/* pickers — a native <select> laid invisibly over styled chrome, so mobile gets
   the OS picker while the button still looks like the rest of the app */
.pickwrap {
  position: relative; display: flex; align-items: center; gap: 8px; min-width: 0;
  padding: 4px 9px 4px 4px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface-2); transition: border-color .14s, background .14s;
}
.pickwrap:hover { border-color: var(--line-2); background: var(--surface-3); }
.pickwrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.pickwrap select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; }
.pickwrap.is-single { pointer-events: none; }
.pickwrap.is-single .pick-chev { display: none; }
.pick-text { min-width: 0; }
.pick-name { font-size: 13px; font-weight: 645; letter-spacing: -.014em; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-sub { font-size: 10.5px; color: var(--muted); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-chev { color: var(--muted); flex: 0 0 auto; }

/* venue colour picker */
.swatches { display: flex; gap: 9px; flex-wrap: wrap; }
.swatch { width: 32px; height: 32px; border-radius: 10px; border: 2px solid transparent; outline-offset: 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); transition: transform .12s; }
.swatch:hover { transform: scale(1.06); }
.swatch.is-sel { border-color: var(--ink); }
.venue-row { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.venue-row:last-child { border-bottom: 0; }
.venue-dot { width: 11px; height: 11px; border-radius: 999px; flex: 0 0 auto; }

/* cross-venue strip */
.vstrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; padding: 15px 17px 17px; }
.vcard { text-align: left; padding: 12px 13px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); transition: border-color .14s, background .14s; min-width: 0; }
.vcard:hover { border-color: var(--line-2); background: var(--surface-3); }
.vcard.is-current { border-color: var(--accent); background: var(--accent-soft); }
.vcard-name { font-size: 13.5px; font-weight: 645; letter-spacing: -.015em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.vcard-num { display: block; font-size: 21px; font-weight: 720; letter-spacing: -.032em; margin-top: 7px; font-variant-numeric: tabular-nums; }
.avatar {
  width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center;
  font-size: 11.5px; font-weight: 700; letter-spacing: -.02em; flex: 0 0 auto;
  background: var(--surface-3); color: var(--ink-2); border: 1px solid var(--line);
}
.avatar.is-mgr { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.avatar.sm { width: 22px; height: 22px; font-size: 9.5px; }
.avatar.lg { width: 40px; height: 40px; font-size: 15px; }

/* ---------- body / nav ---------- */
.shell { flex: 1 1 auto; display: flex; min-height: 0; }
.sidebar {
  flex: 0 0 216px; border-right: 1px solid var(--line); background: var(--surface);
  padding: 14px 12px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto;
}
.nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 6px; }
.navitem {
  display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 10px;
  color: var(--ink-2); font-size: 14px; font-weight: 560; text-align: left; width: 100%;
  transition: background .14s, color .14s;
}
.navitem:hover { background: var(--surface-3); color: var(--ink); }
.navitem.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 660; }
.navitem svg { flex: 0 0 auto; }
.navitem .count { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.sidebar-foot { margin-top: auto; padding: 10px 4px 2px; }

.content { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
.page { max-width: 1080px; margin: 0 auto; padding: 26px 26px 90px; }
.bottomnav { display: none; }

/* ---------- typography ---------- */
.page-head { margin-bottom: 20px; }
.page-title { font-size: 25px; font-weight: 700; letter-spacing: -.032em; line-height: 1.15; }
.page-sub { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.sec-title { font-size: 12px; font-weight: 720; letter-spacing: .075em; text-transform: uppercase; color: var(--muted); }
.h3 { font-size: 15.5px; font-weight: 660; letter-spacing: -.018em; }
.mut { color: var(--muted); }
.tiny { font-size: 12px; }
.nowrap { white-space: nowrap; }

/* ---------- cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  backdrop-filter: saturate(120%);
}
.card-head { display: flex; align-items: center; gap: 12px; padding: 15px 17px; border-bottom: 1px solid var(--line); }
.card-body { padding: 17px; }
.card-foot { padding: 13px 17px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; }
.row-b { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wrap { flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 38px; padding: 0 15px; border-radius: 10px; font-size: 13.5px; font-weight: 620;
  letter-spacing: -.005em; border: 1px solid var(--line-2); background: var(--surface);
  color: var(--ink); transition: background .14s, border-color .14s, transform .1s, box-shadow .14s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 1px 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn-primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.btn-danger:hover { background: var(--danger-soft); }
.btn-sm { height: 31px; padding: 0 11px; font-size: 12.5px; border-radius: 8px; gap: 5px; }
.btn-lg { height: 46px; padding: 0 22px; font-size: 15px; border-radius: 12px; }
.btn-block { width: 100%; }
.btn-icon { width: 31px; padding: 0; }

/* ---------- form ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 12.5px; font-weight: 620; color: var(--ink-2); }
.input, .select, .textarea {
  width: 100%; height: 38px; padding: 0 11px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-size: 14px; transition: border-color .14s, box-shadow .14s;
}
.textarea { height: auto; min-height: 70px; padding: 9px 11px; resize: vertical; line-height: 1.45; }
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
}
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.select { appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 15px) 17px, calc(100% - 10px) 17px;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.hint { font-size: 11.5px; color: var(--muted); }

.switch { position: relative; width: 40px; height: 23px; border-radius: 999px; background: var(--line-2); transition: background .18s; flex: 0 0 auto; }
.switch::after { content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 18px; height: 18px; border-radius: 999px; background: #fff; box-shadow: var(--shadow-sm); transition: transform .18s; }
.switch.is-on { background: var(--accent); }
.switch.is-on::after { transform: translateX(17px); }

/* ---------- segmented ---------- */
.segmented { display: flex; gap: 4px; padding: 4px; background: var(--surface-3); border-radius: 13px; border: 1px solid var(--line); }
.segmented button {
  flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; border-radius: 9px; font-size: 14px; font-weight: 620; color: var(--muted);
  letter-spacing: -.01em; transition: background .16s, color .16s, box-shadow .16s;
}
.segmented button:hover { color: var(--ink); }
.segmented button.is-active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.segmented .seg-count { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-3); color: var(--muted); }
.segmented button.is-active .seg-count { background: var(--accent-soft); color: var(--accent); }
/* dark theme reverses the raised/recessed relationship, so flip the fills */
html[data-theme="dark"] .segmented,
html[data-theme="dark"] .pill-toggle { background: #161312; }
html[data-theme="dark"] .segmented button.is-active,
html[data-theme="dark"] .pill-toggle button.is-active { background: var(--surface-3); }
html[data-theme="dark"] .segmented button.is-active .seg-count { background: var(--accent-soft); }

/* ---------- chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px;
  border-radius: 999px; font-size: 11px; font-weight: 660; letter-spacing: .005em;
  background: var(--surface-3); color: var(--muted); border: 1px solid transparent; white-space: nowrap;
}
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.chip-ok     { background: var(--ok-soft); color: var(--ok); }
.chip-warn   { background: var(--warn-soft); color: var(--warn); }
.chip-danger { background: var(--danger-soft); color: var(--danger); }
.chip-info   { background: var(--info-soft); color: var(--info); }
.chip-dot::before { content:""; width: 5px; height: 5px; border-radius: 999px; background: currentColor; }

/* ---------- progress ---------- */
.bar { height: 7px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .5s cubic-bezier(.3,.9,.3,1); }
.bar.is-done > i { background: var(--ok); }
.ring { position: relative; flex: 0 0 auto; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring .track { stroke: var(--surface-3); }
.ring .prog { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.3,.9,.3,1); }
.ring.is-done .prog { stroke: var(--ok); }
.ring .ring-label { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 720; letter-spacing: -.03em; }

/* ---------- task rows ---------- */
.tasklist { display: flex; flex-direction: column; }
.task {
  display: flex; align-items: flex-start; gap: 13px; padding: 13px 16px;
  border-bottom: 1px solid var(--line); transition: background .14s; position: relative;
  cursor: pointer; text-align: left; width: 100%;
}
.task:last-child { border-bottom: 0; }
.task:hover { background: var(--surface-2); }
.task.is-locked { cursor: default; }
.task.is-locked:hover { background: transparent; }
.tick {
  width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line-2);
  flex: 0 0 auto; margin-top: 1px; display: grid; place-items: center; color: transparent;
  transition: background .16s, border-color .16s, color .16s, transform .16s;
}
.task:hover .tick { border-color: var(--accent); }
.task.is-done .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
.task.is-flag .tick { background: var(--surface-3); border-color: var(--line-2); color: var(--muted); }
.task-main { flex: 1 1 auto; min-width: 0; }
.task-title { font-size: 14.5px; font-weight: 560; letter-spacing: -.012em; color: var(--ink); }
.task.is-done .task-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--line-2); }
.task-detail { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.task-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 7px; font-size: 11.5px; color: var(--muted); }
.task-note { margin-top: 7px; padding: 8px 10px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
.task-note b { font-weight: 640; }
.task-side { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.task-critical-mark { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .8; }

/* ---------- sticky action bar ---------- */
.actionbar {
  position: sticky; bottom: 0; margin: 18px -26px -90px; padding: 14px 26px calc(14px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px;
}
.actionbar .ab-text { flex: 1 1 auto; min-width: 0; }

/* ---------- table ---------- */
.tablewrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.tbl th {
  text-align: left; font-size: 10.5px; font-weight: 720; letter-spacing: .075em;
  text-transform: uppercase; color: var(--muted); padding: 10px 14px;
  border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2);
}
table.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl tbody tr:hover { background: var(--surface-2); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- stat tiles ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { padding: 14px 15px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.stat-k { font-size: 11px; font-weight: 680; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat-v { font-size: 25px; font-weight: 720; letter-spacing: -.035em; margin-top: 3px; font-variant-numeric: tabular-nums; }
.stat-s { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

/* ---------- misc ---------- */
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty-icon { width: 44px; height: 44px; border-radius: 13px; background: var(--surface-3); display: grid; place-items: center; margin: 0 auto 12px; color: var(--muted); }
.divider { height: 1px; background: var(--line); }
.kv { display: flex; gap: 8px; font-size: 13px; }
.kv dt { color: var(--muted); min-width: 92px; }
.banner { display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px; border-radius: var(--r-md); font-size: 13px; border: 1px solid; }
.banner-info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 25%, transparent); color: var(--info); }
.banner-warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 25%, transparent); color: var(--warn); }
.banner-ok   { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, transparent); color: var(--ok); }
.banner b { font-weight: 660; }
.drag-h { color: var(--muted); cursor: grab; }
.sortrow { display: flex; flex-direction: column; gap: 1px; }
.pill-toggle { display: inline-flex; padding: 3px; gap: 3px; background: var(--surface-3); border-radius: 10px; border: 1px solid var(--line); }
.pill-toggle button { padding: 5px 11px; border-radius: 7px; font-size: 12.5px; font-weight: 620; color: var(--muted); }
.pill-toggle button.is-active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

/* ---------- modal ---------- */
.modal-root { position: absolute; inset: 0; z-index: 60; display: none; }
.modal-root.is-open { display: block; }
.scrim { position: absolute; inset: 0; background: rgba(20,14,10,.42); backdrop-filter: blur(3px); animation: fade .18s ease; }
.modal {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(560px, calc(100% - 36px)); max-height: calc(100% - 48px);
  background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; overflow: hidden; animation: pop .2s cubic-bezier(.2,.9,.3,1);
  border: 1px solid var(--line);
}
.modal.wide { width: min(720px, calc(100% - 36px)); }
.modal-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
.modal-title { font-size: 17.5px; font-weight: 700; letter-spacing: -.024em; }
.modal-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.modal-body { padding: 18px 20px; overflow-y: auto; flex: 1 1 auto; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 9px; justify-content: flex-end; background: var(--surface-2); flex-wrap: wrap; }
@keyframes fade { from { opacity: 0 } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -46%) scale(.97) } }
@keyframes slideup { from { opacity: 0; transform: translateY(14px) } }

/* review step */
.review-item { padding: 13px 0; border-bottom: 1px solid var(--line); }
.review-item:last-child { border-bottom: 0; }
.reason-opts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
.reason-opts button { padding: 6px 11px; border-radius: 9px; border: 1px solid var(--line-2); font-size: 12.5px; font-weight: 580; color: var(--ink-2); background: var(--surface); transition: all .14s; }
.reason-opts button:hover { border-color: var(--accent); }
.reason-opts button.is-sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 660; }

/* email preview */
.mailpv { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface-2); }
.mailpv-head { padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 12.5px; }
.mailpv-head .kvline { display: flex; gap: 8px; }
.mailpv-head .kvline span:first-child { color: var(--muted); min-width: 52px; }
.mailpv-body { padding: 16px; font-size: 13.5px; line-height: 1.55; background: var(--surface); }
.mailpv-body h4 { font-size: 16px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; }
.mailpv-body ul { margin: 8px 0; }
.mailpv-body li { padding: 4px 0 4px 20px; position: relative; }
.mailpv-body li::before { position: absolute; left: 2px; top: 4px; font-size: 12px; }
.mailpv-body li.done::before { content: "✓"; color: var(--ok); font-weight: 700; }
.mailpv-body li.miss::before { content: "○"; color: var(--danger); font-weight: 700; }
.sms-bubble { max-width: 320px; padding: 11px 14px; border-radius: 18px 18px 18px 5px; background: var(--surface-3); font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; }

/* alerts list */
.alert-item { display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .14s; text-align: left; width: 100%; }
.alert-item:hover { background: var(--surface-2); }
.alert-item.is-unread { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.alert-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: 0 0 auto; }

/* activity feed */
.feed { display: flex; flex-direction: column; }
.feed-item { display: flex; gap: 11px; padding: 9px 0; align-items: flex-start; }
.feed-line { font-size: 13px; }
.feed-time { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* toasts */
.toast-root { position: absolute; left: 0; right: 0; bottom: 0; z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; pointer-events: none; transition: padding-bottom .2s; }
.modal-root.is-open + .toast-root { padding-bottom: 84px; }
.toast {
  display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-radius: 13px;
  background: var(--ink); color: var(--bg); font-size: 13.5px; font-weight: 560;
  box-shadow: var(--shadow-lg); animation: slideup .22s cubic-bezier(.2,.9,.3,1); max-width: 100%;
}
.toast .t-ic { color: var(--accent-hi); display: grid; place-items: center; }
html[data-theme="dark"] .toast { background: var(--surface-3); color: var(--ink); border: 1px solid var(--line-2); }

/* ==========================================================================
   RESPONSIVE — driven by container width, so the mobile toggle and a narrow
   window behave identically.
   ========================================================================== */
@container app (max-width: 860px) {
  .sidebar { display: none; }
  .page { padding: 18px 16px 100px; }
  .page-title { font-size: 22px; }
  .grid-2 { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .topbar { padding: 10px 14px; }
  #user-pick .pick-name { max-width: 78px; }
  .actionbar { margin: 16px -16px -100px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bottomnav {
    display: flex; flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--surface);
    padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
  }
  .bottomnav button {
    flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 5px 2px; border-radius: 11px; color: var(--muted); font-size: 10.5px; font-weight: 620;
    transition: color .14s, background .14s; min-width: 0;
  }
  .bottomnav button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bottomnav button.is-active { color: var(--accent); }
  .bottomnav button.is-active .bn-ic { background: var(--accent-soft); }
  .bn-ic { width: 44px; height: 25px; border-radius: 999px; display: grid; place-items: center; transition: background .16s; }
  .modal { width: calc(100% - 24px); max-height: calc(100% - 32px); border-radius: 20px; }
  .modal-foot { flex-direction: column-reverse; }
  .modal-foot .btn { width: 100%; }
  .card-head { padding: 13px 14px; }
  .card-body { padding: 14px; }
  .hide-sm { display: none !important; }
  .userpick select { max-width: 88px; }
  table.tbl th, table.tbl td { padding: 9px 11px; }
}
@container app (max-width: 520px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .topbar-actions { gap: 0; }
  /* claw back every pixel so the venue name — the thing that tells you which
     site you're looking at — is the one item that never gets truncated */
  #user-pick .pick-name, #user-pick .pick-chev, .pick-sub, .topbar-spacer { display: none; }
  #user-pick { padding: 3px; }
  .iconbtn { width: 32px; height: 32px; }
  #venue-pick { flex: 1 1 auto; min-width: 0; }
  #venue-pick .pick-name { max-width: none; }
  .topbar { gap: 4px; padding: 10px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>

<script>
/* ==========================================================================
   DAILYOPS — SHIFT CHECKLIST  ·  demo build
   Demo fallback mode has no backend and stores state in localStorage under STORE_KEY.
   Sections: icons · utils · store/seed · notifier · render · actions · init
   ========================================================================== */
"use strict";

/* ---------------------------------------------------------- backend mode */
const PUBLIC_SUPABASE_CONFIG = window.DAILYOPS_SUPABASE_CONFIG || {};
const isSupabaseMode = () => Boolean(
  PUBLIC_SUPABASE_CONFIG.url &&
  PUBLIC_SUPABASE_CONFIG.publishableKey &&
  !PUBLIC_SUPABASE_CONFIG.url.includes('YOUR_PROJECT') &&
  !PUBLIC_SUPABASE_CONFIG.publishableKey.includes('YOUR_')
);
let DB = null;
let AUTH = { session: null, profile: null };

/* ------------------------------------------------------------------ icons */
const P = {
  bell:    '<path d="M6 8a6 6 0 1112 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10.3 21a2 2 0 003.4 0"/>',
  sun:     '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:    '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
  phone:   '<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18.5h2"/>',
  desktop: '<rect x="2" y="3" width="20" height="13" rx="2"/><path d="M8 21h8M12 16v5"/>',
  check:   '<path d="M20 6L9 17l-5-5"/>',
  home:    '<path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.6V20h14V9.6"/>',
  list:    '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  users:   '<path d="M16 20v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 20v-2a4 4 0 00-3-3.9"/><path d="M16 3.1a4 4 0 010 7.8"/>',
  clock:   '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.9"/>',
  cog:     '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 003.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H8a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V8a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/>',
  plus:    '<path d="M12 5v14M5 12h14"/>',
  trash:   '<path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>',
  pencil:  '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
  up:      '<path d="M18 15l-6-6-6 6"/>',
  down:    '<path d="M6 9l6 6 6-6"/>',
  right:   '<path d="M9 18l6-6-6-6"/>',
  dl:      '<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  mail:    '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2.5 6.5L12 13l9.5-6.5"/>',
  sms:     '<path d="M21 11.5a8.4 8.4 0 01-9 8.4 9 9 0 01-4.2-1L3 20l1.2-4.5A8.4 8.4 0 0112 3a8.4 8.4 0 019 8.5z"/>',
  warn:    '<path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  x:       '<path d="M18 6L6 18M6 6l12 12"/>',
  sunrise: '<path d="M17 18a5 5 0 00-10 0"/><path d="M12 2v6M4.2 10.2l1.4 1.4M1 18h2M21 18h2M18.4 11.6l1.4-1.4M23 22H1"/><path d="M8 6l4-4 4 4"/>',
  nightly: '<path d="M17 18a5 5 0 00-10 0"/><path d="M12 9V3M4.2 10.2l1.4 1.4M1 18h2M21 18h2M18.4 11.6l1.4-1.4M23 22H1"/><path d="M16 5l-4 4-4-4"/>',
  play:    '<path d="M6 4l14 8-14 8z"/>',
  reset:   '<path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/>',
  info:    '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
  chart:   '<path d="M3 3v18h18"/><path d="M7 14l3.5-4 3 3L21 6"/>',
  flag:    '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V4s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  note:    '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/>',
  send:    '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  lock:    '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>',
  bolt:    '<path d="M13 2L3 14h9l-1 8 10-12h-9z"/>',
  minus:   '<path d="M6 12h12"/>'
};
function ic(name, size = 18, sw = 1.9) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[name] || ''}</svg>`;
}

/* ------------------------------------------------------------------ utils */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

const dayKey = d => { const x = d || new Date(); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtDate = k => parseKey(k).toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });
const fmtDateShort = k => parseKey(k).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' }) : '';
const fmtDT = iso => iso ? new Date(iso).toLocaleString(undefined, { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' }) : '';
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
const pct = (a, b) => b === 0 ? 100 : Math.round((a / b) * 100);
const plural = (n, s, p) => `${n} ${n === 1 ? s : (p || s + 's')}`;

const LIST_META = {
  open:  { key:'open',  label:'Open',  full:'Open Shift',  icon:'sunrise', verb:'opening' },
  close: { key:'close', label:'Close', full:'Close Shift', icon:'nightly', verb:'closing' }
};
const REASONS = {
  blocked: { label:'Blocked',        chip:'chip-danger', needsDetail:true,  sub:'Something stopped this getting done' },
  na:      { label:'Not applicable', chip:'chip-info',   needsDetail:false, sub:"Didn't apply to today" },
  skipped: { label:'Ran out of time',chip:'chip-warn',   needsDetail:false, sub:'No time left in the shift' }
};

/* ==========================================================================
   SUPABASE BOUNDARY
   Keep UI/rendering logic in this file for now. Demo persistence remains below;
   the phase 1 Supabase session and task adapter sits beside it. See docs/SUPABASE_PLAN.md.
   ========================================================================== */

function tplFrom(rows) {
  return rows.map(([title, detail, critical]) => ({ id: uid('t'), title, detail, critical }));
}
function blankList() {
  return { id: null, tasks: [], submitted: false, submittedBy: null, submittedAt: null, completeNotified: false };
}
function makeDay(key, roster, vid) {
  const v = vid || V().id;
  const d = { date: key, roster: roster || { open: [], close: [] },
              lists: { open: blankList(), close: blankList() }, reported: false, reportedAt: null };
  ['open','close'].forEach(k => { d.lists[k].tasks = S.templates[v][k].map(instanceFromTemplate); });
  return d;
}
function instanceFromTemplate(t) {
  return { id: uid('x'), tplId: t.id, title: t.title, detail: t.detail, critical: !!t.critical,
           source: 'template', addedBy: null, status: 'pending', doneBy: null, doneAt: null, note: '', reason: '' };
}
function newVenue(name, sub, accent) {
  const v = { id: uid('v'), name, sub, accent: accent || 'terracotta',
              managerEmail: V() ? V().managerEmail : '', managerPhone: V() ? V().managerPhone : '',
              cutoff: '23:30', notifyComplete: true, notifyEndOfDay: true, channelEmail: true, channelSms: true };
  S.venues.push(v);
  S.templates[v.id] = { open: [], close: [] };
  S.days[v.id] = {};
  S.users.filter(u => u.role === 'manager').forEach(u => u.venues.push(v.id));
  return v;
}

function defaultState() {
  const st = { version: 2, venues: [], users: [], templates: {}, days: {}, notifications: [],
               session: { userId: null, venueId: null } };
  S = st;

  VENUE_SEED.forEach(v => {
    const id = uid('v');
    st.venues.push({ id, name: v.name, sub: v.sub, accent: v.accent, cutoff: v.cutoff,
      managerEmail: 'abhishek.bhardwaj@theoc.ai', managerPhone: '+61 400 111 222',
      notifyComplete: true, notifyEndOfDay: true, channelEmail: true, channelSms: true });
    st.templates[id] = { open: tplFrom(v.open), close: tplFrom(v.close) };
    st.days[id] = {};
  });

  const mgr = { id: uid('u'), name: 'Abhishek Bhardwaj', role: 'manager',
                email: 'abhishek.bhardwaj@theoc.ai', phone: '+61 400 111 222', active: true,
                venues: st.venues.map(v => v.id) };
  st.users.push(mgr);
  SEED_STAFF.forEach(([name, email, phone, vix, active]) => {
    st.users.push({ id: uid('u'), name, role: 'employee', email, phone, active,
                    venues: vix.map(i => st.venues[i].id) });
  });
  st.session.userId = mgr.id;
  st.session.venueId = st.venues[0].id;

  st.venues.forEach((v, vi) => {
    const crewPool = st.users.filter(u => u.role === 'employee' && u.active && u.venues.includes(v.id));
    const pick = n => crewPool.slice().sort(() => Math.random() - .5).slice(0, Math.min(n, crewPool.length)).map(u => u.id);

    // six days of history so the manager views open onto something real
    for (let i = 6; i >= 1; i--) {
      const key = dayKey(addDays(new Date(), -i));
      const day = makeDay(key, { open: pick(2), close: pick(3) }, v.id);
      ['open','close'].forEach(lk => {
        const L = day.lists[lk], crew = day.roster[lk], base = parseKey(key);
        L.tasks.forEach((t, idx) => {
          const miss = Math.random() < (lk === 'close' ? 0.11 : 0.07);
          if (miss && !t.critical) {
            const rs = ['skipped','na','blocked'][Math.floor(Math.random()*3)];
            t.status = rs;
            t.reason = rs === 'blocked' ? 'Supplier delivery never turned up.'
                     : rs === 'na' ? 'Not needed on a quiet Tuesday.'
                     : 'Slammed until close, ran out of time.';
          } else {
            const at = new Date(base);
            at.setHours(lk === 'open' ? 9 : 22, 6 + idx * 4 + Math.floor(Math.random()*5), 0, 0);
            t.status = 'done'; t.doneBy = crew[Math.floor(Math.random()*crew.length)]; t.doneAt = at.toISOString();
          }
        });
        const sub = new Date(base); sub.setHours(lk === 'open' ? 11 : 23, lk === 'open' ? 15 : 41, 0, 0);
        L.submitted = true; L.submittedBy = crew[crew.length - 1];
        L.submittedAt = sub.toISOString(); L.completeNotified = true;
      });
      day.reported = true;
      day.reportedAt = day.lists.close.submittedAt;
      st.days[v.id][key] = day;
    }

    // today, mid-service: open list part-way, close list untouched
    const tk = dayKey();
    const tday = makeDay(tk, { open: pick(2), close: pick(3) }, v.id);
    const crew = tday.roster.open;
    tday.lists.open.tasks.forEach((t, i) => {
      if (i < VENUE_SEED[vi].todayDone && crew.length) {
        const at = new Date(); at.setHours(9, 10 + i * 5, 0, 0);
        t.status = 'done'; t.doneBy = crew[i % crew.length]; t.doneAt = at.toISOString();
      }
    });
    st.days[v.id][tk] = tday;
  });
  return st;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { S = JSON.parse(raw); if (S && S.version === 2 && S.venues && S.venues.length) { repair(); return; } }
  } catch (e) { console.warn('[store] could not read saved state, reseeding', e); }
  S = defaultState();
  save();
}
/* guards against a half-written state (venue deleted, user added by hand, etc.) */
function repair() {
  S.venues.forEach(v => { S.templates[v.id] = S.templates[v.id] || { open: [], close: [] }; S.days[v.id] = S.days[v.id] || {}; });
  S.users.forEach(u => {
    if (!Array.isArray(u.venues)) u.venues = S.venues.map(v => v.id);
    if (u.role === 'manager') u.venues = S.venues.map(v => v.id);
    u.venues = u.venues.filter(id => S.venues.some(v => v.id === id));
  });
  if (!venue(S.session.venueId)) S.session.venueId = (S.venues[0] || {}).id;
}
function save() {
  if (isSupabaseMode()) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { console.warn('[store] save failed', e); }
}

function dbError(error) { return error && error.message ? error.message : 'Supabase request failed'; }
async function dbRows(query) {
  const { data, error } = await query;
  if (error) throw error;
  return data || [];
}

function stateVenue(row) {
  return {
    id: row.id, name: row.name, sub: row.subtitle || '', accent: row.accent_key || 'indigo',
    cutoff: String(row.cutoff_time || '23:30').slice(0, 5),
    managerEmail: row.manager_email || '', managerPhone: row.manager_phone || '',
    notifyComplete: row.notify_complete, notifyEndOfDay: row.notify_end_of_day,
    channelEmail: row.email_enabled, channelSms: row.sms_enabled
  };
}

function stateTemplate(row) {
  return { id: row.id, title: row.title, detail: row.detail || '', critical: !!row.critical };
}

function stateDay(key) {
  return { date: key, roster: { open: [], close: [] }, lists: { open: blankList(), close: blankList() }, reported: false, reportedAt: null };
}

async function loadSupabaseState() {
  if (!AUTH.session) return;
  const userId = AUTH.session.user.id;
  const profiles = await dbRows(DB.from('profiles').select('id,display_name,email,phone,active'));
  const profile = profiles.find(x => x.id === userId);
  if (!profile || !profile.active) throw new Error('Your DailyOps profile is missing or disabled. Ask a manager to check your access.');
  AUTH.profile = profile;

  const memberships = await dbRows(DB.from('organisation_members').select('organisation_id,user_id,role'));
  const ownMembership = memberships.find(x => x.user_id === userId);
  if (!ownMembership) throw new Error('Your account is not a member of a DailyOps organisation yet.');
  const orgMemberships = memberships.filter(x => x.organisation_id === ownMembership.organisation_id);

  const venueRows = await dbRows(DB.from('venues').select('*').order('name'));
  if (!venueRows.length) throw new Error('No venues are available for this account yet.');
  const venueIds = venueRows.map(x => x.id);
  const venueMembers = await dbRows(DB.from('venue_members').select('venue_id,user_id').in('venue_id', venueIds));

  const roleByUser = {};
  orgMemberships.forEach(x => { roleByUser[x.user_id] = x.role; });
  const venuesByUser = {};
  venueMembers.forEach(x => { (venuesByUser[x.user_id] ||= []).push(x.venue_id); });
  const users = profiles.map(x => ({
    id: x.id, name: x.display_name, role: roleByUser[x.id] || 'employee', email: x.email || '',
    phone: x.phone || '', active: x.active, venues: roleByUser[x.id] === 'manager' ? venueIds.slice() : (venuesByUser[x.id] || [])
  }));

  const key = dayKey();
  if (roleByUser[userId] === 'manager') {
    for (const venueId of venueIds) {
      const { error } = await DB.rpc('ensure_daily_checklists', { p_venue_id: venueId, p_work_date: key });
      if (error) throw error;
    }
  }

  const checklists = await dbRows(DB.from('daily_checklists').select('*').in('venue_id', venueIds).eq('work_date', key));
  const checklistIds = checklists.map(x => x.id);
  const tasks = checklistIds.length
    ? await dbRows(DB.from('daily_tasks').select('*').in('checklist_id', checklistIds).order('sort_order'))
    : [];
  const roster = await dbRows(DB.from('roster_assignments').select('venue_id,user_id,shift_type').in('venue_id', venueIds).eq('work_date', key));
  const templates = await dbRows(DB.from('checklist_templates').select('id,venue_id,list_type,name,active').in('venue_id', venueIds));
  const templateIds = templates.map(x => x.id);
  const templateTasks = templateIds.length
    ? await dbRows(DB.from('template_tasks').select('*').in('template_id', templateIds).order('sort_order'))
    : [];

  const templateById = {};
  const stateTemplates = {};
  venueRows.forEach(v => { stateTemplates[v.id] = { open: [], close: [] }; });
  templates.forEach(x => {
    templateById[x.id] = x;
    stateTemplates[x.venue_id][x.list_type] = [];
  });
  templateTasks.forEach(x => {
    const t = templateById[x.template_id];
    if (t) stateTemplates[t.venue_id][t.list_type].push(stateTemplate(x));
  });

  const days = {};
  venueRows.forEach(v => { days[v.id] = { [key]: stateDay(key) }; });
  const checklistById = {};
  checklists.forEach(x => {
    const day = days[x.venue_id][key];
    day.lists[x.list_type] = {
      id: x.id, tasks: [], submitted: x.submitted, submittedBy: x.submitted_by,
      submittedAt: x.submitted_at, completeNotified: x.complete_notified
    };
    checklistById[x.id] = { venueId: x.venue_id, listType: x.list_type };
  });
  tasks.forEach(x => {
    const c = checklistById[x.checklist_id];
    if (!c) return;
    days[c.venueId][key].lists[c.listType].tasks.push({
      id: x.id, tplId: x.template_task_id, title: x.title, detail: x.detail || '', critical: !!x.critical,
      source: x.source, addedBy: x.added_by, addedAt: x.added_at, status: x.status,
      doneBy: x.completed_by, doneAt: x.completed_at, note: x.note || '', reason: x.reason || ''
    });
  });
  roster.forEach(x => {
    const list = days[x.venue_id][key].roster[x.shift_type];
    if (list && !list.includes(x.user_id)) list.push(x.user_id);
  });

  let selectedVenue = null;
  try { selectedVenue = localStorage.getItem('dailyops.supabase.venueId'); } catch (e) {}
  S = {
    version: 3, venues: venueRows.map(stateVenue), users, templates: stateTemplates, days, notifications: [],
    session: { userId, venueId: venueIds.includes(selectedVenue) ? selectedVenue : venueIds[0] },
    organisationId: ownMembership.organisation_id
  };
}

async function persistTask(task) {
  if (!isSupabaseMode()) return;
  const { data, error } = await DB.from('daily_tasks').update({
    status: task.status, completed_by: task.doneBy, completed_at: task.doneAt,
    note: task.note || null, reason: task.reason || null
  }).eq('id', task.id).select('id,status,completed_by,completed_at,note,reason').single();
  if (error || !data) throw error || new Error('The task was not updated');
  task.status = data.status; task.doneBy = data.completed_by; task.doneAt = data.completed_at;
  task.note = data.note || ''; task.reason = data.reason || '';
}

async function persistChecklist(list) {
  if (!isSupabaseMode() || !list.id) return;
  const { data, error } = await DB.from('daily_checklists').update({
    submitted: list.submitted, submitted_by: list.submittedBy, submitted_at: list.submittedAt
  }).eq('id', list.id).select('id').single();
  if (error || !data) throw error || new Error('The checklist was not updated');
}

/* venues a given user is allowed to see — managers see all */
const venuesFor = u => !u ? [] : u.role === 'manager' ? S.venues.slice() : S.venues.filter(v => (u.venues || []).includes(v.id));
/* keep the selected venue legal for whoever is signed in */
function ensureVenue() {
  const allowed = venuesFor(me());
  if (!allowed.length) return;
  if (!allowed.some(v => v.id === S.session.venueId)) S.session.venueId = allowed[0].id;
}
function today(vid) {
  const v = vid || V().id, k = dayKey();
  S.days[v] = S.days[v] || {};
  if (!S.days[v][k]) {
    S.days[v][k] = isSupabaseMode() ? stateDay(k) : makeDay(k, { open: [], close: [] }, v);
    save();
  }
  return S.days[v][k];
}

function listStats(L) {
  const total = L.tasks.length;
  const done = L.tasks.filter(t => t.status === 'done').length;
  const flagged = L.tasks.filter(t => t.status !== 'done' && t.status !== 'pending').length;
  const pending = total - done - flagged;
  return { total, done, flagged, pending, pct: pct(done, total), complete: done === total && total > 0 };
}
function dayStats(day) {
  const a = listStats(day.lists.open), b = listStats(day.lists.close);
  const total = a.total + b.total, done = a.done + b.done;
  return { total, done, missed: total - done, pct: pct(done, total), open: a, close: b };
}
/* ==========================================================================
   NOTIFICATIONS
   --------------------------------------------------------------------------
   Everything the app "sends" flows through Notifier.deliver(). In this demo it
   only logs and stores the message so it can be previewed in the Alerts tab.

   >>> TO GO LIVE: replace the body of deliver() with a single call to your
   >>> backend and nothing else in this file has to change. e.g.
   >>>
   >>>   async deliver(msg) {
   >>>     const r = await fetch('/api/notify', {
   >>>       method: 'POST',
   >>>       headers: { 'Content-Type': 'application/json' },
   >>>       body: JSON.stringify(msg)          // { channel, to, subject, html, text }
   >>>     });
   >>>     return r.json();
   >>>   }
   >>>
   >>> Server side: SendGrid/Postmark for channel==='email', Twilio for 'sms'.
   >>> The cutoff-time report should also exist as a scheduled Cloud Function so
   >>> it fires even when no browser is open.
   ========================================================================== */
const Notifier = {
  async deliver(msg) {
    console.info(`[Notifier · STUB] ${msg.channel.toUpperCase()} → ${msg.to} :: ${msg.subject}`, msg);
    return { ok: true, stub: true, sentAt: new Date().toISOString() };
  },

  /* every venue has its own recipients and its own channel switches */
  channels(v) {
    const out = [];
    if (v.channelEmail) out.push({ channel: 'email', to: v.managerEmail });
    if (v.channelSms)   out.push({ channel: 'sms',   to: v.managerPhone });
    return out;
  },

  push(kind, built, meta) {
    const m = meta || {};
    const v = venue(m.venueId) || V();
    const chans = this.channels(v);
    if (!chans.length) { toast(`No notification channel is on for ${v.name}`, 'warn'); return []; }
    const made = [];
    chans.forEach(c => {
      const rec = {
        id: uid('n'), at: new Date().toISOString(), kind,
        venueId: v.id, venueName: v.name,
        channel: c.channel, to: c.to,
        subject: built.subject, html: built.html, text: built.text,
        read: false, dayKey: m.dayKey || dayKey(), listKey: m.listKey || null
      };
      S.notifications.unshift(rec);
      made.push(rec);
      this.deliver(rec);
    });
    save();
    return made;
  }
};

/* ------------------------------------------------------------ message copy */
function statusChipLabel(t) {
  if (t.status === 'done') return 'Done';
  if (t.status === 'pending') return 'Not done';
  return REASONS[t.status] ? REASONS[t.status].label : 'Not done';
}
function taskLineHtml(t) {
  if (t.status === 'done') {
    return `<li class="done">${esc(t.title)} <span style="color:var(--muted)">— ${esc(uname(t.doneBy))}, ${esc(fmtTime(t.doneAt))}</span>${
      t.note ? `<br><span style="color:var(--muted)">“${esc(t.note)}”</span>` : ''}</li>`;
  }
  const why = t.reason ? ` — ${esc(t.reason)}` : '';
  return `<li class="miss">${esc(t.title)} <span style="color:var(--danger)">[${esc(statusChipLabel(t))}${
    t.critical ? ' · critical' : ''}]</span><span style="color:var(--muted)">${why}</span></li>`;
}
function listBlockHtml(day, lk) {
  const L = day.lists[lk], st = listStats(L), m = LIST_META[lk];
  const sub = L.submitted ? `submitted by ${esc(uname(L.submittedBy))} at ${esc(fmtTime(L.submittedAt))}` : 'not submitted';
  return `<h4 style="margin-top:14px">${m.full} — ${st.done}/${st.total}</h4>
    <p style="color:var(--muted);margin:0 0 4px">${sub}</p>
    <ul>${L.tasks.map(taskLineHtml).join('')}</ul>`;
}
function buildListComplete(v, day, lk) {
  const L = day.lists[lk], m = LIST_META[lk], st = listStats(L);
  const who = [...new Set(L.tasks.map(t => t.doneBy).filter(Boolean))].map(uname);
  return {
    subject: `✅ ${v.name} — ${m.full} checklist complete, ${fmtDateShort(day.date)}`,
    html: `<h4>All ${m.label.toLowerCase()} tasks are done</h4>
      <p style="color:var(--muted);margin:0 0 10px">${esc(fmtDate(day.date))} · ${esc(v.name)}</p>
      <p><b>${st.done} of ${st.total}</b> tasks ticked off by ${esc(who.join(', ') || 'the team')}.</p>
      <ul>${L.tasks.map(taskLineHtml).join('')}</ul>`,
    text: `${v.name}: ${m.full} checklist is complete — all ${st.total} tasks done by ${who.join(', ') || 'the team'}. ${fmtDateShort(day.date)}.`
  };
}
function buildEndOfDay(v, day, auto) {
  const d = dayStats(day);
  const missed = [...day.lists.open.tasks, ...day.lists.close.tasks].filter(t => t.status !== 'done');
  const crit = missed.filter(t => t.critical);
  return {
    subject: `${v.name} — end of day, ${fmtDateShort(day.date)} (${d.done}/${d.total} done)`,
    html: `<h4>End of day summary</h4>
      <p style="color:var(--muted);margin:0 0 10px">${esc(fmtDate(day.date))} · ${esc(v.name)}${auto ? ' · auto-sent at cutoff' : ''}</p>
      <p style="font-size:15px"><b>${d.done} of ${d.total}</b> tasks completed (${d.pct}%).${
        missed.length ? ` <span style="color:var(--danger)"><b>${missed.length}</b> left undone${crit.length ? `, ${crit.length} of them critical` : ''}.</span>` : ' Nothing left undone.'}</p>
      ${listBlockHtml(day, 'open')}
      ${listBlockHtml(day, 'close')}`,
    text: `${v.name} end of day ${fmtDateShort(day.date)}: ${d.done}/${d.total} tasks done (${d.pct}%).${
      missed.length
        ? ` Left undone: ${missed.slice(0, 3).map(t => t.title).join('; ')}${missed.length > 3 ? `; +${missed.length - 3} more` : ''}.${
            crit.length ? ` ${plural(crit.length, 'critical task')} missed.` : ''} Full list in your email.`
        : ' Everything completed.'}`
  };
}

/* ----------------------------------------------------------- trigger rules
   Runs across EVERY venue, not just the one on screen — a manager watching
   Bondi still gets told when Surry Hills finishes its close list. In
   production this whole function lives in a scheduled backend job.
   -------------------------------------------------------------------------- */
function runTriggers(opts) {
  const o = opts || {};
  let fired = 0;
  const here = V().id;

  S.venues.forEach(v => {
    const day = today(v.id);
    const tag = v.id === here ? '' : ` · ${v.name}`;

    // 1. a list has every task ticked off -> notify straight away
    if (v.notifyComplete) {
      ['open','close'].forEach(lk => {
        const L = day.lists[lk], st = listStats(L);
        if (st.complete && !L.completeNotified) {
          L.completeNotified = true;
          Notifier.push('list-complete', buildListComplete(v, day, lk), { venueId: v.id, dayKey: day.date, listKey: lk });
          fired++;
          toast(`${LIST_META[lk].full} complete — manager notified${tag}`, 'ok');
        }
        if (!st.complete) L.completeNotified = false;   // reopened, allow it to fire again
      });
    }

    // 2. end of day: staff submitted the close list, or the cutoff time passed
    if (v.notifyEndOfDay && !day.reported) {
      const submitted = day.lists.close.submitted;
      const forced = o.forceEod && (!o.venueId || o.venueId === v.id);
      if (submitted || cutoffPassed(v) || forced) {
        day.reported = true;
        day.reportedAt = new Date().toISOString();
        const auto = !submitted && !forced;
        Notifier.push('end-of-day', buildEndOfDay(v, day, auto), { venueId: v.id, dayKey: day.date });
        fired++;
        toast(`End of day summary sent to the manager${tag}`, 'ok');
      }
    }
  });

  if (fired) save();
  return fired;
}
function cutoffPassed(v) {
  const [h, m] = String((v || V()).cutoff || '23:30').split(':').map(Number);
  const now = new Date();
  return now.getHours() > h || (now.getHours() === h && now.getMinutes() >= m);
}
const unreadCount = () => S.notifications.filter(n => !n.read).length;

/* ---------------------------------------------------------------- toasts */
function toast(msg, tone) {
  const root = $('#toast-root');
  while (root.children.length >= 3) root.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  const icon = tone === 'ok' ? 'check' : tone === 'warn' ? 'warn' : 'info';
  el.innerHTML = `<span class="t-ic">${ic(icon, 16)}</span><span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s, transform .25s'; el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; }, 3200);
  setTimeout(() => el.remove(), 3600);
}

/* ---------------------------------------------------------------- modals */
let modalOnClose = null;
function openModal(html, opts) {
  const o = opts || {};
  const root = $('#modal-root');
  root.innerHTML = `<div class="scrim" data-close="1"></div>
    <div class="modal ${o.wide ? 'wide' : ''}" role="document">${html}</div>`;
  root.classList.add('is-open');
  modalOnClose = o.onClose || null;
  root.querySelector('.scrim').addEventListener('click', () => { if (!o.locked) closeModal(); });
  if (o.after) o.after(root);
}
function closeModal() {
  const root = $('#modal-root');
  root.classList.remove('is-open');
  root.innerHTML = '';
  const cb = modalOnClose; modalOnClose = null;
  if (cb) cb();
}
function confirmModal(title, body, confirmLabel, onYes, danger) {
  openModal(`
    <div class="modal-head"><div><div class="modal-title">${esc(title)}</div><div class="modal-sub">${esc(body)}</div></div></div>
    <div class="modal-foot">
      <button class="btn" data-x="cancel">Cancel</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-x="yes">${esc(confirmLabel)}</button>
    </div>`, {
    after(root) {
      root.querySelector('[data-x=cancel]').onclick = closeModal;
      root.querySelector('[data-x=yes]').onclick = () => { closeModal(); onYes(); };
    }
  });
}

/* ------------------------------------------------------------------- csv */
function csvCell(v) { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
const CSV_HEAD = ['Venue','Date','List','Task','Critical','Source','Status','Completed by','Completed at','Reason / note'];
function csvRows(v, keys) {
  const out = [];
  keys.forEach(k => {
    const day = (S.days[v.id] || {})[k]; if (!day) return;
    ['open','close'].forEach(lk => day.lists[lk].tasks.forEach(t => {
      out.push([v.name, k, LIST_META[lk].full, t.title, t.critical ? 'Yes' : 'No',
        t.source === 'adhoc' ? 'Added on the day' : 'Template', statusChipLabel(t),
        t.doneBy ? uname(t.doneBy) : '', t.doneAt ? new Date(t.doneAt).toLocaleString() : '',
        t.reason || t.note || '']);
    }));
  });
  return out;
}
function downloadCsv(rows, filename) {
  const blob = new Blob([rows.map(r => r.map(csvCell).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('CSV downloaded', 'ok');
}
function exportCsv(keys, filename, vid) {
  const v = venue(vid) || V();
  downloadCsv([CSV_HEAD].concat(csvRows(v, keys)), filename);
}
function exportAllVenues() {
  const rows = [CSV_HEAD];
  S.venues.forEach(v => rows.push(...csvRows(v, Object.keys(S.days[v.id] || {}).sort().reverse())));
  downloadCsv(rows, 'peachy-all-venues.csv');
}

function ringHtml(value, size, done) {
  const r = (size / 2) - 5, c = 2 * Math.PI * r;
  const off = c - (clamp(value, 0, 100) / 100) * c;
  return `<div class="ring ${done ? 'is-done' : ''}" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle class="track" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="6"/>
      <circle class="prog" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="6"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg>
    <div class="ring-label">${value}%</div></div>`;
}
function avatarHtml(id, cls) {
  const u = user(id); if (!u) return '';
  return `<div class="avatar ${u.role === 'manager' ? 'is-mgr' : ''} ${cls || ''}" title="${esc(u.name)}">${esc(initials(u.name))}</div>`;
}
function avatarStack(ids) {

      ids.map(id => uname(id).split(' ')[0]).join(', ')}</span></div>`;

/* one task row, shared by the employee list and the manager view */
function taskRowHtml(t, o) {
  const opt = o || {};
  const done = t.status === 'done';
  const flag = t.status !== 'done' && t.status !== 'pending';
  const cls = ['task', done ? 'is-done' : '', flag ? 'is-flag' : '', opt.locked ? 'is-locked' : ''].join(' ');
  const tag = opt.locked ? 'div' : 'button';
  const meta = [];
  if (done && t.doneBy) meta.push(`<span class="row" style="gap:5px">${avatarHtml(t.doneBy, 'sm')}${esc(uname(t.doneBy).split(' ')[0])} · ${esc(fmtTime(t.doneAt))}</span>`);
  if (flag) meta.push(`<span class="chip ${REASONS[t.status].chip}">${esc(REASONS[t.status].label)}</span>`);
  if (t.critical) meta.push(`<span class="chip chip-accent">Critical</span>`);
  if (t.source === 'adhoc') meta.push(`<span class="chip">Added today${t.addedBy ? ' · ' + esc(uname(t.addedBy).split(' ')[0]) : ''}</span>`);

  return `<${tag} class="${cls}" ${opt.locked ? '' : `data-task="${t.id}" data-list="${opt.listKey}" type="button"`}>
    ${t.critical ? '<span class="task-critical-mark"></span>' : ''}

      <span class="task-title">${esc(t.title)}</span>

      ${meta.length ? `<span class="task-meta">${meta.join('')}</span>` : ''}
      ${t.reason ? `<span class="task-note" style="display:block"><b>Reason:</b> ${esc(t.reason)}</span>` : ''}
      ${t.note ? `<span class="task-note" style="display:block"><b>Note:</b> ${esc(t.note)}</span>` : ''}
    </span>
    ${opt.side || ''}
  </${tag}>`;
}

    <div class="card-head"><div class="h3">Across the group</div>
      <span class="tiny mut" style="margin-left:auto">${plural(S.venues.length, 'venue')} · today</span></div>
    <div class="vstrip">${S.venues.map(v => {
      const d = dayStats(today(v.id));
      const col = venueDotColor(v);
      const cur = v.id === V().id;
      const crit = [...today(v.id).lists.open.tasks, ...today(v.id).lists.close.tasks].filter(t => t.critical && t.status !== 'done').length;
      return `<button class="vcard ${cur ? 'is-current' : ''}" data-act="goto-venue" data-id="${v.id}">
        <span class="row" style="gap:7px;min-width:0">
          <span class="venue-dot" style="background:${col}"></span>
          <span class="vcard-name">${esc(v.name)}</span>
          ${cur ? '<span class="chip chip-accent" style="margin-left:auto">Viewing</span>' : ''}
        </span>
        <span class="vcard-num">${d.done}<span class="mut" style="font-size:13px;font-weight:600">/${d.total}</span></span>
        <span class="bar" style="display:block;margin-top:7px"><i style="width:${d.pct}%;background:${col}"></i></span>
        <span class="tiny mut" style="display:block;margin-top:7px">${d.open.done}/${d.open.total} open · ${d.close.done}/${d.close.total} close${
          crit ? ` · <span style="color:var(--danger);font-weight:640">${crit} critical</span>` : ''}</span>
      </button>`;
    }).join('')}</div></div>`;
}

function pageManagerToday() {

  const summary = ['open','close'].map(k => {
    const s = listStats(day.lists[k]), L2 = day.lists[k];

        <div class="row" style="gap:7px;margin-bottom:2px">${ic(LIST_META[k].icon, 16)}<span class="h3">${LIST_META[k].full}</span></div>

      <div class="row wrap" style="gap:8px">
        <button class="btn btn-sm" data-act="eod">${ic('send', 15)} Run end of day</button>

      </div>
    </div>

    <div class="stack">
      <div class="stats">
        <div class="stat"><div class="stat-k">Completed</div><div class="stat-v">${d.done}<span style="font-size:15px;color:var(--muted)">/${d.total}</span></div><div class="stat-s">${d.pct}% of today</div></div>
        <div class="stat"><div class="stat-k">Outstanding</div><div class="stat-v" style="color:${d.missed ? 'var(--accent)' : 'var(--ok)'}">${d.missed}</div><div class="stat-s">${d.missed ? 'still to do' : 'nothing left'}</div></div>
        <div class="stat"><div class="stat-k">Critical open</div><div class="stat-v" style="color:${critOut.length ? 'var(--danger)' : 'var(--ok)'}">${critOut.length}</div><div class="stat-s">${critOut.length ? 'need attention' : 'all covered'}</div></div>
        <div class="stat"><div class="stat-k">On shift</div><div class="stat-v">${new Set([...day.roster.open, ...day.roster.close]).size}</div><div class="stat-s">rostered today</div></div>
      </div>

      ${venueStripHtml()}

      <div class="grid grid-2">${summary}</div>

      ${critOut.length ? `<div class="banner banner-warn">${ic('warn', 17)}<div>
        <b>${plural(critOut.length, 'critical task')} not done yet:</b> ${critOut.map(t => esc(t.title)).join(' · ')}</div></div>` : ''}

      <div class="segmented">${segs}</div>

      <div class="card">
        <div class="card-head">

        <div class="card-foot row" style="gap:8px">

          <button class="btn btn-sm btn-ghost" data-act="sync-tpl" data-list="${lk}">${ic('reset', 15)} Re-apply template</button>

        </div>
      </div>

      <div class="card">
        <div class="card-head"><div class="h3">Activity</div><span class="tiny mut" style="margin-left:auto">${plural(feed.length, 'event')}</span></div>
        <div class="card-body">
          ${feed.length ? `<div class="feed">${feed.map(e => `
            <div class="feed-item">${avatarHtml(e.who, 'sm')}
              <div style="flex:1;min-width:0">
                <div class="feed-line"><b>${esc(uname(e.who).split(' ')[0])}</b> ${e.text}</div>
                <div class="feed-time">${esc(fmtTime(e.at))}</div>

        </div>
      </div>

      <div class="card">
        <div class="card-head"><div class="h3">Demo controls</div></div>
        <div class="card-body row wrap" style="gap:8px">
          <button class="btn btn-sm" data-act="eod">${ic('send', 15)} Force end-of-day report</button>
          <button class="btn btn-sm" data-act="tick-all" data-list="${lk}">${ic('check', 15)} Tick everything on ${esc(m.label.toLowerCase())}</button>
          <button class="btn btn-sm btn-danger" data-act="reset-day">${ic('reset', 15)} Reset today</button>
          <button class="btn btn-sm btn-danger" data-act="reset-all">${ic('trash', 15)} Wipe all demo data</button>
        </div>
      </div>
    </div>`;
}

/* ==========================================================================
   MANAGER · HISTORY & STATS
   ========================================================================== */
function pageHistory() {
  const keys = Object.keys(DAYS()).sort().reverse();
  const recent = keys.slice(0, 30);
  const totals = recent.reduce((a, k) => { const d = dayStats(DAYS()[k]); a.t += d.total; a.d += d.done; return a; }, { t: 0, d: 0 });

  const missCount = {};
  recent.forEach(k => ['open','close'].forEach(lk => DAYS()[k].lists[lk].tasks.forEach(t => {
    if (t.status !== 'done') missCount[t.title] = (missCount[t.title] || 0) + 1;
  })));
  const worst = Object.entries(missCount).sort((a, b) => b[1] - a[1])[0];

  const perUser = {};
  recent.forEach(k => ['open','close'].forEach(lk => DAYS()[k].lists[lk].tasks.forEach(t => {
    if (t.status === 'done' && t.doneBy) {
      perUser[t.doneBy] = perUser[t.doneBy] || { done: 0, shifts: new Set() };
      perUser[t.doneBy].done++; perUser[t.doneBy].shifts.add(k + lk);
    }
  })));
  const rosterCount = {};
  recent.forEach(k => ['open','close'].forEach(lk => DAYS()[k].roster[lk].forEach(id => {
    rosterCount[id] = rosterCount[id] || { assigned: 0 }; rosterCount[id].assigned++;
  })));

  const staffStats = S.users.filter(u => u.role === 'employee').map(u => {
    const p = perUser[u.id] || { done: 0, shifts: new Set() };
    const shifts = p.shifts.size;
    return { u, done: p.done, shifts, avg: shifts ? Math.round(p.done / shifts) : 0, rostered: (rosterCount[u.id] || {}).assigned || 0 };
  }).sort((a, b) => b.done - a.done);

  const dayRows = recent.map(k => {
    const day = DAYS()[k], d = dayStats(day);
    return `<tr>
      <td class="nowrap"><b>${esc(fmtDateShort(k))}</b>${k === dayKey() ? ' <span class="chip chip-accent">Today</span>' : ''}</td>
      <td style="min-width:120px"><div class="row" style="gap:8px">
        <div class="bar" style="flex:1;min-width:60px"><i style="width:${d.pct}%;background:${d.pct === 100 ? 'var(--ok)' : 'var(--accent)'}"></i></div>
        <span class="tiny num nowrap" style="font-weight:640">${d.pct}%</span></div></td>
      <td class="num nowrap hide-sm">${d.open.done}/${d.open.total}</td>
      <td class="num nowrap hide-sm">${d.close.done}/${d.close.total}</td>
      <td class="num"><span class="chip ${d.missed ? 'chip-warn' : 'chip-ok'}">${d.missed}</span></td>
      <td style="text-align:right"><button class="btn btn-sm btn-ghost" data-act="view-day" data-key="${k}">View ${ic('right', 13)}</button></td>
    </tr>`;
  }).join('');

  return `
    <div class="page-head row-b wrap">
      <div>
        <div class="page-title">History</div>
        <div class="page-sub">Every checklist published at <b>${esc(V().name)}</b>, kept as a record.</div>
      </div>
      <button class="btn btn-sm" data-act="csv-all">${ic('dl', 15)} Export CSV</button>
    </div>
    <div class="stack">
      <div class="stats">
        <div class="stat"><div class="stat-k">Days logged</div><div class="stat-v">${recent.length}</div><div class="stat-s">most recent 30</div></div>
        <div class="stat"><div class="stat-k">Completion</div><div class="stat-v">${pct(totals.d, totals.t)}%</div><div class="stat-s">${totals.d} of ${totals.t} tasks</div></div>
        <div class="stat"><div class="stat-k">Left undone</div><div class="stat-v">${totals.t - totals.d}</div><div class="stat-s">across all shifts</div></div>
        <div class="stat"><div class="stat-k">Most missed</div><div class="stat-v" style="font-size:16px;letter-spacing:-.01em;line-height:1.25;margin-top:6px">${worst ? esc(worst[0]) : '—'}</div><div class="stat-s">${worst ? `${worst[1]}×` : 'nothing missed'}</div></div>
      </div>

      <div class="card">
        <div class="card-head"><div class="h3">Daily record</div></div>
        <div class="tablewrap"><table class="tbl">
          <thead><tr><th>Date</th><th>Completion</th><th class="hide-sm">Open</th><th class="hide-sm">Close</th><th>Missed</th><th></th></tr></thead>
          <tbody>${dayRows || `<tr><td colspan="6" class="mut" style="text-align:center;padding:22px">No history yet.</td></tr>`}</tbody>
        </table></div>
      </div>

      <div class="card">
        <div class="card-head"><div style="flex:1"><div class="h3">Team performance</div>
          <div class="tiny mut">Tasks ticked off per person across the logged period.</div></div></div>
        <div class="tablewrap"><table class="tbl">
          <thead><tr><th>Employee</th><th class="num">Tasks done</th><th class="num hide-sm">Shifts worked</th><th class="num hide-sm">Avg / shift</th><th>Share</th></tr></thead>
          <tbody>${staffStats.map(s => {
            const top = staffStats[0].done || 1;
            return `<tr>
              <td><div class="row" style="gap:9px">${avatarHtml(s.u.id, 'sm')}<span>${esc(s.u.name)}</span>${s.u.active ? '' : '<span class="chip">disabled</span>'}</div></td>
              <td class="num"><b>${s.done}</b></td>
              <td class="num hide-sm">${s.shifts}</td>
              <td class="num hide-sm">${s.avg}</td>
              <td style="min-width:90px"><div class="bar"><i style="width:${Math.round(s.done / top * 100)}%"></i></div></td>
            </tr>`; }).join('')}</tbody>
        </table></div>
      </div>
    </div>`;
}
