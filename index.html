function mapRemoteDay(context, date, checklists, tasks, rosterData) {
  const lists = { open: blankList(), close: blankList() };
  const checklistById = {};
  checklists.forEach(row => {
    const list = row.list_type;
    if (!lists[list]) return;
    lists[list] = {
      id: row.id,
      tasks: [],
      submitted: !!row.submitted,
      submittedBy: row.submitted_by,
      submittedAt: row.submitted_at,
      completeNotified: !!row.complete_notified,
      notificationRevision: Number(row.notification_revision || 0),
      reopenedBy: row.reopened_by || null,
      reopenedAt: row.reopened_at || null
    };
    checklistById[row.id] = list;
  });
  tasks.forEach(row => {
    const list = checklistById[row.checklist_id];
    if (!list) return;
    lists[list].tasks.push(applyRemoteTaskRow({ id: row.id }, row));
  });
  return {
    date,
    roster: rosterData ? rosterData.roster : { open: [], close: [] },
    rosterAssignmentIds: rosterData ? rosterData.assignmentIds : { open: {}, close: {} },
    lists,
    reported: false,
    reportedAt: null
  };
}

async function loadSupabaseTodayForVenue(context, date, options = {}) {
  const allowBootstrap = options.allowBootstrap !== false;
  const { data: initialChecklists, error: checklistError } = await DB.from('daily_checklists')
    .select(REMOTE_CHECKLIST_SELECT)
    .eq('venue_id', context.realId)
    .eq('work_date', date);
  if (checklistError) {
    console.error('[supabase] daily checklist load failed', { venueId: context.realId, date, error: checklistError });
    throw accessError('today-load', `We could not load today's operations for ${context.name}.`);
  }

  let checklists = initialChecklists || [];
  const missingTypes = ['open', 'close'].filter(type => !checklists.some(row => row.list_type === type));
  const canBootstrap = context.organisationRole === 'manager';
  if (missingTypes.length && !canBootstrap) {
    throw accessError('today-not-initialized', `Today's operations for ${context.name} have not been initialised by a venue manager yet.`);
  }
  if (missingTypes.length && !allowBootstrap) {
    throw accessError('today-load', `Today's operations for ${context.name} changed while this screen was synchronising.`);
  }
  if (missingTypes.length) {
    // The deployed SECURITY DEFINER helper creates missing instances and copies
    // the current Supabase template tasks as immutable daily snapshots.
    const { error } = await DB.rpc('ensure_daily_checklists', {
      p_venue_id: context.realId,
      p_work_date: date
    });
    if (error) {
      console.error('[supabase] daily operation bootstrap failed', { venueId: context.realId, date, error });
      throw accessError('today-bootstrap', `We could not initialise today's operations for ${context.name}.`);
    }
    const refreshed = await DB.from('daily_checklists')
      .select(REMOTE_CHECKLIST_SELECT)
      .eq('venue_id', context.realId)
      .eq('work_date', date);
    if (refreshed.error) {
      console.error('[supabase] daily checklist reload failed', { venueId: context.realId, date, error: refreshed.error });
      throw accessError('today-load', `We could not reload today's operations for ${context.name}.`);
    }
    checklists = refreshed.data || [];
  }

  if (['open', 'close'].some(type => !checklists.some(row => row.list_type === type))) {
    throw accessError('today-load', `Today's Opening and Closing Shifts could not be loaded for ${context.name}.`);
  }

  let checklistIds = checklists.map(row => row.id);
  let taskResult = await DB.from('daily_tasks')
    .select(REMOTE_TASK_SELECT)
    .in('checklist_id', checklistIds)
    .order('sort_order')
    .order('id');
  if (taskResult.error) {
    console.error('[supabase] daily task load failed', { venueId: context.realId, date, error: taskResult.error });
    throw accessError('today-load', `We could not load today's tasks for ${context.name}.`);
  }
  let tasks = taskResult.data || [];

  if (await backfillLegacyRemoteTemplateTaskIds(context, checklists, tasks)) {
    taskResult = await DB.from('daily_tasks')
      .select(REMOTE_TASK_SELECT)
      .in('checklist_id', checklistIds)
      .order('sort_order')
      .order('id');
    if (taskResult.error) {
      console.error('[supabase] daily task reload after template link failed', { venueId: context.realId, date, error: taskResult.error });
      throw accessError('today-load', `We could not reload today's tasks for ${context.name}.`);
    }
    tasks = taskResult.data || [];
  }

  const rosterData = await loadSupabaseRosterForVenue(context, date);
  return mapRemoteDay(context, date, checklists, tasks, rosterData);
}

function blankSupabaseRealtimeState() {
  return {
    channel: null,
    venueId: null,
    date: null,
    checklistIds: [],
    status: 'CLOSED',
    refreshTimer: null,
    pollTimer: null,
    refreshing: false,
    refreshPending: false
  };
}

function realtimePayloadMatchesDate(payload, date) {
  return [payload && payload.new, payload && payload.old]
    .some(row => row && row.work_date === date);
}

async function detachSupabaseRealtime() {
  const previous = SUPABASE_REALTIME;
  if (previous.refreshTimer !== null) clearTimeout(previous.refreshTimer);
  if (previous.pollTimer !== null) clearInterval(previous.pollTimer);
  SUPABASE_REALTIME = blankSupabaseRealtimeState();
  if (previous.channel && DB) {
    try { await DB.removeChannel(previous.channel); }
    catch (error) { console.warn('[supabase] realtime channel cleanup failed', error); }
  }
}

async function unsubscribeSupabaseRealtime() {
  SUPABASE_REALTIME_REQUEST_ID++;
  await detachSupabaseRealtime();
}

async function refreshSupabaseTodayFromRealtime(requestId, venueId, date) {
  const current = () => requestId === SUPABASE_REALTIME_REQUEST_ID
    && SUPABASE_REALTIME.venueId === venueId
    && SUPABASE_REALTIME.date === date
    && !!SUPABASE_REALTIME.channel;
  if (!current()) return;
  if (SUPABASE_REALTIME.refreshing) {
    SUPABASE_REALTIME.refreshPending = true;
    return;
  }

  SUPABASE_REALTIME.refreshing = true;
  try {
    const context = supabaseVenueContext(venueId);
    if (!context) return;
    // A realtime refetch must never create or re-bootstrap an operation.
    const remoteDay = await loadSupabaseTodayForVenue(context, date, { allowBootstrap: false });
    if (!current()) return;
    SUPABASE_TODAY.byVenue[venueId] = remoteDay;
    render();
  } catch (error) {
    if (current()) console.error('[supabase] realtime today refetch failed', { venueId, date, error });
  } finally {
    if (current()) {
      SUPABASE_REALTIME.refreshing = false;
      if (SUPABASE_REALTIME.refreshPending) {
        SUPABASE_REALTIME.refreshPending = false;
        queueSupabaseRealtimeRefresh(venueId, date);
      }
    }
  }
}

function queueSupabaseRealtimeRefresh(venueId, date) {
  const requestId = SUPABASE_REALTIME_REQUEST_ID;
  if (SUPABASE_REALTIME.venueId !== venueId
    || SUPABASE_REALTIME.date !== date
    || !SUPABASE_REALTIME.channel) return;
  if (SUPABASE_REALTIME.refreshing) {
    SUPABASE_REALTIME.refreshPending = true;
    return;
  }
  if (SUPABASE_REALTIME.refreshTimer !== null) return;
  SUPABASE_REALTIME.refreshTimer = setTimeout(() => {
    SUPABASE_REALTIME.refreshTimer = null;
    refreshSupabaseTodayFromRealtime(requestId, venueId, date);
  }, 150);
}

async function subscribeSupabaseRealtime() {
  if (!isSupabaseMode() || !DB || !AUTH.session || R.tab !== 'today') {
    await unsubscribeSupabaseRealtime();
    return;
  }
  const context = V();
  const date = dayKey();
  const venueId = context && context.realId;
  const remoteDay = venueId && SUPABASE_TODAY.date === date
    ? SUPABASE_TODAY.byVenue[venueId]
    : null;
  const checklistIds = remoteDay
    ? ['open', 'close'].map(listType => remoteDay.lists[listType].id).filter(Boolean)
    : [];
  if (!venueId || !checklistIds.length) {
    await unsubscribeSupabaseRealtime();
    return;
  }

  const sameSubscription = SUPABASE_REALTIME.channel
    && SUPABASE_REALTIME.venueId === venueId
    && SUPABASE_REALTIME.date === date
    && SUPABASE_REALTIME.checklistIds.join(',') === checklistIds.join(',');
  if (sameSubscription) return;

  const requestId = ++SUPABASE_REALTIME_REQUEST_ID;
  await detachSupabaseRealtime();
  if (requestId !== SUPABASE_REALTIME_REQUEST_ID) return;

  const channel = DB.channel(`dailyops-today-${venueId}-${date}`)
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'daily_checklists',
      filter: `venue_id=eq.${venueId},work_date=eq.${date}`
    }, payload => {
      if (realtimePayloadMatchesDate(payload, date)) queueSupabaseRealtimeRefresh(venueId, date);
    })
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'daily_tasks',
      filter: `checklist_id=in.(${checklistIds.join(',')})`
    }, () => queueSupabaseRealtimeRefresh(venueId, date))
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'roster_assignments',
      filter: `venue_id=eq.${venueId},work_date=eq.${date}`
    }, payload => {
      if (realtimePayloadMatchesDate(payload, date)) queueSupabaseRealtimeRefresh(venueId, date);
    });

  SUPABASE_REALTIME = {
    ...blankSupabaseRealtimeState(),
    channel,
    venueId,
    date,
    checklistIds,
    status: 'CONNECTING'
  };
  // DELETE changes cannot be column-filtered by Postgres Changes. Keep the
  // live channel scoped for inserts/updates and use this small refetch timer
  // to catch an eligible one-off deletion without subscribing globally.
  SUPABASE_REALTIME.pollTimer = setInterval(() => {
    if (requestId === SUPABASE_REALTIME_REQUEST_ID && SUPABASE_REALTIME.channel === channel) {
      queueSupabaseRealtimeRefresh(venueId, date);
    }
  }, 15000);
  channel.subscribe(status => {
    if (requestId !== SUPABASE_REALTIME_REQUEST_ID || SUPABASE_REALTIME.channel !== channel) return;
    const previousStatus = SUPABASE_REALTIME.status;
    SUPABASE_REALTIME.status = status;
    if (status === 'SUBSCRIBED') {
      console.info('[supabase] realtime subscribed', { venueId, date });
      if (previousStatus !== 'CONNECTING') queueSupabaseRealtimeRefresh(venueId, date);
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
      console.warn('[supabase] realtime unavailable; query-based loading remains active', { venueId, date, status });
    }
  });
}

function syncSupabaseRealtimeForCurrentView() {
  if (isSupabaseMode() && AUTH.session && R.tab === 'today') subscribeSupabaseRealtime();
  else if (isSupabaseMode()) unsubscribeSupabaseRealtime();
}

const SUPABASE_HISTORY_CHECKLIST_LIMIT = 120;

function mapSupabaseHistoryDays(checklists, tasks, rosterRows) {
  const taskRowsByChecklist = {};
  (tasks || []).forEach(row => {
    taskRowsByChecklist[row.checklist_id] = taskRowsByChecklist[row.checklist_id] || [];
    taskRowsByChecklist[row.checklist_id].push(row);
  });
  const rowsByDate = {};
  (checklists || []).forEach(row => {
    rowsByDate[row.work_date] = rowsByDate[row.work_date] || [];
    rowsByDate[row.work_date].push(row);
  });
  const rosterByDate = {};
  (rosterRows || []).forEach(row => {
    rosterByDate[row.work_date] = rosterByDate[row.work_date] || { open: [], close: [] };
    if (rosterByDate[row.work_date][row.shift_type]) rosterByDate[row.work_date][row.shift_type].push(row.user_id);
  });

  return Object.keys(rowsByDate).sort().reverse().map(date => {
    const lists = { open: blankList(), close: blankList() };
    rowsByDate[date].forEach(row => {
      if (!lists[row.list_type]) return;
      lists[row.list_type] = {
        id: row.id,
        tasks: (taskRowsByChecklist[row.id] || [])
          .sort((a, b) => a.sort_order - b.sort_order || a.id.localeCompare(b.id))
          .map(rowData => applyRemoteTaskRow({ id: rowData.id }, rowData)),
        submitted: !!row.submitted,
        submittedBy: row.submitted_by,
        submittedAt: row.submitted_at,
        completeNotified: !!row.complete_notified
      };
    });
    return {
      date,
      roster: rosterByDate[date] || { open: [], close: [] },
      rosterAssignmentIds: { open: {}, close: {} },
      lists,
      reported: false,
      reportedAt: null
    };
  });
}

async function loadSupabaseHistory(force = false) {
  if (!isSupabaseMode() || !isMgr()) return;
  const context = V();
  if (!context || !context.realId) return;
  const venueId = context.realId;
  if (!force
    && SUPABASE_HISTORY.venueId === venueId
    && !SUPABASE_HISTORY.error
    && !SUPABASE_HISTORY.loading) return;

  const loadId = ++SUPABASE_HISTORY_LOAD_ID;
  const previousDate = SUPABASE_HISTORY.venueId === venueId ? SUPABASE_HISTORY.selectedDate : null;
  SUPABASE_HISTORY = {
    venueId, days: [], profilesById: {}, loading: true, error: null,
    selectedDate: previousDate
  };
  render();
  const isCurrentRequest = () => loadId === SUPABASE_HISTORY_LOAD_ID
    && SUPABASE_HISTORY.venueId === venueId;

  try {
    const checklistResult = await DB.from('daily_checklists')
      .select(REMOTE_CHECKLIST_SELECT)
      .eq('venue_id', venueId)
      .lt('work_date', dayKey())
      .order('work_date', { ascending: false })
      .order('list_type')
      .limit(SUPABASE_HISTORY_CHECKLIST_LIMIT);
    if (checklistResult.error) throw checklistResult.error;
    const checklists = checklistResult.data || [];
    const checklistIds = checklists.map(row => row.id);

    const taskResult = checklistIds.length
      ? await DB.from('daily_tasks')
        .select(REMOTE_TASK_SELECT)
        .in('checklist_id', checklistIds)
        .order('sort_order')
        .order('id')
      : { data: [], error: null };
    if (taskResult.error) throw taskResult.error;
    const tasks = taskResult.data || [];

    const dates = [...new Set(checklists.map(row => row.work_date))].sort();
    const rosterResult = dates.length
      ? await DB.from('roster_assignments')
        .select('id,venue_id,user_id,work_date,shift_type,start_time,end_time')
        .eq('venue_id', venueId)
        .gte('work_date', dates[0])
        .lte('work_date', dates[dates.length - 1])
        .order('work_date')
        .order('shift_type')
      : { data: [], error: null };
    if (rosterResult.error) throw rosterResult.error;
    const rosterRows = rosterResult.data || [];

    const profileIds = [...new Set([
      ...checklists.map(row => row.submitted_by),
      ...tasks.flatMap(row => [row.completed_by, row.added_by]),
      ...rosterRows.map(row => row.user_id)
    ].filter(Boolean))];
    const profileResult = profileIds.length
      ? await DB.from('profiles').select('id,display_name,email,phone,active').in('id', profileIds)
      : { data: [], error: null };
    if (profileResult.error) throw profileResult.error;
    if (!isCurrentRequest()) return;

    const profilesById = Object.fromEntries((profileResult.data || []).map(profile => [profile.id, profile]));
    Object.assign(SUPABASE_TEAM.profilesById, profilesById);
    const days = mapSupabaseHistoryDays(checklists, tasks, rosterRows);
    SUPABASE_HISTORY = {
      venueId,
      days,
      profilesById,
      loading: false,
      error: null,
      selectedDate: previousDate && days.some(day => day.date === previousDate)
        ? previousDate
        : (days[0] && days[0].date) || null
    };
  } catch (error) {
    if (!isCurrentRequest()) return;
    console.error('[supabase] history load failed', { venueId, error });
    SUPABASE_HISTORY = {
      venueId, days: [], profilesById: {}, loading: false,
      error: 'We could not load historical operations for this venue.', selectedDate: null
    };
  }
  if (isCurrentRequest()) render();
}

async function persistRemoteTask(task) {

    completed_by: task.status === 'done' ? task.doneBy : null,

    note: task.note ? task.note : null,
    reason: task.reason ? task.reason : null

    .update(payload)
    .eq('id', task.id)
    .select(REMOTE_TASK_SELECT)
    .single();
  if (error) throw error;
  applyRemoteTaskRow(task, data);
}

async function backfillLegacyRemoteTemplateTaskIds(context, checklists, tasks) {
  if (context.organisationRole !== 'manager') return false;
  const checklistTypeById = Object.fromEntries(checklists.map(row => [row.id, row.list_type]));
  const bucket = SUPABASE_TEMPLATES.byVenue[context.realId] || { open: [], close: [] };
  const updates = [];
  tasks.forEach(row => {
    if (row.source !== 'template' || row.template_task_id) return;
    const listType = checklistTypeById[row.checklist_id];
    const matches = (bucket[listType] || []).filter(templateTask =>
      routineTaskKey(templateTask) === routineTaskKey(row)
    );
    if (matches.length === 1) updates.push({ taskId: row.id, templateTaskId: matches[0].id });
  });
  if (!updates.length) return false;
  try {
    await Promise.all(updates.map(update =>
      linkRemoteDailyTaskTemplate(update.taskId, update.templateTaskId)
    ));
  } catch (error) {
    console.error('[supabase] legacy daily task template link failed', { venueId: context.realId, error });
    throw accessError('today-load', `We could not link today's routine tasks to their recurring templates for ${context.name}.`);
  }
  return true;
}

function today(vid) {
  const v = vid || V().id, k = dayKey();
  if (isSupabaseMode()) {
    const context = supabaseVenueContext(v);
    const remoteDay = context && SUPABASE_TODAY.byVenue[context.realId];
    if (!remoteDay || SUPABASE_TODAY.date !== k) {
      throw new Error(`Today's Supabase operations are not loaded for ${context ? context.name : 'this venue'}.`);
    }
    return remoteDay;
  }
  S.days[v] = S.days[v] || {};
  if (!S.days[v][k]) {
    S.days[v][k] = makeDay(k, { open: [], close: [] }, v);
    save();
  }
  return S.days[v][k];
}

function listStats(L) {
  const total = L.tasks.length;
  const done = L.tasks.filter(t => t.status === 'done').length;
  const flagged = L.tasks.filter(t => t.status !== 'done' && t.status !== 'pending').length;
  const pending = total - done - flagged;
  return { total, done, flagged, pending, pct: pct(done, total), complete: done === total && total > 0 };
}
function dayStats(day) {
  const a = listStats(day.lists.open), b = listStats(day.lists.close);
  const total = a.total + b.total, done = a.done + b.done;
  return { total, done, missed: total - done, pct: pct(done, total), open: a, close: b };
}
/* ==========================================================================
   DEMO NOTIFICATIONS
   --------------------------------------------------------------------------
   This local notifier is intentionally retained only for DEMO_MODE. Supabase
   mode reports completed shifts to the server-side Edge Function and reads
   delivery audit rows from notification_events.

   Production delivery is implemented in supabase/functions/notify-manager and
   supabase/functions/end-of-day. Keeping this adapter makes DEMO_MODE useful
   without allowing localStorage notifications into normal Supabase mode.
   ========================================================================== */
const Notifier = {
  async deliver(msg) {
    console.info(`[Notifier · STUB] ${msg.channel.toUpperCase()} → ${msg.to} :: ${msg.subject}`, msg);
    return { ok: true, stub: true, sentAt: new Date().toISOString() };
  },

  /* every venue has its own recipients and its own channel switches */
  channels(v) {
    const out = [];
    if (v.channelEmail) out.push({ channel: 'email', to: v.managerEmail });
    if (v.channelSms)   out.push({ channel: 'sms',   to: v.managerPhone });
    return out;
  },

  push(kind, built, meta) {
    const m = meta || {};
    const v = venue(m.venueId) || V();
    const chans = this.channels(v);
    if (!chans.length) { toast(`No notification channel is on for ${v.name}`, 'warn'); return []; }
    const made = [];
    chans.forEach(c => {
      const rec = {
        id: uid('n'), at: new Date().toISOString(), kind,
        venueId: v.id, venueName: v.name,
        channel: c.channel, to: c.to,
        subject: built.subject, html: built.html, text: built.text,
        read: false, dayKey: m.dayKey || dayKey(), listKey: m.listKey || null
      };
      S.notifications.unshift(rec);
      made.push(rec);
      this.deliver(rec);
    });
    save();
    return made;
  }
};

/* ------------------------------------------------------------ message copy */
function statusChipLabel(t) {
  if (t.status === 'done') return 'Done';

  }

  return `<li class="miss">${esc(t.title)} <span style="color:var(--danger)">[${esc(statusChipLabel(t))}${
    t.critical ? ' · critical' : ''}]</span><span style="color:var(--muted)">${why}</span></li>`;

function listBlockHtml(day, lk) {

  return `<h4 style="margin-top:14px">${m.full} — ${st.done}/${st.total}</h4>
    <p style="color:var(--muted);margin:0 0 4px">${sub}</p>
    <ul>${L.tasks.map(taskLineHtml).join('')}</ul>`;
}
function buildListComplete(v, day, lk) {
  const L = day.lists[lk], m = LIST_META[lk], st = listStats(L);
  const who = [...new Set(L.tasks.map(t => t.doneBy).filter(Boolean))].map(uname);
  return {
    subject: `✅ ${v.name} — ${m.full} complete, ${fmtDateShort(day.date)}`,
    html: `<h4>All ${m.label.toLowerCase()} tasks are done</h4>
      <p style="color:var(--muted);margin:0 0 10px">${esc(fmtDate(day.date))} · ${esc(v.name)}</p>
      <p><b>${st.done} of ${st.total}</b> tasks ticked off by ${esc(who.join(', ') || 'the team')}.</p>
      <ul>${L.tasks.map(taskLineHtml).join('')}</ul>`,
    text: `${v.name}: ${m.full} is complete — all ${st.total} tasks done by ${who.join(', ') || 'the team'}. ${fmtDateShort(day.date)}.`

}
function buildEndOfDay(v, day, auto) {
  const d = dayStats(day);
  const missed = [...day.lists.open.tasks, ...day.lists.close.tasks].filter(t => t.status !== 'done');
  const crit = missed.filter(t => t.critical);
  return {
    subject: `${v.name} — end of day, ${fmtDateShort(day.date)} (${d.done}/${d.total} done)`,
    html: `<h4>End of day summary</h4>
      <p style="color:var(--muted);margin:0 0 10px">${esc(fmtDate(day.date))} · ${esc(v.name)}${auto ? ' · auto-sent at cutoff' : ''}</p>
      <p style="font-size:15px"><b>${d.done} of ${d.total}</b> tasks completed (${d.pct}%).${
        missed.length ? ` <span style="color:var(--danger)"><b>${missed.length}</b> left undone${crit.length ? `, ${crit.length} of them critical` : ''}.</span>` : ' Nothing left undone.'}</p>
      ${listBlockHtml(day, 'open')}
      ${listBlockHtml(day, 'close')}`,
    text: `${v.name} end of day ${fmtDateShort(day.date)}: ${d.done}/${d.total} tasks done (${d.pct}%).${
      missed.length
        ? ` Left undone: ${missed.slice(0, 3).map(t => t.title).join('; ')}${missed.length > 3 ? `; +${missed.length - 3} more` : ''}.${
            crit.length ? ` ${plural(crit.length, 'critical task')} missed.` : ''} Full list in your email.`
        : ' Everything completed.'}`
  };
}

/* ----------------------------------------------------------- trigger rules
   Runs across EVERY venue, not just the one on screen — a manager watching
   Bondi still gets told when Surry Hills finishes its close list. In
   production this whole function lives in a scheduled backend job.
   -------------------------------------------------------------------------- */
function runTriggers(opts) {
  if (isSupabaseMode()) return 0;
  const o = opts || {};
  let fired = 0;
  const here = V().id;

  venueCatalog().forEach(v => {
    const day = today(v.id);
    const tag = v.id === here ? '' : ` · ${v.name}`;

    // 1. a list has every task ticked off -> notify straight away
    if (v.notifyComplete) {
      ['open','close'].forEach(lk => {
        const L = day.lists[lk], st = listStats(L);
        if (st.complete && !L.completeNotified) {
          L.completeNotified = true;
          Notifier.push('list-complete', buildListComplete(v, day, lk), { venueId: v.id, dayKey: day.date, listKey: lk });
          fired++;
          toast(`${LIST_META[lk].full} complete — manager notified${tag}`, 'ok');
        }
        if (!st.complete) L.completeNotified = false;   // reopened, allow it to fire again
      });
    }

    // 2. end of day: staff submitted the close list, or the cutoff time passed
    if (v.notifyEndOfDay && !day.reported) {
      const submitted = day.lists.close.submitted;
      const forced = o.forceEod && (!o.venueId || o.venueId === v.id);
      if (submitted || cutoffPassed(v) || forced) {
        day.reported = true;
        day.reportedAt = new Date().toISOString();
        const auto = !submitted && !forced;
        Notifier.push('end-of-day', buildEndOfDay(v, day, auto), { venueId: v.id, dayKey: day.date });
        fired++;
        toast(`End of day summary sent to the manager${tag}`, 'ok');
      }
    }
  });

  if (fired) save();
  return fired;
}
function cutoffPassed(v) {
  const [h, m] = String((v || V()).cutoff || '23:30').split(':').map(Number);
  const now = new Date();
  return now.getHours() > h || (now.getHours() === h && now.getMinutes() >= m);
}
const remoteUnreadCoverCount = () => isSupabaseMode() && AUTH.profile && isMgr()
  ? SUPABASE_COVER_REQUESTS.rows.filter(row => !row.manager_seen_at).length
  : 0;
const remoteUnreadNotificationCount = () => isSupabaseMode() && isMgr()
  ? SUPABASE_NOTIFICATIONS.rows.filter(row => row.deliveryStatus !== 'sent').length
  : 0;
const unreadCount = () => isSupabaseMode()
  ? remoteUnreadNotificationCount() + remoteUnreadCoverCount()
  : S.notifications.filter(n => !n.read).length;

/* ---------------------------------------------------------------- toasts */
function toast(msg, tone) {
  const root = $('#toast-root');
  while (root.children.length >= 3) root.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  const icon = tone === 'ok' ? 'check' : tone === 'warn' ? 'warn' : 'info';
  el.innerHTML = `<span class="t-ic">${ic(icon, 16)}</span><span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s, transform .25s'; el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; }, 3200);
  setTimeout(() => el.remove(), 3600);
}

/* ---------------------------------------------------------------- modals */
let modalOnClose = null;
function openModal(html, opts) {
  const o = opts || {};
  const root = $('#modal-root');
  root.innerHTML = `<div class="scrim" data-close="1"></div>
    <div class="modal ${o.wide ? 'wide' : ''}" role="document">${html}</div>`;
  root.classList.add('is-open');

  root.querySelector('.scrim').addEventListener('click', () => { if (!o.locked) closeModal(); });
  if (o.after) o.after(root);
}
function closeModal() {
  const root = $('#modal-root');
  root.classList.remove('is-open');
  root.innerHTML = '';
  const cb = modalOnClose; modalOnClose = null;
  if (cb) cb();
}
function confirmModal(title, body, confirmLabel, onYes, danger) {
  openModal(`
    <div class="modal-head"><div><div class="modal-title">${esc(title)}</div><div class="modal-sub">${esc(body)}</div></div></div>
    <div class="modal-foot">
      <button class="btn" data-x="cancel">Cancel</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-x="yes">${esc(confirmLabel)}</button>
    </div>`, {
    after(root) {
      root.querySelector('[data-x=cancel]').onclick = closeModal;
      root.querySelector('[data-x=yes]').onclick = () => { closeModal(); onYes(); };

}

function csvCell(v) { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
const CSV_HEAD = ['Venue','Date','List','Task','Critical','Source','Status','Completed by','Completed at','Reason / note'];
function csvRows(v, keys) {

function downloadCsv(rows, filename) {

let R = { tab: 'today', list: 'open', historyKey: null, rosterWeekStart: rosterWeekStartKey(dayKey()) };

const NAV_MGR = [
  { id:'today',     label:'Today',      icon:'home'  },
  { id:'templates', label:'Templates',  icon:'list'  },
  { id:'team',      label:'Team',       icon:'users' },
  { id:'history',   label:'History',    icon:'clock' },
  { id:'settings',  label:'Settings',   icon:'cog'   }
];

function ringHtml(value, size, done) {
  const r = (size / 2) - 5, c = 2 * Math.PI * r;
  const off = c - (clamp(value, 0, 100) / 100) * c;
  return `<div class="ring ${done ? 'is-done' : ''}" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle class="track" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="6"/>
      <circle class="prog" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="6"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg>
    <div class="ring-label">${value}%</div></div>`;
}
function avatarHtml(id, cls) {
  const u = user(id); if (!u) return '';
  return `<div class="avatar ${u.role === 'manager' ? 'is-mgr' : ''} ${cls || ''}" title="${esc(u.name)}">${esc(initials(u.name))}</div>`;
}
function avatarStack(ids) {
  if (!ids.length) return `<span class="tiny mut">Nobody rostered</span>`;
  return `<div class="row" style="gap:4px;min-width:0">${ids.map(id => avatarHtml(id, 'sm')).join('')}
    <span class="tiny mut" style="margin-left:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${
      ids.map(id => uname(id).split(' ')[0]).join(', ')}</span></div>`;
}

/* one task row, shared by the employee list and the manager view */
function taskRowHtml(t, o) {
  const opt = o || {};
  const done = t.status === 'done';
  const flag = t.status !== 'done' && t.status !== 'pending';
  const cls = ['task', done ? 'is-done' : '', flag ? 'is-flag' : '', opt.locked ? 'is-locked' : ''].join(' ');
  const tag = opt.locked ? 'div' : 'button';
  const meta = [];
  if (done && t.doneBy) meta.push(`<span class="row" style="gap:5px">${avatarHtml(t.doneBy, 'sm')}${esc(uname(t.doneBy).split(' ')[0])} · ${esc(fmtTime(t.doneAt))}</span>`);
  if (flag) meta.push(`<span class="chip ${REASONS[t.status].chip}">${esc(REASONS[t.status].label)}</span>`);
  if (t.critical) meta.push(`<span class="chip chip-accent">Critical</span>`);
  if (t.source === 'adhoc') meta.push(`<span class="chip">${opt.historical ? 'One-off' : 'Added today'}${t.addedBy ? ' · ' + esc(uname(t.addedBy).split(' ')[0]) : ''}</span>`);
  else if (opt.historical) meta.push('<span class="chip">Routine</span>');

  const canEditMeta = !opt.locked && me().active;
  const hasMeta = !!(t.note || t.reason);
  const metaAction = canEditMeta
    ? `<span class="btn btn-sm btn-ghost task-meta-action" data-act="task-meta" data-list="${opt.listKey}" data-id="${t.id}" role="button" tabindex="0" title="${hasMeta ? 'Edit note or reason' : 'Add note or reason'}" aria-label="${hasMeta ? 'Edit note or reason' : 'Add note or reason'}">${ic('note', 14)}<span>${hasMeta ? 'Edit note' : 'Note'}</span></span>`
    : '';
  const side = [metaAction, opt.side || ''].filter(Boolean).join('');

  return `<${tag} class="${cls}" ${opt.locked ? '' : `data-task="${t.id}" data-list="${opt.listKey}" type="button"`}>
    ${t.critical ? '<span class="task-critical-mark"></span>' : ''}
    <span class="tick">${ic(flag ? 'minus' : 'check', 15, 3)}</span>
    <span class="task-main">
      <span class="task-title">${esc(t.title)}</span>
      ${t.detail ? `<span class="task-detail" style="display:block">${esc(t.detail)}</span>` : ''}
      ${meta.length ? `<span class="task-meta">${meta.join('')}</span>` : ''}
      ${t.reason ? `<span class="task-note" style="display:block"><b>Reason:</b> ${esc(t.reason)}</span>` : ''}
      ${t.note ? `<span class="task-note" style="display:block"><b>Note:</b> ${esc(t.note)}</span>` : ''}
    </span>
    ${side}
  </${tag}>`;
}

/* ------------------------------------------------------------- chrome */
/* The venue's colour is the one thing that tells you at a glance which site
   you're looking at, so it drives --accent and everything derived from it. */
function applyVenueAccent() {
  const a = accentOf(V().accent);
  const [c, hi, ink] = document.documentElement.dataset.theme === 'dark' ? a.dark : a.light;
  const st = document.documentElement.style;
  st.setProperty('--accent', c);
  st.setProperty('--accent-hi', hi);
  st.setProperty('--accent-ink', ink);
}
function venueDotColor(v) {
  const a = accentOf(v.accent);
  return (document.documentElement.dataset.theme === 'dark' ? a.dark : a.light)[0];
}

  ensureVenue();
  applyVenueAccent();

  const m = me();

    $('#organisation-chev').innerHTML = ic('down', 14);

      : ''}${accessibleOrgs.map(organisation => {

  document.title = `${venueDisplayLabel(v)} — Daily Operations`;

  $('#cur-avatar').textContent = initials(m.name);
  $('#cur-avatar').className = 'avatar ' + (m.role === 'manager' ? 'is-mgr' : '');
  $('#cur-name').textContent = m.name;

  $('#user-chev').innerHTML = ic('down', 14);
  const sel = $('#user-switch');

  if (!supabase) {
    sel.innerHTML = S.users.map(u =>
      `<option value="${u.id}" ${u.id === m.id ? 'selected' : ''}>${esc(u.name)}${u.role === 'manager' ? ' (Manager)' : ''}${u.active ? '' : ' — inactive'}</option>`).join('');
  }

}

function render() {
  ensureCurrentTabAllowed();
  const content = $('#content');
  const previousScrollTop = content ? content.scrollTop : null;
  renderChrome();
  const page = $('#page');
  let html = '';
  if (!isMgr())                     html = pageEmployee();
  else if (R.tab === 'today')       html = pageManagerToday();
  else if (R.tab === 'templates')   html = pageTemplates();
  else if (R.tab === 'team')        html = pageTeam();
  else if (R.tab === 'history')     html = pageHistory();
  else if (R.tab === 'alerts')      html = pageAlerts();
  else if (R.tab === 'settings')    html = pageSettings();
  page.innerHTML = html;
  if (content && previousScrollTop !== null) {
    const previousBehavior = content.style.scrollBehavior;
    content.style.scrollBehavior = 'auto';
    content.scrollTop = previousScrollTop;
    content.style.scrollBehavior = previousBehavior;
  }
}

function personalRosterHtml() {
  if (!isSupabaseMode()) return '';
  const state = SUPABASE_MY_ROSTER_WEEK;
  const weekStart = state.start || rosterWeekStartKey(dayKey());
  const weekDates = rosterWeekDates(weekStart);
  const accessibleVenues = venueCatalog();
  const body = state.loading
    ? `<div class="empty" style="padding:18px">Loading your roster…</div>`
    : state.error
      ? `<div class="banner banner-warn">${ic('warn', 17)}<div>${esc(state.error)}<br><button class="btn btn-sm" data-act="my-roster-reload" style="margin-top:9px">Try again</button></div></div>`
      : `<div class="stack" style="gap:0">${weekDates.map(date => {
          const assignments = (state.rows || []).filter(row => row.work_date === date);
          return `<div class="row-b" style="padding:10px 0;border-bottom:1px solid var(--line)">
            <span style="font-weight:620;min-width:110px">${esc(fmtDateShort(date))}</span>
            <span class="row wrap" style="justify-content:flex-end;gap:5px;flex:1">
              ${assignments.length
                ? assignments.map(row => `<span class="chip chip-info">${esc(rosterVenueName(row.venue_id))} · ${esc(rosterShiftLabel(row.shift_type))}</span>`).join('')
                : '<span class="tiny mut">Not rostered</span>'}
            </span>
          </div>`;
        }).join('')}</div>`;
  return `<div class="card">
    <div class="card-head"><div style="flex:1"><div class="h3">My weekly roster</div>
      <div class="tiny mut">Your upcoming Opening and Closing Shift assignments across the venues you can access.</div></div>
      <div class="row" style="gap:5px">
        <button class="btn btn-sm btn-icon" data-act="my-roster-prev" title="Previous week">${ic('left', 14)}</button>
        <button class="btn btn-sm" data-act="my-roster-today">This week</button>
        <button class="btn btn-sm btn-icon" data-act="my-roster-next" title="Next week">${ic('right', 14)}</button>
      </div></div>
    <div class="card-foot tiny mut" style="border-top:0;padding-top:0">${esc(fmtDateShort(weekDates[0]))} – ${esc(fmtDateShort(weekDates[6]))}</div>
    <div class="card-body">${body}</div>
    <div class="card-foot"><div class="tiny mut" style="margin-bottom:6px">Venues you can access</div>
      <div class="row wrap" style="gap:5px">${accessibleVenues.length
        ? accessibleVenues.map(context => `<span class="chip"><span class="venue-dot" style="width:7px;height:7px;background:${venueDotColor(context)}"></span>${esc(context.name)}</span>`).join('')

function pageEmployee() {
  const day = today();
  const lk = R.list, L = day.lists[lk], m = LIST_META[lk], st = listStats(L);
  const rostered = day.roster[lk].includes(me().id);
  const locked = L.submitted;
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const weeklyRoster = personalRosterHtml();

  const segs = ['open','close'].map(k => {
    const s = listStats(day.lists[k]);
    return `<button data-list="${k}" class="${k === lk ? 'is-active' : ''}">
      ${ic(LIST_META[k].icon, 17)}<span>${LIST_META[k].label}</span>
      <span class="seg-count">${s.done}/${s.total}</span></button>`;
  }).join('');

  let banner = '';
  if (locked) {
    banner = `<div class="banner banner-ok">${ic('check', 17)}<div>
      <b>Shift submitted.</b> ${esc(uname(L.submittedBy))} sent this shift to the manager at ${esc(fmtTime(L.submittedAt))}. It's now read-only.</div></div>`;
  } else if (st.complete) {
    banner = `<div class="banner banner-info">${ic('check', 17)}<div>
      <b>All tasks complete — ready to submit.</b> Your manager is notified only when you submit the shift.</div></div>`;
  } else if (!rostered) {
    banner = `<div class="banner banner-warn">${ic('info', 17)}<div class="row-b" style="width:100%">
      <span>You're not rostered on the ${esc(m.full)} today.</span>
      <button class="btn btn-sm" data-act="cover" data-list="${lk}">I'm covering</button></div></div>`;
  }

  const rows = L.tasks.length
    ? L.tasks.map(t => taskRowHtml(t, { listKey: lk, locked: locked || !me().active })).join('')
    : `<div class="empty"><div class="empty-icon">${ic('list', 20)}</div>
        <div>No ${esc(m.full.toLowerCase())} tasks set for today.</div>
        <div class="tiny mut" style="margin-top:4px">Your manager hasn't published this shift yet.</div></div>`;

  const bar = locked
    ? `<div class="actionbar"><div class="ab-text">
         <div class="row" style="gap:8px"><span class="chip chip-ok chip-dot">Submitted</span>
         <span class="tiny mut">${st.done} of ${st.total} done${st.flagged ? ` · ${st.flagged} flagged` : ''}</span></div></div>
         <button class="btn btn-sm" data-act="reopen" data-list="${lk}">Reopen shift</button></div>`
    : `<div class="actionbar">
         <div class="ab-text">
           <div class="row-b" style="margin-bottom:6px">
             <span class="tiny" style="font-weight:640">${st.done} of ${st.total} done</span>
             <span class="tiny mut">${st.complete ? 'Ready to submit' : st.pending ? plural(st.pending, 'left') : 'All clear'}</span>
           </div>
           <div class="bar ${st.complete ? 'is-done' : ''}"><i style="width:${st.pct}%"></i></div>
         </div>
         <button class="btn btn-primary" data-act="review" data-list="${lk}">${ic('send', 16)} Submit shift</button>
       </div>`;

  return `
    <div class="page-head">
      <div class="page-title">${greet}, ${esc(me().name.split(' ')[0])}</div>
      <div class="page-sub">${esc(fmtDate(day.date))} · ${esc(V().name)}</div>
    </div>
    <div class="stack">
      <div class="segmented">${segs}</div>
      ${banner}
      <div class="card">
        <div class="card-head">
          ${ringHtml(st.pct, 44, st.complete)}
          <div style="flex:1;min-width:0">
            <div class="h3">${esc(m.full)}</div>
            <div class="tiny mut">${st.done} done · ${st.pending} to go${st.flagged ? ` · ${st.flagged} flagged` : ''}</div>
          </div>
          <div class="hide-sm">${avatarStack(day.roster[lk])}</div>
        </div>
        <div class="tasklist">${rows}</div>
      </div>
      <div class="tiny mut" style="text-align:center">Tap a task to tick it off. Use Note on any task to add a comment or incomplete reason as you work.</div>
    </div>
    ${weeklyRoster}
    ${bar}`;
}

   ========================================================================== */
function activityFeed(day) {
  const ev = [];
  ['open','close'].forEach(lk => {
    day.lists[lk].tasks.forEach(t => {
      if (t.status === 'done' && t.doneAt) ev.push({ at: t.doneAt, who: t.doneBy, text: `ticked <b>${esc(t.title)}</b>`, lk });
      if (t.source === 'adhoc' && t.addedBy) ev.push({ at: t.addedAt || day.date + 'T08:00:00', who: t.addedBy, text: `added <b>${esc(t.title)}</b> to the ${LIST_META[lk].full.toLowerCase()}`, lk });
    });
    const L = day.lists[lk];
    if (L.submitted) ev.push({ at: L.submittedAt, who: L.submittedBy, text: `submitted the <b>${LIST_META[lk].full.toLowerCase()}</b>`, lk });
  });
  return ev.sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 14);
}

/* a grouped roll-up of every accessible site, so the manager isn't blind to
   venues they aren't currently looking at. Clicking a card switches venue. */
function venueStripHtml() {
  const venues = venueCatalog().slice().sort((a, b) =>
    organisationName(a.organisationId).localeCompare(organisationName(b.organisationId))
      || a.name.localeCompare(b.name)
  );
  if (venues.length < 2) return '';
  const showOrganisation = AUTH.organisations.length > 1;
  return `<div class="card">
    <div class="card-head"><div class="h3">Across the group</div>
      <span class="tiny mut" style="margin-left:auto">${plural(venues.length, 'venue')} · ${showOrganisation && !AUTH.selectedOrganisationId ? 'all organisations' : 'today'}</span></div>
    <div class="vstrip">${venues.map((v, index) => {
      const d = dayStats(today(v.id));
      const col = venueDotColor(v);
      const cur = v.id === V().id;
      const crit = [...today(v.id).lists.open.tasks, ...today(v.id).lists.close.tasks].filter(t => t.critical && t.status !== 'done').length;
      const groupLabel = showOrganisation && (index === 0 || venues[index - 1].organisationId !== v.organisationId)
        ? `<div class="vstrip-group-label">${esc(organisationName(v.organisationId))}</div>`
        : '';
      return `${groupLabel}<button class="vcard ${cur ? 'is-current' : ''}" data-act="goto-venue" data-id="${v.id}">
        <span class="row" style="gap:7px;min-width:0">
          <span class="venue-dot" style="background:${col}"></span>
          <span style="min-width:0;flex:1">
            <span class="vcard-name" style="display:block">${esc(v.name)}</span>
            ${showOrganisation ? '<span class="tiny mut" style="display:block;margin-top:2px">' + esc(organisationName(v.organisationId)) + '</span>' : ''}
          </span>
          ${cur ? '<span class="chip chip-accent" style="margin-left:auto">Viewing</span>' : ''}
        </span>
        <span class="vcard-num">${d.done}<span class="mut" style="font-size:13px;font-weight:600">/${d.total}</span></span>
        <span class="bar" style="display:block;margin-top:7px"><i style="width:${d.pct}%;background:${col}"></i></span>
        <span class="tiny mut" style="display:block;margin-top:7px">${d.open.done}/${d.open.total} opening · ${d.close.done}/${d.close.total} closing${
          crit ? ` · <span style="color:var(--danger);font-weight:640">${crit} critical</span>` : ''}</span>
      </button>`;
    }).join('')}</div></div>`;
}

        <div class="page-sub">${esc(fmtDate(day.date))} · ${esc(V().name)}</div>
      </div>
      <div class="row wrap" style="gap:8px">
        <button class="btn btn-sm" data-act="eod">${ic('send', 15)} Run end of day</button>
        <button class="btn btn-sm btn-primary" data-act="add-task" data-list="${lk}">${ic('plus', 15)} One-off task</button>
      </div>
    </div>

    <div class="stack">
      <div class="stats">
        <div class="stat"><div class="stat-k">Completed</div><div class="stat-v">${d.done}<span style="font-size:15px;color:var(--muted)">/${d.total}</span></div><div class="stat-s">${d.pct}% of today</div></div>
        <div class="stat"><div class="stat-k">Outstanding</div><div class="stat-v" style="color:${d.missed ? 'var(--accent)' : 'var(--ok)'}">${d.missed}</div><div class="stat-s">${d.missed ? 'still to do' : 'nothing left'}</div></div>
        <div class="stat"><div class="stat-k">Critical outstanding</div><div class="stat-v" style="color:${critOut.length ? 'var(--danger)' : 'var(--ok)'}">${critOut.length}</div><div class="stat-s">${critOut.length ? 'need attention' : 'all covered'}</div></div>
        <div class="stat"><div class="stat-k">On shift</div><div class="stat-v">${new Set([...day.roster.open, ...day.roster.close]).size}</div><div class="stat-s">rostered today</div></div>
      </div>

      ${venueStripHtml()}

      <div class="grid grid-2">${summary}</div>

      ${critOut.length ? `<div class="banner banner-warn">${ic('warn', 17)}<div>
        <b>${plural(critOut.length, 'critical task')} not done yet:</b> ${critOut.map(t => esc(t.title)).join(' · ')}</div></div>` : ''}

      <div class="segmented">${segs}</div>

      <div class="card">
        <div class="card-head">
          <div style="flex:1;min-width:0">
            <div class="h3">${esc(m.full)}</div>
            <div class="tiny mut">${L.submitted ? `Submitted by ${esc(uname(L.submittedBy))} at ${esc(fmtTime(L.submittedAt))} — read-only` : 'Live — tap a task to tick it off on behalf of the team'}</div>
          </div>
          <span class="chip ${st.complete ? 'chip-ok' : ''}">${st.pct}%</span>
        </div>
      <div class="tasklist">${rows || `<div class="empty">No tasks on this shift.</div>`}</div>
        <div class="card-foot row" style="gap:8px">
          <button class="btn btn-sm" data-act="review" data-list="${lk}">${ic('note', 15)} Review notes &amp; reasons</button>
          <button class="btn btn-sm" data-act="add-task" data-list="${lk}">${ic('plus', 15)} Add a one-off task</button>
          <button class="btn btn-sm btn-ghost" data-act="sync-tpl" data-list="${lk}">${ic('reset', 15)} Re-apply routine tasks</button>
          ${L.submitted ? `<button class="btn btn-sm btn-ghost" data-act="reopen" data-list="${lk}">Reopen</button>` : ''}
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div class="h3">Activity</div><span class="tiny mut" style="margin-left:auto">${plural(feed.length, 'event')}</span></div>
        <div class="card-body">
          ${feed.length ? `<div class="feed">${feed.map(e => `
            <div class="feed-item">${avatarHtml(e.who, 'sm')}
              <div style="flex:1;min-width:0">
                <div class="feed-line"><b>${esc(uname(e.who).split(' ')[0])}</b> ${e.text}</div>
                <div class="feed-time">${esc(fmtTime(e.at))}</div>
              </div></div>`).join('')}</div>`
            : `<div class="empty" style="padding:20px">Nothing has happened yet today.</div>`}
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div class="h3">Operation controls</div></div>
        <div class="card-body row wrap" style="gap:8px">
          <button class="btn btn-sm" data-act="eod">${ic('send', 15)} Force end-of-day report</button>
          <button class="btn btn-sm" data-act="tick-all" data-list="${lk}">${ic('check', 15)} Tick everything on ${esc(m.full)}</button>
          <button class="btn btn-sm btn-danger" data-act="reset-day">${ic('reset', 15)} Reset today</button>
          <button class="btn btn-sm btn-danger" data-act="reset-all">${ic('trash', 15)} Wipe all demo data</button>
        </div>
      </div>
    </div>`;
}

/* ==========================================================================
   MANAGER · RECURRING SHIFT TASK TEMPLATES
   ========================================================================== */
function pageTemplates() {
  const card = k => {
    const m = LIST_META[k], t = TPL()[k];
    return `<div class="card">
      <div class="card-head">
        <div class="row" style="gap:8px;flex:1">${ic(m.icon, 18)}<div>
          <div class="h3">${m.full} template</div>
          <div class="tiny mut">${plural(t.length, 'routine task')} · ${t.filter(x => x.critical).length} critical</div>
        </div></div>
      </div>
      <div class="tasklist">
        ${t.length ? t.map((x, i) => `
          <div class="task is-locked">
            ${x.critical ? '<span class="task-critical-mark"></span>' : ''}
            <span class="sortrow">
              <button class="btn btn-sm btn-icon btn-ghost" data-act="tpl-up" data-list="${k}" data-id="${x.id}" ${i === 0 ? 'disabled' : ''} title="Move up">${ic('up', 13)}</button>
              <button class="btn btn-sm btn-icon btn-ghost" data-act="tpl-down" data-list="${k}" data-id="${x.id}" ${i === t.length - 1 ? 'disabled' : ''} title="Move down">${ic('down', 13)}</button>
            </span>
            <span class="task-main">
              <span class="task-title">${esc(x.title)}</span>
              ${x.detail ? `<span class="task-detail" style="display:block">${esc(x.detail)}</span>` : ''}
              <span class="task-meta">
                <button class="chip ${x.critical ? 'chip-accent' : ''}" data-act="tpl-crit" data-list="${k}" data-id="${x.id}" style="cursor:pointer">${x.critical ? 'Critical' : 'Mark critical'}</button>
              </span>
            </span>
            <span class="task-side">
              <button class="btn btn-sm btn-icon btn-ghost" data-act="tpl-edit" data-list="${k}" data-id="${x.id}" title="Edit">${ic('pencil', 14)}</button>
              <button class="btn btn-sm btn-icon btn-ghost" data-act="tpl-del" data-list="${k}" data-id="${x.id}" title="Delete">${ic('trash', 14)}</button>
            </span>
          </div>`).join('')
        : `<div class="empty">No routine tasks yet.</div>`}
      </div>
      <div class="card-foot row" style="gap:8px">
        <button class="btn btn-sm btn-primary" data-act="tpl-add" data-list="${k}">${ic('plus', 15)} Add routine task</button>
        <button class="btn btn-sm btn-ghost" data-act="sync-tpl" data-list="${k}">${ic('reset', 15)} Apply to today</button>
      </div>
    </div>`;
  };
  return `
    <div class="page-head row-b wrap">
      <div>
        <div class="page-title">Templates</div>
        <div class="page-sub">The recurring shift tasks published every day at <b>${esc(V().name)}</b>. One-off extras are added from Today's Operations.</div>
      </div>
      ${venueCatalog().length > 1 ? `<button class="btn btn-sm" data-act="copy-tpl">${ic('list', 15)} Copy from another venue</button>` : ''}
    </div>
    <div class="stack">
      <div class="banner banner-info">${ic('info', 17)}<div>
        Template edits apply to <b>tomorrow onwards</b>. Hit <b>Apply to today</b> to push changes into today's live list — already-ticked tasks keep their state.</div></div>
      <div class="grid grid-2">${card('open')}${card('close')}</div>
    </div>`;
}

/* ==========================================================================
   MANAGER · TEAM & ROSTER
   ========================================================================== */
function pageSupabaseTeam() {
  const day = today();
  const v = V();
  const scopeOrganisationIds = currentSupabaseOrganisationIds();
  const scopeIsAll = !AUTH.selectedOrganisationId && scopeOrganisationIds.length > 1;
  const all = supabaseMembersForCurrentScope();
  const groupedMembers = aggregateSupabaseTeamMembers(all);
  const globalAdminDirectory = isPlatformAdmin() && !AUTH.selectedOrganisationId;
  const directoryMembers = globalAdminDirectory ? platformAdminDirectoryMembers() : groupedMembers;
  const employees = groupedMembers.filter(member =>
    member.memberships.some(row => row.role === 'employee')
  );
  const currentOrganisationMembers = supabaseMembersForOrganisation(v.organisationId);
  const employeesHere = currentOrganisationMembers.filter(member =>
    member.role === 'employee' && member.venueIds.includes(v.realId)
  );
  const activeHere = employeesHere.filter(member => member.active);
  const weekStart = R.rosterWeekStart || rosterWeekStartKey(dayKey());
  const weekDates = rosterWeekDates(weekStart);
  const weekState = SUPABASE_ROSTER_WEEK;
  const weekRows = weekState.organisationId === currentSupabaseRosterScopeKey() && weekState.start === weekStart
    ? (weekState.rows || []) : [];

  const rosterRows = activeHere.length ? activeHere.map(member => `
    <tr>
      <td><div class="row" style="gap:9px">${avatarHtml(member.id, 'sm')}<span>${esc(member.displayName)}</span></div></td>
      ${['open','close'].map(k => `<td style="text-align:center">
        <button class="switch ${day.roster[k].includes(member.id) ? 'is-on' : ''}" data-act="roster" data-list="${k}" data-id="${member.id}"
          aria-label="${esc(member.displayName)} on ${k} shift" style="margin:0 auto"></button></td>`).join('')}
    </tr>`).join('') : `<tr><td colspan="3" class="mut" style="text-align:center;padding:22px">Nobody is available to roster at ${esc(v.name)} yet.</td></tr>`;

  const venueChips = member => member.protected && member.id !== AUTH.profile.id
    ? '<span class="chip chip-info">Protected account</span>'
    : member.role === 'manager'
    ? `<span class="chip chip-info">All venues (manager)</span>`
    : venueCatalog()
      .filter(context => context.organisationId === member.organisationId)
      .map(context => {
        const assigned = member.explicitVenueIds.includes(context.realId);
        return `<button class="chip ${assigned ? 'chip-accent' : ''}"
          data-act="toggle-user-venue" data-id="${member.id}" data-venue="${context.realId}" style="cursor:pointer"
          title="${assigned ? 'Remove from' : 'Assign to'} ${esc(context.name)}">
          <span class="venue-dot" style="width:7px;height:7px;background:${assigned ? venueDotColor(context) : 'currentColor'};opacity:${assigned ? 1 : .4}"></span>${esc(context.name)}</button>`;
      }).join('') || '<span class="tiny mut">No venue access</span>';

  const assignmentSummary = member => {
    const assignments = weekRows.filter(row => row.user_id === member.id)
      .slice()
      .sort((a, b) => `${a.work_date}:${a.shift_type}:${a.venue_id}`.localeCompare(`${b.work_date}:${b.shift_type}:${b.venue_id}`));
    if (!assignments.length) return '<span class="tiny mut">Not rostered this week</span>';
    const visible = assignments.slice(0, 3).map(row =>
      `<span class="chip">${esc(fmtDateShort(row.work_date))} · ${esc(rosterVenueName(row.venue_id))} · ${esc(rosterShiftLabel(row.shift_type))}</span>`
    ).join('');
    const more = assignments.length > 3 ? `<span class="tiny mut">+${assignments.length - 3} more</span>` : '';
    return `<div class="row wrap" style="gap:4px">${visible}${more}</div>`;
  };

  const staffRows = globalAdminDirectory ? directoryMembers.map(member => `
    <tr>
      <td><div class="row" style="gap:10px">${avatarHtml(member.id)}<div>
        <div style="font-weight:600">${esc(member.displayName)}</div>
        <div class="tiny mut">${esc(profileLoginLabel(member.email) || 'No login identifier')}</div>
        <div class="tiny mut">${member.platformRole === 'admin' ? 'Platform admin' : 'Platform user'}</div>
        ${member.protected ? '<div class="tiny" style="color:var(--warn)">Master administrator · Protected account</div>' : ''}
      </div></div></td>
      <td><div class="stack" style="gap:7px">${member.memberships.length ? member.memberships.map(orgMember => {
        const orgName = organisationName(orgMember.organisationId);
        const orgVenues = AUTH.venueContexts.filter(context => context.organisationId === orgMember.organisationId);
        const venueText = orgMember.role === 'manager'
          ? '<span class="chip chip-info">All venues through manager role</span>'
          : orgVenues.filter(context => orgMember.explicitVenueIds.includes(context.realId)).map(context =>
            `<span class="chip"><span class="venue-dot" style="width:7px;height:7px;background:${venueDotColor(context)}"></span>${esc(venueDisplayLabel(context))}</span>`
          ).join('') || '<span class="tiny mut">No venue access</span>';
        return `<div><div class="tiny mut">${esc(orgName)} · <b>${orgMember.role === 'manager' ? 'Manager' : 'Employee'}</b></div><div class="row wrap" style="gap:4px;margin-top:3px">${venueText}</div></div>`;
      }).join('') : '<span class="tiny mut">No organisation access</span>'}</div></td>
      <td>${assignmentSummary(member)}</td>
      <td><div class="stack" style="gap:4px"><span class="chip ${member.platformRole === 'admin' ? 'chip-info' : ''}">${member.platformRole === 'admin' ? 'Platform admin' : 'User'}</span>
        <span class="chip ${member.active ? 'chip-ok' : ''} chip-dot">${member.active ? 'Active' : 'Disabled'}</span></div></td>
      <td style="text-align:right"><div class="row" style="gap:4px;justify-content:flex-end">
        <button class="switch ${member.active ? 'is-on' : ''}" data-act="toggle-user" data-id="${member.id}" data-global="1"
          aria-label="Toggle access for ${esc(member.displayName)}" ${member.id === AUTH.profile.id || member.protected ? 'disabled title="Protected by DailyOps security policy"' : ''}></button>
        <button class="btn btn-sm btn-icon btn-ghost" data-act="edit-user" data-id="${member.id}" data-global="1" title="Manage organisation access">${ic('pencil', 14)}</button>
      </div></td>
    </tr>`).join('') : all.map(member => `
    <tr>
      <td><div class="row" style="gap:10px">${avatarHtml(member.id)}<div>
        <div style="font-weight:600">${esc(member.displayName)}</div>
        <div class="tiny mut">${esc(member.email)}</div>
        ${scopeIsAll ? '<div class="tiny mut">' + esc(organisationName(member.organisationId)) + '</div>' : ''}
        ${member.protected ? '<div class="tiny" style="color:var(--warn)">Master administrator · Protected account</div>' : ''}
        </div></div></td>
      <td><div class="row wrap" style="gap:5px">${venueChips(member)}</div></td>
      <td>${assignmentSummary(member)}</td>
      <td><div class="stack" style="gap:4px"><span class="chip ${member.role === 'manager' ? 'chip-info' : ''}">${member.role === 'manager' ? 'Manager' : 'Employee'}</span>
        <span class="chip ${member.active ? 'chip-ok' : ''} chip-dot">${member.active ? 'Active' : 'Disabled'}</span></div></td>
      <td style="text-align:right"><div class="row" style="gap:4px;justify-content:flex-end">
        <button class="switch ${member.active ? 'is-on' : ''}" data-act="toggle-user" data-id="${member.id}" data-organisation="${member.organisationId}"
          aria-label="Toggle access for ${esc(member.displayName)}" ${member.id === AUTH.profile.id || member.protected ? 'disabled title="Protected by DailyOps security policy"' : ''}></button>
        <button class="btn btn-sm btn-icon btn-ghost" data-act="edit-user" data-id="${member.id}" data-organisation="${member.organisationId}" title="Edit profile and access">${ic('pencil', 14)}</button>
      </div></td>
    </tr>`).join('');

  const planningVenues = managerVenueCatalog();
  const plannerRows = employees.filter(member => member.active).map(member => {
    const eligibleVenues = planningVenues.filter(context =>
      canRosterSupabaseMemberAtVenue(member, context)
    );
    const cells = weekDates.map(date => {
      const assignments = weekRows.filter(row => row.user_id === member.id && row.work_date === date);
      const assignmentHtml = assignments.length
        ? assignments.map(row => `<span class="chip chip-info" style="display:block;margin-bottom:4px">${esc(rosterVenueName(row.venue_id))} · ${esc(rosterShiftLabel(row.shift_type))}</span>`).join('')
        : '<span class="tiny mut">No assignment</span>';
      const controls = date >= dayKey() && eligibleVenues.length
        ? eligibleVenues.map(context => `<div class="row" style="gap:4px;margin-top:7px">
            ${['open','close'].map(listType => {
              const assigned = assignments.some(row =>
                row.venue_id === context.realId && row.shift_type === listType
              );
              return `<button class="switch ${assigned ? 'is-on' : ''}" data-act="roster-week" data-list="${listType}" data-id="${member.id}" data-date="${date}" data-venue="${context.realId}"
                title="${assigned ? 'Remove' : 'Assign'} ${esc(LIST_META[listType].full)} at ${esc(venueDisplayLabel(context))} on ${esc(fmtDateShort(date))}" aria-label="${assigned ? 'Remove' : 'Assign'} ${esc(LIST_META[listType].full)} at ${esc(venueDisplayLabel(context))}" style="margin:0"></button>`;
            }).join('')}
            <span class="tiny mut">${esc(venueDisplayLabel(context))}</span>
          </div>`).join('')
        : `<span class="tiny mut" style="display:block;margin-top:7px">${date < dayKey() ? 'Past date' : 'No eligible venue access'}</span>`;
      return `<td style="vertical-align:top;min-width:210px"><div class="stack" style="gap:2px">${assignmentHtml}</div>${controls}</td>`;
    }).join('');
    return `<tr><td style="vertical-align:top"><div class="row" style="gap:8px">${avatarHtml(member.id, 'sm')}<span>${esc(member.displayName)}</span><span class="tiny mut">${esc(member.organisationNames.join(', '))}</span></div></td>${cells}</tr>`;
  }).join('');

  const plannerContent = !weekState.start || weekState.start !== weekStart || weekState.loading
    ? `<div class="empty" style="padding:24px">Loading the organisation roster for this week…</div>`
    : weekState.error
      ? `<div class="banner banner-warn" style="margin:14px">${ic('warn', 17)}<div>${esc(weekState.error)}<br><button class="btn btn-sm" data-act="roster-week-reload" style="margin-top:9px">Try again</button></div></div>`
      : `<div class="tablewrap"><table class="tbl" style="min-width:1320px">
          <thead><tr><th>Employee</th>${weekDates.map(date => `<th>${esc(fmtDateShort(date))}</th>`).join('')}</tr></thead>
          <tbody>${plannerRows || `<tr><td colspan="8" class="mut" style="text-align:center;padding:22px">No active employees are available for roster planning.</td></tr>`}</tbody>
        </table></div>`;

  const managers = groupedMembers.filter(member =>
    member.memberships.some(row => row.role === 'manager')
  );
  const scopeLabel = globalAdminDirectory
    ? 'all organisations and profiles'
    : scopeIsAll ? 'all managed organisations' : organisationName(v.organisationId);
  const teamActions = isPlatformAdmin()
    ? `<div class="row wrap" style="gap:8px"><button class="btn btn-sm btn-primary" data-act="create-user">${ic('plus', 15)} Create user</button></div>`
    : '';
  return `
    <div class="page-head row-b wrap">
      <div>
        <div class="page-title">Team</div>
        <div class="page-sub">Staff, venue access, and roster planning across ${esc(scopeLabel)}.</div>
      </div>
      ${teamActions}
    </div>
    <div class="stack">
      <div class="banner banner-info">${ic('info', 17)}<div>
        ${isPlatformAdmin()
          ? 'This directory includes every profile, including users with no organisation membership. Create users here, then use Organisation access to manage their memberships and venue access.'
          : 'This screen manages existing organisation members, venue access, active state, and roster planning. Ask a platform administrator to create new Auth users.'}</div></div>
      <div class="card">
        <div class="card-head"><div style="flex:1">
          <div class="row" style="gap:8px"><span class="venue-dot" style="background:${venueDotColor(v)}"></span>
            <div class="h3">Roster · ${esc(venueDisplayLabel(v))} · ${esc(fmtDateShort(day.date))}</div></div>
          <div class="tiny mut">Only active employees with access to this venue can be assigned by a manager. Employees can use the existing "I'm covering" action.</div>
        </div></div>
        <div class="tablewrap"><table class="tbl">
          <thead><tr><th>Employee</th><th style="text-align:center">Opening</th><th style="text-align:center">Closing</th></tr></thead>
          <tbody>${rosterRows}</tbody>
        </table></div>
      </div>

      <div class="card">
        <div class="card-head"><div style="flex:1">
          <div class="h3">Weekly roster planner</div>
          <div class="tiny mut">Assignments shown across every accessible venue in ${esc(scopeLabel)}. Each employee's controls are shown for every eligible venue.</div>
        </div><div class="row" style="gap:5px">
          <button class="btn btn-sm btn-icon" data-act="roster-week-prev" title="Previous week">${ic('left', 14)}</button>
          <button class="btn btn-sm" data-act="roster-week-today">This week</button>
          <button class="btn btn-sm btn-icon" data-act="roster-week-next" title="Next week">${ic('right', 14)}</button>
        </div></div>
        <div class="card-foot tiny mut" style="border-top:0;padding-top:0">${esc(fmtDateShort(weekDates[0]))} – ${esc(fmtDateShort(weekDates[6]))} · Opening and Closing Shift assignments</div>
        ${plannerContent}
      </div>

      <div class="card">
        <div class="card-head"><div style="flex:1"><div class="h3">Organisation members</div>
          <div class="tiny mut">${scopeIsAll ? 'All members across your managed organisations are shown here. Shared employees appear once per organisation membership so their organisation-specific venue access remains clear.' : 'Every member of this organisation is shown here, including employees who are not assigned to the selected venue.'} Removing the last venue is allowed and removes operational access without deleting history.</div></div>
          <span class="tiny mut nowrap hide-sm">${employees.filter(member => member.active).length} active employees · ${directoryMembers.length} people</span></div>
        <div class="tablewrap"><table class="tbl">
          <thead><tr><th>${globalAdminDirectory ? 'Profile' : 'Member'}</th><th>${globalAdminDirectory ? 'Organisation / venue access' : 'Venue access'}</th><th>Roster this week</th><th>${globalAdminDirectory ? 'Platform / status' : 'Role / access'}</th><th></th></tr></thead>
          <tbody>${staffRows || `<tr><td colspan="5" class="mut" style="text-align:center;padding:22px">No organisation members yet.</td></tr>`}</tbody>
        </table></div>
        <div class="card-foot tiny mut">Managers: ${managers.map(member => esc(member.displayName)).join(', ') || 'None'} — organisation role and platform role are separate.${globalAdminDirectory ? ' Platform admins can manage organisation access from each profile.' : ''}</div>
      </div>
    </div>`;
}

  const v = V();
  const all = S.users.filter(u => u.role === 'employee');

        <button class="switch ${day.roster[k].includes(u.id) ? 'is-on' : ''}" data-act="roster" data-list="${k}" data-id="${u.id}"

      data-act="toggle-user-venue" data-id="${u.id}" data-venue="${x.id}" style="cursor:pointer"
      title="${u.venues.includes(x.id) ? 'Remove from' : 'Assign to'} ${esc(x.name)}">
      <span class="venue-dot" style="width:7px;height:7px;background:${u.venues.includes(x.id) ? venueDotColor(x) : 'currentColor'};opacity:${u.venues.includes(x.id) ? 1 : .4}"></span>${esc(x.name)}</button>`).join('');

  const staffRows = all.map(u => `
    <tr>
      <td><div class="row" style="gap:10px">${avatarHtml(u.id)}<div>
        <div style="font-weight:600">${esc(u.name)}</div>

            <div class="h3">Roster · ${esc(v.name)} · ${esc(fmtDateShort(day.date))}</div></div>

        <div class="tablewrap"><table class="tbl">
