/* ------------------------------------------------------------------- init */
function tickClock() {
  const el = $('#sb-time');
  if (el) el.textContent = new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function showAuthError(message) {
  const el = $('#auth-error');
  el.textContent = message || '';
  el.hidden = !message;
}

function showAuthLoading() {
  $('#app').hidden = true;
  $('#auth-screen').hidden = false;
  $('#auth-loading').hidden = false;
  $('#auth-status').hidden = true;
  $('#login-form').hidden = true;
  $('#auth-logout').hidden = true;
  showAuthError('');
}

function showLogin(message, allowLogout = false) {
  $('#app').hidden = true;
  $('#auth-screen').hidden = false;
  $('#auth-loading').hidden = true;
  $('#auth-status').hidden = true;
  $('#login-form').hidden = false;
  $('#auth-logout').hidden = !allowLogout;
  $('#login-submit').disabled = !DB;
  showAuthError(message);
}

function showAccessError(message) {
  $('#app').hidden = true;
  $('#auth-screen').hidden = false;
  $('#auth-loading').hidden = true;
  $('#auth-status').textContent = message || '';
  $('#auth-status').hidden = !message;
  $('#login-form').hidden = true;
  $('#auth-logout').hidden = false;
  showAuthError('');
}

function showApp() {
  $('#auth-screen').hidden = true;
  $('#app').hidden = false;
  $('#auth-status').hidden = true;
  $('#login-form').hidden = false;
  $('#auth-logout').hidden = true;
  $('#login-submit').disabled = false;
  showAuthError('');
}

async function restoreAuthenticatedApp(session) {
  const restoreId = ++AUTH_RESTORE_ID;
  AUTH.session = session;
  if (!session) {
    unsubscribeSupabaseRealtime();
    stopSupabaseAccessRevalidation();
    AUTH.profile = null;
    AUTH.organisationMemberships = [];
    AUTH.organisations = [];
    AUTH.selectedOrganisationId = null;
    AUTH.venueContexts = [];
    AUTH.selectedVenueId = null;
    SUPABASE_TODAY = { date: null, byVenue: {} };
    SUPABASE_HISTORY_LOAD_ID++;
    SUPABASE_HISTORY = { venueId: null, days: [], profilesById: {}, loading: false, error: null, selectedDate: null };
    SUPABASE_TEMPLATES = { byVenue: {} };
    SUPABASE_TEAM = { members: [], profilesById: {}, venueIdsByUser: {}, protectedProfileIds: [] };
    SUPABASE_ROSTER_WEEK = { organisationId: null, start: null, end: null, rows: [], loading: false, error: null };
    SUPABASE_MY_ROSTER_WEEK = { start: null, end: null, rows: [], loading: false, error: null };
    SUPABASE_COVER_REQUESTS = { rows: [], loading: false, error: null };
    SUPABASE_NOTIFICATIONS = { rows: [], loading: false, error: null };
    SUPABASE_NOTIFICATION_RECIPIENTS = { venueId: null, rows: [], eligibleProfiles: [], loading: false, error: null };
    S = null;
    showLogin();
    return;
  }
  showAuthLoading();
  try {
    await loadAuthenticatedProfile(session);
  } catch (error) {
    if (restoreId !== AUTH_RESTORE_ID) return;
    AUTH.profile = null;
    S = null;
    showAccessError(`We could not load your DailyOps profile. ${dbError(error)}`);
    return;
  }
  if (restoreId !== AUTH_RESTORE_ID) return;
  AUTH.ephemeralDemoVenueIds = [];
  load();
  try {
    await loadOrganisationAccess(session);
    await loadSupabaseTeam();
    await loadSupabaseTemplates();
    await loadSupabaseToday();
  } catch (error) {
    if (restoreId !== AUTH_RESTORE_ID) return;
    console.error('[supabase] organisation, venue, and today operations restore failed', error);
    clearSupabaseAccessRuntime(true);
    showAccessError(error.accessCode ? error.message : 'We could not load your DailyOps organisation and venue access.');
    startSupabaseAccessRevalidation();
    return;
  }
  if (restoreId !== AUTH_RESTORE_ID) return;
  showApp();
  render();
  syncSupabaseRealtimeForCurrentView();
  startSupabaseAccessRevalidation();
  if (isMgr()) {
    loadSupabaseCoverRequests();
    loadSupabaseNotifications();
    loadSupabaseNotificationRecipients();
    if (R.tab === 'history') loadSupabaseHistory();
  }
  else loadSupabaseMyRosterWeek(rosterWeekStartKey(dayKey()), true);
}

async function signIn(event) {
  event.preventDefault();
  if (!DB) {
    showAuthError('DailyOps could not initialise Supabase. Check the public configuration and try again.');
    return;
  }
  const button = $('#login-submit');
  button.disabled = true;
  showAuthError('');
  const identifier = $('#login-username').value;
  const password = $('#login-password').value;
  let email;
  try {
    email = usernameToAuthEmail(identifier);
  } catch (validationError) {
    button.disabled = false;
    showAuthError(validationError.message);
    return;
  }
  let data, error;
  try {
    ({ data, error } = await DB.auth.signInWithPassword({ email, password }));
  } catch (authError) {
    button.disabled = false;
    showAuthError('Could not sign in. Check your username, password and connection, then try again.');
    return;
  }
  if (error) {
    button.disabled = false;
    showAuthError('Invalid username or password.');
    return;
  }
  if (!data.session) {
    button.disabled = false;
    showAuthError('Supabase did not return an authenticated session. Please try again.');
    return;
  }
  await restoreAuthenticatedApp(data.session);
  button.disabled = false;
}

async function startApp() {
  try {
    const th = localStorage.getItem('dailyops.theme');
    if (th) document.documentElement.dataset.theme = th;
    else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
    if (localStorage.getItem('dailyops.mobile') === '1') document.body.classList.add('mobile-view');
  } catch (e) {}

  if (isSupabaseMode()) {
    showAuthLoading();
    const configError = !SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY
      ? 'Supabase is not configured. Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in supabase/config.js.'
      : SUPABASE_URL.includes('YOUR_PROJECT') || SUPABASE_PUBLISHABLE_KEY.includes('YOUR_')
        ? 'Supabase is still using placeholder configuration. Update supabase/config.js or enable DEMO_MODE explicitly.'
        : '';
    if (configError) { showLogin(configError); return; }
    if (!window.supabase || !window.supabase.createClient) {
      showLogin('The Supabase client library did not load. Check the network connection and try again.');
      return;
    }
    try {
      DB = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
    } catch (error) {
      showLogin(`Supabase could not initialise. ${dbError(error)}`);
      return;
    }
    let data, error;
    try {
      ({ data, error } = await DB.auth.getSession());
    } catch (sessionError) {
      showLogin(`Supabase could not restore your session. ${dbError(sessionError)}`);
      return;
    }
    if (error) { showLogin(error.message); return; }
    AUTH.session = data.session;
    DB.auth.onAuthStateChange((event, session) => {
      AUTH.session = session;
      if (event === 'SIGNED_OUT' || !session) {
        unsubscribeSupabaseRealtime();
        stopSupabaseAccessRevalidation();
        AUTH_RESTORE_ID++;
        AUTH.profile = null;
        AUTH.organisationMemberships = [];
        AUTH.organisations = [];
        AUTH.selectedOrganisationId = null;
        AUTH.venueContexts = [];
        AUTH.selectedVenueId = null;
        SUPABASE_TODAY = { date: null, byVenue: {} };
        SUPABASE_HISTORY_LOAD_ID++;
        SUPABASE_HISTORY = { venueId: null, days: [], profilesById: {}, loading: false, error: null, selectedDate: null };
        SUPABASE_TEMPLATES = { byVenue: {} };
        SUPABASE_TEAM = { members: [], profilesById: {}, venueIdsByUser: {}, protectedProfileIds: [] };
        SUPABASE_ROSTER_WEEK = { organisationId: null, start: null, end: null, rows: [], loading: false, error: null };
        SUPABASE_MY_ROSTER_WEEK = { start: null, end: null, rows: [], loading: false, error: null };
        SUPABASE_COVER_REQUESTS = { rows: [], loading: false, error: null };
        SUPABASE_NOTIFICATIONS = { rows: [], loading: false, error: null };
        SUPABASE_NOTIFICATION_RECIPIENTS = { venueId: null, rows: [], eligibleProfiles: [], loading: false, error: null };
        S = null;
        showLogin();
      } else if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
        setTimeout(() => restoreAuthenticatedApp(session), 0);
      }
    });
    if (!AUTH.session) showLogin();
    else await restoreAuthenticatedApp(AUTH.session);
    tickClock();
    setInterval(tickClock, 30000);
    console.info('%cDailyOps — Supabase Auth + venue + today operations', 'font-weight:700;font-size:13px');
    return;
  }

  load();
  showApp();
  tickClock();
  render();

  // cutoff watcher — in production this is a scheduled backend job, not a timer
  setInterval(() => { tickClock(); if (runTriggers()) render(); }, 30000);

  console.info('%cDailyOps — Daily Operations (demo, multi-venue)', 'font-weight:700;font-size:13px');
  console.info(`${S.venues.length} venues: ${S.venues.map(v => v.name).join(', ')}`);
  console.info('Notifications are stubbed: see Notifier.deliver(). State lives in localStorage["' + STORE_KEY + '"].');
}

$('#login-form').addEventListener('submit', signIn);
$('#btn-logout').addEventListener('click', async () => {
  if (DB) await DB.auth.signOut();
});
$('#auth-logout').addEventListener('click', async () => {
  if (DB) await DB.auth.signOut();
});

startApp();
