<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DailyOps — Daily Operations</title>
<meta name="description" content="DailyOps multi-venue daily operations and opening/closing shift tasks" />
<style>
/* ==========================================================================
   DAILYOPS — DAILY OPERATIONS
   Single-file demo. Design tokens -> layout -> components -> responsive.
   Responsive rules use @container so the "Mobile view" toggle and a genuinely
   narrow window both hit the exact same breakpoints.
   ========================================================================== */

/* ---------- reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
 [hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
h1,h2,h3,h4,p,figure { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent-soft); color: var(--ink); }

/* ---------- tokens ---------- */
:root {
  --bg:          #F6F7FB;
  --backdrop:    #EDEFF6;
  --surface:     #FFFFFF;
  --surface-2:   #F8F9FC;
  --surface-3:   #EEF1F7;
  --ink:         #151A27;
  --ink-2:       #465066;
  --muted:       #7E899F;
  --line:        #E2E6EF;
  --line-2:      #D3D9E6;

  /* --accent / --accent-hi / --accent-ink are overwritten per venue at runtime
     (see applyVenueAccent). Everything else derives from them. */
  --accent:      #B8451F;
  --accent-hi:   #C8532B;
  --accent-ink:  #FFFFFF;
  --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--surface));
  --accent-line: color-mix(in srgb, var(--accent) 32%, var(--surface));

  --ok:          #1A7F43;
  --ok-soft:     #E2F4E9;
  --warn:        #A25B06;
  --warn-soft:   #FBEEDA;
  --danger:      #B3261E;
  --danger-soft: #FBE6E4;
  --info:        #1F4FBF;
  --info-soft:   #E6ECFC;

  --focus:       var(--accent);
  --shadow-sm:   0 1px 2px rgba(26,21,18,.06), 0 1px 3px rgba(26,21,18,.04);
  --shadow-md:   0 2px 4px rgba(26,21,18,.05), 0 8px 20px rgba(26,21,18,.07);
  --shadow-lg:   0 12px 40px rgba(26,21,18,.16), 0 2px 8px rgba(26,21,18,.08);

  --r-sm: 9px; --r-md: 13px; --r-lg: 18px; --r-xl: 24px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
html[data-theme="dark"] {
  --bg:          #0B1020;
  --backdrop:    #080C18;
  --surface:     #11182B;
  --surface-2:   #151F36;
  --surface-3:   #1B2741;
  --ink:         #F5F7FB;
  --ink-2:       #C8D0DF;
  --muted:       #91A0BA;
  --line:        #26324B;
  --line-2:      #34425F;

  --accent:      #F08A5D;
  --accent-hi:   #F79C72;
  --accent-ink:  #2A1006;
  --accent-soft: color-mix(in srgb, var(--accent) 20%, var(--surface));
  --accent-line: color-mix(in srgb, var(--accent) 38%, var(--surface));

  --ok:          #56C98A;
  --ok-soft:     #17301F;
  --warn:        #E5A63C;
  --warn-soft:   #33260F;
  --danger:      #F4776D;
  --danger-soft: #351B19;
  --info:        #86A9F5;
  --info-soft:   #1A2340;

  --focus:       var(--accent);
  --shadow-sm:   0 1px 2px rgba(0,0,0,.4);
  --shadow-md:   0 2px 4px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.35);
  --shadow-lg:   0 16px 48px rgba(0,0,0,.55);
}

body {
  font-family: var(--sans);
  background: var(--backdrop);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.45;
}

/* ---------- shell ---------- */
.viewport { height: 100dvh; display: flex; align-items: center; justify-content: center; }
.frame { width: 100%; height: 100%; background: var(--bg); position: relative; }
.app {
  position: relative; height: 100%; display: flex; flex-direction: column;
  overflow: hidden; container-type: inline-size; container-name: app;
  background: var(--bg);
}
.auth-screen {
  min-height: 100%; display: grid; place-items: center; padding: 24px;
  background: var(--bg);
}
.auth-card {
  width: min(100%, 420px); padding: 28px; border: 1px solid var(--line);
  border-radius: var(--r-xl); background: var(--surface); box-shadow: var(--shadow-md);
}
.auth-brand { display: flex; align-items: center; gap: 11px; margin-bottom: 24px; }
.auth-brand .logo { width: 42px; height: 42px; }
.auth-title { font-size: 24px; font-weight: 720; letter-spacing: -.03em; }
.auth-sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.auth-loading { color: var(--muted); font-size: 13px; padding: 10px 0 2px; }
.auth-status { margin-bottom: 14px; }
.auth-error { color: var(--danger); background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--surface)); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13px; }
.auth-card .btn { width: 100%; justify-content: center; }
.statusbar { display: none; }

/* mobile-view toggle: shrink the frame; container queries do the rest */
body.mobile-view .viewport {
  background:
    radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
    var(--backdrop);
  padding: 20px;
}
body.mobile-view .frame {
  width: 402px; height: min(852px, 100dvh - 40px);
  border-radius: 46px; border: 11px solid #0B0908;
  box-shadow: var(--shadow-lg), 0 0 0 2px #2B2523, inset 0 0 0 1px rgba(255,255,255,.06);
  overflow: hidden;
}
body.mobile-view .app { border-radius: 35px; }
body.mobile-view .statusbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 30px 4px; font-size: 13px; font-weight: 650; letter-spacing: .01em;
  color: var(--ink); background: var(--surface); flex: 0 0 auto;
}
.statusbar .sb-right { display: flex; align-items: center; gap: 5px; }

/* ---------- top bar ---------- */
.topbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
  padding: 12px 18px; background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo {
  width: 34px; height: 34px; border-radius: 11px; flex: 0 0 auto;
  background: linear-gradient(140deg, var(--accent-hi), var(--accent));
  color: var(--accent-ink); display: grid; place-items: center;
  font-weight: 800; font-size: 15px; letter-spacing: -.03em;
  box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent);
}
.brand-text { min-width: 0; }
.brand-name { font-weight: 680; font-size: 14.5px; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-spacer { flex: 1 1 auto; }
.topbar-actions { display: flex; align-items: center; gap: 6px; }

.iconbtn {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  color: var(--ink-2); border: 1px solid transparent; position: relative; flex: 0 0 auto;
  transition: background .14s, color .14s, border-color .14s;
}
.iconbtn:hover { background: var(--surface-3); color: var(--ink); }
.iconbtn.is-on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.dot-badge {
  position: absolute; top: 5px; right: 5px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: var(--accent); color: var(--accent-ink);
  font-size: 10px; font-weight: 750; display: grid; place-items: center;
  border: 2px solid var(--surface);
}

/* pickers — a native <select> laid invisibly over styled chrome, so mobile gets
   the OS picker while the button still looks like the rest of the app */
.pickwrap {
  position: relative; display: flex; align-items: center; gap: 8px; min-width: 0;
  padding: 4px 9px 4px 4px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface-2); transition: border-color .14s, background .14s;
}
.pickwrap:hover { border-color: var(--line-2); background: var(--surface-3); }
.pickwrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.pickwrap select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; }
.pickwrap.is-single { pointer-events: none; }
.pickwrap.is-single .pick-chev { display: none; }
.pick-text { min-width: 0; }
.pick-name { font-size: 13px; font-weight: 645; letter-spacing: -.014em; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-sub { font-size: 10.5px; color: var(--muted); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-chev { color: var(--muted); flex: 0 0 auto; }

/* venue colour picker */
.swatches { display: flex; gap: 9px; flex-wrap: wrap; }
.swatch { width: 32px; height: 32px; border-radius: 10px; border: 2px solid transparent; outline-offset: 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); transition: transform .12s; }
.swatch:hover { transform: scale(1.06); }
.swatch.is-sel { border-color: var(--ink); }
.venue-row { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.venue-row:last-child { border-bottom: 0; }
.venue-dot { width: 11px; height: 11px; border-radius: 999px; flex: 0 0 auto; }

/* cross-venue strip */
.vstrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; padding: 15px 17px 17px; }
.vstrip-group-label { grid-column: 1 / -1; margin-top: 2px; color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.vcard { text-align: left; padding: 12px 13px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); transition: border-color .14s, background .14s; min-width: 0; }
.vcard:hover { border-color: var(--line-2); background: var(--surface-3); }
.vcard.is-current { border-color: var(--accent); background: var(--accent-soft); }
.vcard-name { font-size: 13.5px; font-weight: 645; letter-spacing: -.015em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.vcard-num { display: block; font-size: 21px; font-weight: 720; letter-spacing: -.032em; margin-top: 7px; font-variant-numeric: tabular-nums; }
.avatar {
  width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center;
  font-size: 11.5px; font-weight: 700; letter-spacing: -.02em; flex: 0 0 auto;
  background: var(--surface-3); color: var(--ink-2); border: 1px solid var(--line);
}
.avatar.is-mgr { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.avatar.sm { width: 22px; height: 22px; font-size: 9.5px; }
.avatar.lg { width: 40px; height: 40px; font-size: 15px; }

/* ---------- body / nav ---------- */
.shell { flex: 1 1 auto; display: flex; min-height: 0; }
.sidebar {
  flex: 0 0 216px; border-right: 1px solid var(--line); background: var(--surface);
  padding: 14px 12px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto;
}
.nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 6px; }
.navitem {
  display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 10px;
  color: var(--ink-2); font-size: 14px; font-weight: 560; text-align: left; width: 100%;
  transition: background .14s, color .14s;
}
.navitem:hover { background: var(--surface-3); color: var(--ink); }
.navitem.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 660; }
.navitem svg { flex: 0 0 auto; }
.navitem .count { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.sidebar-foot { margin-top: auto; padding: 10px 4px 2px; }

.content { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
.page { max-width: 1080px; margin: 0 auto; padding: 26px 26px 90px; }
.bottomnav { display: none; }

/* ---------- typography ---------- */
.page-head { margin-bottom: 20px; }
.page-title { font-size: 25px; font-weight: 700; letter-spacing: -.032em; line-height: 1.15; }
.page-sub { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.sec-title { font-size: 12px; font-weight: 720; letter-spacing: .075em; text-transform: uppercase; color: var(--muted); }
.h3 { font-size: 15.5px; font-weight: 660; letter-spacing: -.018em; }
.mut { color: var(--muted); }
.tiny { font-size: 12px; }
.nowrap { white-space: nowrap; }

/* ---------- cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  backdrop-filter: saturate(120%);
}
.card-head { display: flex; align-items: center; gap: 12px; padding: 15px 17px; border-bottom: 1px solid var(--line); }
.card-body { padding: 17px; }
.card-foot { padding: 13px 17px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; }
.row-b { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wrap { flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 38px; padding: 0 15px; border-radius: 10px; font-size: 13.5px; font-weight: 620;
  letter-spacing: -.005em; border: 1px solid var(--line-2); background: var(--surface);
  color: var(--ink); transition: background .14s, border-color .14s, transform .1s, box-shadow .14s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 1px 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn-primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.btn-danger:hover { background: var(--danger-soft); }
.btn-sm { height: 31px; padding: 0 11px; font-size: 12.5px; border-radius: 8px; gap: 5px; }
.btn-lg { height: 46px; padding: 0 22px; font-size: 15px; border-radius: 12px; }
.btn-block { width: 100%; }
.btn-icon { width: 31px; padding: 0; }

/* ---------- form ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 12.5px; font-weight: 620; color: var(--ink-2); }
.input, .select, .textarea {
  width: 100%; height: 38px; padding: 0 11px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-size: 14px; transition: border-color .14s, box-shadow .14s;
}
.textarea { height: auto; min-height: 70px; padding: 9px 11px; resize: vertical; line-height: 1.45; }
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
}
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.select { appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 15px) 17px, calc(100% - 10px) 17px;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.hint { font-size: 11.5px; color: var(--muted); }

.switch { position: relative; width: 40px; height: 23px; border-radius: 999px; background: var(--line-2); transition: background .18s; flex: 0 0 auto; }
.switch::after { content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 18px; height: 18px; border-radius: 999px; background: #fff; box-shadow: var(--shadow-sm); transition: transform .18s; }
.switch.is-on { background: var(--accent); }
.switch.is-on::after { transform: translateX(17px); }

/* ---------- segmented ---------- */
.segmented { display: flex; gap: 4px; padding: 4px; background: var(--surface-3); border-radius: 13px; border: 1px solid var(--line); }
.segmented button {
  flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; border-radius: 9px; font-size: 14px; font-weight: 620; color: var(--muted);
  letter-spacing: -.01em; transition: background .16s, color .16s, box-shadow .16s;
}
.segmented button:hover { color: var(--ink); }
.segmented button.is-active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.segmented .seg-count { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-3); color: var(--muted); }
.segmented button.is-active .seg-count { background: var(--accent-soft); color: var(--accent); }
/* dark theme reverses the raised/recessed relationship, so flip the fills */
html[data-theme="dark"] .segmented,
html[data-theme="dark"] .pill-toggle { background: #161312; }
html[data-theme="dark"] .segmented button.is-active,
html[data-theme="dark"] .pill-toggle button.is-active { background: var(--surface-3); }
html[data-theme="dark"] .segmented button.is-active .seg-count { background: var(--accent-soft); }

/* ---------- chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px;
  border-radius: 999px; font-size: 11px; font-weight: 660; letter-spacing: .005em;
  background: var(--surface-3); color: var(--muted); border: 1px solid transparent; white-space: nowrap;
}
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.chip-ok     { background: var(--ok-soft); color: var(--ok); }
.chip-warn   { background: var(--warn-soft); color: var(--warn); }
.chip-danger { background: var(--danger-soft); color: var(--danger); }
.chip-info   { background: var(--info-soft); color: var(--info); }
.chip-dot::before { content:""; width: 5px; height: 5px; border-radius: 999px; background: currentColor; }

/* ---------- progress ---------- */
.bar { height: 7px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .5s cubic-bezier(.3,.9,.3,1); }
.bar.is-done > i { background: var(--ok); }
.ring { position: relative; flex: 0 0 auto; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring .track { stroke: var(--surface-3); }
.ring .prog { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.3,.9,.3,1); }
.ring.is-done .prog { stroke: var(--ok); }
.ring .ring-label { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 720; letter-spacing: -.03em; }

/* ---------- task rows ---------- */
.tasklist { display: flex; flex-direction: column; }
.task {
  display: flex; align-items: flex-start; gap: 13px; padding: 13px 16px;
  border-bottom: 1px solid var(--line); transition: background .14s; position: relative;
  cursor: pointer; text-align: left; width: 100%;
}
.task:last-child { border-bottom: 0; }
.task:hover { background: var(--surface-2); }
.task.is-locked { cursor: default; }
.task.is-locked:hover { background: transparent; }
.tick {
  width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line-2);
  flex: 0 0 auto; margin-top: 1px; display: grid; place-items: center; color: transparent;
  transition: background .16s, border-color .16s, color .16s, transform .16s;
}
.task:hover .tick { border-color: var(--accent); }
.task.is-done .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
.task.is-flag .tick { background: var(--surface-3); border-color: var(--line-2); color: var(--muted); }
.task-main { flex: 1 1 auto; min-width: 0; }
.task-title { font-size: 14.5px; font-weight: 560; letter-spacing: -.012em; color: var(--ink); }
.task.is-done .task-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--line-2); }
.task-detail { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.task-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 7px; font-size: 11.5px; color: var(--muted); }
.task-note { margin-top: 7px; padding: 8px 10px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
.task-note b { font-weight: 640; }
.task-side { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.task-meta-action { cursor: pointer; }
.task-meta-action:hover { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.task-critical-mark { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .8; }

/* ---------- sticky action bar ---------- */
.actionbar {
  position: sticky; bottom: 0; margin: 18px -26px -90px; padding: 14px 26px calc(14px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px;
}
.actionbar .ab-text { flex: 1 1 auto; min-width: 0; }

/* ---------- table ---------- */
.tablewrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.tbl th {
  text-align: left; font-size: 10.5px; font-weight: 720; letter-spacing: .075em;
  text-transform: uppercase; color: var(--muted); padding: 10px 14px;
  border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2);
}
table.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl tbody tr:hover { background: var(--surface-2); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- stat tiles ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { padding: 14px 15px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.stat-k { font-size: 11px; font-weight: 680; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat-v { font-size: 25px; font-weight: 720; letter-spacing: -.035em; margin-top: 3px; font-variant-numeric: tabular-nums; }
.stat-s { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

/* ---------- misc ---------- */
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty-icon { width: 44px; height: 44px; border-radius: 13px; background: var(--surface-3); display: grid; place-items: center; margin: 0 auto 12px; color: var(--muted); }
.divider { height: 1px; background: var(--line); }
.kv { display: flex; gap: 8px; font-size: 13px; }
.kv dt { color: var(--muted); min-width: 92px; }
.banner { display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px; border-radius: var(--r-md); font-size: 13px; border: 1px solid; }
.banner-info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 25%, transparent); color: var(--info); }
.banner-warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 25%, transparent); color: var(--warn); }
.banner-ok   { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, transparent); color: var(--ok); }
.banner b { font-weight: 660; }
.drag-h { color: var(--muted); cursor: grab; }
.sortrow { display: flex; flex-direction: column; gap: 1px; }
.pill-toggle { display: inline-flex; padding: 3px; gap: 3px; background: var(--surface-3); border-radius: 10px; border: 1px solid var(--line); }
.pill-toggle button { padding: 5px 11px; border-radius: 7px; font-size: 12.5px; font-weight: 620; color: var(--muted); }
.pill-toggle button.is-active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

/* ---------- modal ---------- */
.modal-root { position: absolute; inset: 0; z-index: 60; display: none; }
.modal-root.is-open { display: block; }
.scrim { position: absolute; inset: 0; background: rgba(20,14,10,.42); backdrop-filter: blur(3px); animation: fade .18s ease; }
.modal {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(560px, calc(100% - 36px)); max-height: calc(100% - 48px);
  background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; overflow: hidden; animation: pop .2s cubic-bezier(.2,.9,.3,1);
  border: 1px solid var(--line);
}
.modal.wide { width: min(720px, calc(100% - 36px)); }
.modal-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
.modal-title { font-size: 17.5px; font-weight: 700; letter-spacing: -.024em; }
.modal-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.modal-body { padding: 18px 20px; overflow-y: auto; flex: 1 1 auto; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 9px; justify-content: flex-end; background: var(--surface-2); flex-wrap: wrap; }
@keyframes fade { from { opacity: 0 } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -46%) scale(.97) } }
@keyframes slideup { from { opacity: 0; transform: translateY(14px) } }

/* review step */
.review-item { padding: 13px 0; border-bottom: 1px solid var(--line); }
.review-item:last-child { border-bottom: 0; }
.reason-opts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
.reason-opts button { padding: 6px 11px; border-radius: 9px; border: 1px solid var(--line-2); font-size: 12.5px; font-weight: 580; color: var(--ink-2); background: var(--surface); transition: all .14s; }
.reason-opts button:hover { border-color: var(--accent); }
.reason-opts button.is-sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 660; }

/* email preview */
.mailpv { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface-2); }
.mailpv-head { padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 12.5px; }
.mailpv-head .kvline { display: flex; gap: 8px; }
.mailpv-head .kvline span:first-child { color: var(--muted); min-width: 52px; }
.mailpv-body { padding: 16px; font-size: 13.5px; line-height: 1.55; background: var(--surface); }
.mailpv-body h4 { font-size: 16px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; }
.mailpv-body ul { margin: 8px 0; }
.mailpv-body li { padding: 4px 0 4px 20px; position: relative; }
.mailpv-body li::before { position: absolute; left: 2px; top: 4px; font-size: 12px; }
.mailpv-body li.done::before { content: "✓"; color: var(--ok); font-weight: 700; }
.mailpv-body li.miss::before { content: "○"; color: var(--danger); font-weight: 700; }
.sms-bubble { max-width: 320px; padding: 11px 14px; border-radius: 18px 18px 18px 5px; background: var(--surface-3); font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; }

/* alerts list */
.alert-item { display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .14s; text-align: left; width: 100%; }
.alert-item:hover { background: var(--surface-2); }
.alert-item.is-unread { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.alert-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: 0 0 auto; }

/* activity feed */
.feed { display: flex; flex-direction: column; }
.feed-item { display: flex; gap: 11px; padding: 9px 0; align-items: flex-start; }
.feed-line { font-size: 13px; }
.feed-time { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* toasts */
.toast-root { position: absolute; left: 0; right: 0; bottom: 0; z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; pointer-events: none; transition: padding-bottom .2s; }
.modal-root.is-open + .toast-root { padding-bottom: 84px; }
.toast {
  display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-radius: 13px;
  background: var(--ink); color: var(--bg); font-size: 13.5px; font-weight: 560;
  box-shadow: var(--shadow-lg); animation: slideup .22s cubic-bezier(.2,.9,.3,1); max-width: 100%;
}
.toast .t-ic { color: var(--accent-hi); display: grid; place-items: center; }
html[data-theme="dark"] .toast { background: var(--surface-3); color: var(--ink); border: 1px solid var(--line-2); }

/* ==========================================================================
   RESPONSIVE — driven by container width, so the mobile toggle and a narrow
   window behave identically.
   ========================================================================== */
@container app (max-width: 860px) {
  .sidebar { display: none; }
  .page { padding: 18px 16px 100px; }
  .page-title { font-size: 22px; }
  .grid-2 { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .topbar { padding: 10px 14px; }
  #user-pick .pick-name { max-width: 78px; }
  .actionbar { margin: 16px -16px -100px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bottomnav {
    display: flex; flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--surface);
    padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
  }
  .bottomnav button {
    flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 5px 2px; border-radius: 11px; color: var(--muted); font-size: 10.5px; font-weight: 620;
    transition: color .14s, background .14s; min-width: 0;
  }
  .bottomnav button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bottomnav button.is-active { color: var(--accent); }
  .bottomnav button.is-active .bn-ic { background: var(--accent-soft); }
  .bn-ic { width: 44px; height: 25px; border-radius: 999px; display: grid; place-items: center; transition: background .16s; }
  .modal { width: calc(100% - 24px); max-height: calc(100% - 32px); border-radius: 20px; }
  .modal-foot { flex-direction: column-reverse; }
  .modal-foot .btn { width: 100%; }
  .card-head { padding: 13px 14px; }
  .card-body { padding: 14px; }
  .hide-sm { display: none !important; }
  .userpick select { max-width: 88px; }
  table.tbl th, table.tbl td { padding: 9px 11px; }
}
@container app (max-width: 520px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .topbar-actions { gap: 0; }
  /* claw back every pixel so the venue name — the thing that tells you which
     site you're looking at — is the one item that never gets truncated */
  #user-pick .pick-name, #user-pick .pick-chev, .pick-sub, .topbar-spacer { display: none; }
  #user-pick { padding: 3px; }
  .iconbtn { width: 32px; height: 32px; }
  #venue-pick { flex: 1 1 auto; min-width: 0; }
  #venue-pick .pick-name { max-width: none; }
  #organisation-pick .pick-name { max-width: 105px; }
  .topbar { gap: 4px; padding: 10px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

// Keep these rules in lockstep with supabase/functions/_shared/username.ts.
const USERNAME_AUTH_DOMAIN = 'dailyops.invalid';
const USERNAME_MIN_LENGTH = 3;
const USERNAME_MAX_LENGTH = 32;
const USERNAME_PATTERN = /^[a-z0-9._-]+$/;
const CONSECUTIVE_SEPARATOR_PATTERN = /[._-]{2}/;

function normalizeUsername(value) {
  if (typeof value !== 'string') throw new Error('Username must be text.');
  const username = value.trim().toLowerCase();
  const valid = username.length >= USERNAME_MIN_LENGTH
    && username.length <= USERNAME_MAX_LENGTH
    && USERNAME_PATTERN.test(username)
    && /^[a-z0-9]/.test(username)
    && /[a-z0-9]$/.test(username)
    && !CONSECUTIVE_SEPARATOR_PATTERN.test(username);
  if (!valid) {
    throw new Error('Username must be 3–32 characters, start and end with a letter or number, and use only letters, numbers, dots, underscores or hyphens.');
  }
  return username;
}

function usernameToAuthEmail(identifier) {
  const value = String(identifier == null ? '' : identifier).trim();
  if (!value) throw new Error('Enter your username.');
  if (value.includes('@')) return value;
  return `${normalizeUsername(value)}@${USERNAME_AUTH_DOMAIN}`;
}

function profileLoginLabel(email) {
  const value = String(email || '');
  const suffix = `@${USERNAME_AUTH_DOMAIN}`;
  return value.toLowerCase().endsWith(suffix)
    ? value.slice(0, -suffix.length)
    : value;
}

    st.days[id] = {};
  });

  const mgr = { id: uid('u'), name: 'Abhishek Bhardwaj', role: 'manager',

  st.users.push(mgr);
  SEED_STAFF.forEach(([name, email, phone, vix, active]) => {

                    venues: vix.map(i => st.venues[i].id) });
  });
  st.session.userId = mgr.id;
  st.session.venueId = st.venues[0].id;

  st.venues.forEach((v, vi) => {
    const crewPool = st.users.filter(u => u.role === 'employee' && u.active && u.venues.includes(v.id));
    const pick = n => crewPool.slice().sort(() => Math.random() - .5).slice(0, Math.min(n, crewPool.length)).map(u => u.id);

    // six days of history so the manager views open onto something real
    for (let i = 6; i >= 1; i--) {
      const key = dayKey(addDays(new Date(), -i));
      const day = makeDay(key, { open: pick(2), close: pick(3) }, v.id);
      ['open','close'].forEach(lk => {
        const L = day.lists[lk], crew = day.roster[lk], base = parseKey(key);
        L.tasks.forEach((t, idx) => {
          const miss = Math.random() < (lk === 'close' ? 0.11 : 0.07);
          if (miss && !t.critical) {
            const rs = ['skipped','na','blocked'][Math.floor(Math.random()*3)];
            t.status = rs;
            t.reason = rs === 'blocked' ? 'Supplier delivery never turned up.'
                     : rs === 'na' ? 'Not needed on a quiet Tuesday.'
                     : 'Slammed until close, ran out of time.';
          } else {
            const at = new Date(base);
            at.setHours(lk === 'open' ? 9 : 22, 6 + idx * 4 + Math.floor(Math.random()*5), 0, 0);
            t.status = 'done'; t.doneBy = crew[Math.floor(Math.random()*crew.length)]; t.doneAt = at.toISOString();
          }
        });
        const sub = new Date(base); sub.setHours(lk === 'open' ? 11 : 23, lk === 'open' ? 15 : 41, 0, 0);
        L.submitted = true; L.submittedBy = crew[crew.length - 1];
        L.submittedAt = sub.toISOString(); L.completeNotified = true;
      });
      day.reported = true;
      day.reportedAt = day.lists.close.submittedAt;
      st.days[v.id][key] = day;
    }

    // today, mid-service: open list part-way, close list untouched
    const tk = dayKey();
    const tday = makeDay(tk, { open: pick(2), close: pick(3) }, v.id);
    const crew = tday.roster.open;
    tday.lists.open.tasks.forEach((t, i) => {
      if (i < VENUE_SEED[vi].todayDone && crew.length) {
        const at = new Date(); at.setHours(9, 10 + i * 5, 0, 0);
        t.status = 'done'; t.doneBy = crew[i % crew.length]; t.doneAt = at.toISOString();
      }
    });
    st.days[v.id][tk] = tday;
  });
  return st;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { S = JSON.parse(raw); if (S && S.version === 2 && S.venues && S.venues.length) { repair(); return; } }
  } catch (e) { console.warn('[store] could not read saved state, reseeding', e); }
  S = defaultState();
  save();
}
/* guards against a half-written state (venue deleted, user added by hand, etc.) */
function repair() {
  S.venues.forEach(v => { S.templates[v.id] = S.templates[v.id] || { open: [], close: [] }; S.days[v.id] = S.days[v.id] || {}; });
  S.users.forEach(u => {
    if (!Array.isArray(u.venues)) u.venues = S.venues.map(v => v.id);
    if (u.role === 'manager') u.venues = S.venues.map(v => v.id);
    u.venues = u.venues.filter(id => S.venues.some(v => v.id === id));
  });
  if (!S.venues.some(v => v.id === S.session.venueId)) S.session.venueId = (S.venues[0] || {}).id;
}
function save() {
  try {
    let snapshot = S;
    if (isSupabaseMode() && AUTH.ephemeralDemoVenueIds.length) {
      snapshot = JSON.parse(JSON.stringify(S));
      const ephemeral = new Set(AUTH.ephemeralDemoVenueIds);
      snapshot.venues = snapshot.venues.filter(v => !ephemeral.has(v.id));
      snapshot.users.forEach(u => { u.venues = u.venues.filter(id => !ephemeral.has(id)); });
      AUTH.ephemeralDemoVenueIds.forEach(id => {
        delete snapshot.templates[id];
        delete snapshot.days[id];
      });
      if (ephemeral.has(snapshot.session.venueId)) snapshot.session.venueId = snapshot.venues[0]?.id || null;
    }
    localStorage.setItem(STORE_KEY, JSON.stringify(snapshot));
  } catch (e) { console.warn('[store] save failed', e); }
}

function readStorageJson(key, fallback) {
  try {

}

}

function loadSupabaseVenueContexts(rows) {
  const mapKey = `dailyops.supabase.venue-map.${AUTH.profile.id}`;
  const selectionKey = `dailyops.supabase.venue-selection.${AUTH.profile.id}`;
  const savedMap = readStorageJson(mapKey, {});
  const localVenues = new Map(S.venues.map(v => [v.id, v]));
  const usedLocalIds = new Set();
  const assignments = {};

  rows.forEach(row => {
    const localId = savedMap[row.id];
    if (localId && localVenues.has(localId) && !usedLocalIds.has(localId)) {
      assignments[row.id] = localId;
      usedLocalIds.add(localId);
    }
  });

  rows.forEach((row, index) => {
    if (assignments[row.id]) return;
    const available = S.venues.find(v => !usedLocalIds.has(v.id) && !AUTH.ephemeralDemoVenueIds.includes(v.id));
    const localVenue = available || createLocalDemoVenue(index);
    assignments[row.id] = localVenue.id;
    usedLocalIds.add(localVenue.id);
  });

  const roleByOrganisation = Object.fromEntries(
    AUTH.organisationMemberships.map(m => [m.organisation_id, m.role])
  );
  AUTH.venueContexts = rows.map(row => {
    const localId = assignments[row.id];
    return {
      id: localId,
      realId: row.id,
      organisationId: row.organisation_id,
      organisationRole: roleByOrganisation[row.organisation_id],
      name: row.name,
      sub: row.subtitle || '',
      accent: row.accent_key || 'indigo',
      cutoff: String(row.cutoff_time || '23:30').slice(0, 5),
      managerEmail: row.manager_email || '',
      managerPhone: row.manager_phone || '',
      timezone: row.timezone || 'Australia/Sydney',
      notifyComplete: row.notify_complete,
      notifyEndOfDay: row.notify_end_of_day,
      channelEmail: row.email_enabled,
      channelSms: row.sms_enabled
    };
  });
  writeStorageJson(mapKey, assignments);

  const organisationIds = accessibleOrganisationIds();
  const venueOrganisationIds = new Set(AUTH.venueContexts.map(context => context.organisationId));
  const organisationSelectionKey = `dailyops.supabase.organisation-selection.${AUTH.profile.id}`;
  const savedOrganisation = (() => {
    try { return localStorage.getItem(organisationSelectionKey); } catch (error) { return null; }
  })();
  const savedOrganisationId = savedOrganisation && savedOrganisation !== 'all' ? savedOrganisation : null;
  AUTH.selectedOrganisationId = savedOrganisationId
    && organisationIds.includes(savedOrganisationId)
    && venueOrganisationIds.has(savedOrganisationId)
    ? savedOrganisationId
    : organisationIds.length > 1 ? null : ([...venueOrganisationIds][0] || null);
  try {
    localStorage.setItem(organisationSelectionKey, AUTH.selectedOrganisationId || 'all');
  } catch (error) { console.warn('[store] could not save organisation selection', error); }

  const orgVisibleContexts = AUTH.venueContexts.filter(context =>
    !AUTH.selectedOrganisationId || context.organisationId === AUTH.selectedOrganisationId
  );
  const savedSelection = (() => {
    try {
      return localStorage.getItem(`dailyops.supabase.venue-selection.${AUTH.profile.id}.${AUTH.selectedOrganisationId || 'all'}`)
        || localStorage.getItem(selectionKey);
    } catch (error) { return null; }
  })();
  AUTH.selectedVenueId = orgVisibleContexts.some(v => v.realId === savedSelection)
    ? savedSelection
    : (orgVisibleContexts[0] && orgVisibleContexts[0].realId) || null;
  try {
    if (AUTH.selectedVenueId) {
      localStorage.setItem(selectionKey, AUTH.selectedVenueId);
      localStorage.setItem(`dailyops.supabase.venue-selection.${AUTH.profile.id}.${AUTH.selectedOrganisationId || 'all'}`, AUTH.selectedVenueId);
    }
  } catch (error) { console.warn('[store] could not save venue selection', error); }
}

async function loadAuthenticatedProfile(session) {
  const { data, error } = await DB.from('profiles')
    .select('id,display_name,email,phone,active,platform_role')
    .eq('id', session.user.id)
    .maybeSingle();
  if (error) throw error;
  if (!data) throw new Error('Your account is signed in, but no DailyOps profile exists for it. Contact an administrator.');
  AUTH.profile = {
    id: data.id,
    display_name: data.display_name,
    email: data.email || session.user.email || '',
    phone: data.phone || '',
    active: !!data.active,
    platform_role: data.platform_role
  };
  if (!data.active) {
    const inactiveError = new Error('Your DailyOps account is inactive. Contact an administrator.');
    inactiveError.accessCode = 'inactive';
    throw inactiveError;
  }
}

async function loadOrganisationAccess(session) {
  const platformAdmin = AUTH.profile.platform_role === 'admin';
  let membershipRows;
  let organisationRows;

  if (platformAdmin) {
    const organisationResult = await DB.from('organisations').select('id,name').order('name');
    if (organisationResult.error) {
      console.error('[supabase] platform admin organisation load failed', {
        organisationError: organisationResult.error
      });
      throw accessError('organisation-load', 'We could not load the organisations available to your platform admin account.');
    }
    organisationRows = organisationResult.data || [];
    membershipRows = organisationRows.map(organisation => ({
      organisation_id: organisation.id,
      user_id: session.user.id,
      role: 'manager'
    }));
  } else {
    const membershipResult = await DB.from('organisation_members')
      .select('organisation_id,user_id,role')
      .eq('user_id', session.user.id);
    membershipRows = membershipResult.data;
    if (membershipResult.error) {
      console.error('[supabase] organisation membership load failed', membershipResult.error);
      throw accessError('organisation-load', 'We could not load your DailyOps organisation access.');
    }
    if (!membershipRows || !membershipRows.length) {
      throw accessError('no-membership', 'Your account is signed in, but it is not assigned to a DailyOps organisation yet. Contact an administrator.');
    }

    const organisationIds = [...new Set(membershipRows.map(row => row.organisation_id))];
    const organisationResult = await DB.from('organisations')
      .select('id,name')
      .in('id', organisationIds);
    organisationRows = organisationResult.data;
    if (organisationResult.error || (organisationRows || []).length !== organisationIds.length) {
      console.error('[supabase] organisation load failed', organisationResult.error || { organisationIds });
      throw accessError('organisation-load', 'We could not load the organisations attached to your account.');
    }
  }

  if (!organisationRows || !organisationRows.length) {
    throw accessError('no-membership', 'Your account is signed in, but no DailyOps organisations exist yet. Contact an administrator.');
  }

  const organisationIds = [...new Set(organisationRows.map(row => row.id))];

  const organisationById = Object.fromEntries(organisationRows.map(row => [row.id, row]));
  AUTH.organisations = organisationRows;
  AUTH.organisationMemberships = membershipRows.map(row => ({
    ...row,
    organisation: organisationById[row.organisation_id]
  }));

  const { data: venueRows, error: venueError } = await DB.from('venues')
    .select('id,organisation_id,name,subtitle,accent_key,cutoff_time,timezone,manager_email,manager_phone,notify_complete,notify_end_of_day,email_enabled,sms_enabled')
    .in('organisation_id', organisationIds)
    .order('name');
  if (venueError) {
    console.error('[supabase] venue load failed', venueError);
    throw accessError('venue-load', 'We could not load the venues available to your account.');
  }
  if (!venueRows || !venueRows.length) {
    throw accessError('no-venues', 'Your organisation access is loaded, but you do not have access to any venues yet. Contact an administrator.');
  }
  loadSupabaseVenueContexts(venueRows);
}

function preserveSupabaseSelection(previousSelection) {
  if (!previousSelection) return;
  const contexts = AUTH.venueContexts;
  const previousOrganisationId = previousSelection.organisationId;
  const previousVenueId = previousSelection.venueId;
  const previousOrganisationStillLegal = previousOrganisationId === null
    ? contexts.length > 0
    : accessibleOrganisationIds().includes(previousOrganisationId)
      && contexts.some(context => context.organisationId === previousOrganisationId);
  if (!previousOrganisationStillLegal) return;

  AUTH.selectedOrganisationId = previousOrganisationId;
  const legalContexts = contexts.filter(context =>
    !AUTH.selectedOrganisationId || context.organisationId === AUTH.selectedOrganisationId
  );
  if (legalContexts.some(context => context.realId === previousVenueId)) {
    AUTH.selectedVenueId = previousVenueId;
  } else {
    AUTH.selectedVenueId = legalContexts[0]?.realId || null;
  }
  if (AUTH.selectedVenueId) selectVenue(AUTH.selectedVenueId);
  try {
    localStorage.setItem(
      `dailyops.supabase.organisation-selection.${AUTH.profile.id}`,
      AUTH.selectedOrganisationId || 'all'
    );
  } catch (error) {
    console.warn('[store] could not save refreshed organisation selection', error);
  }
}

function failClosedSupabaseAccessView(message) {
  SUPABASE_ACCESS.verified = false;
  SUPABASE_ACCESS.previousSelection = {
    organisationId: AUTH.selectedOrganisationId,
    venueId: AUTH.selectedVenueId
  };
  clearSupabaseAccessRuntime(true);
  R.tab = 'today';
  unsubscribeSupabaseRealtime();
  showAccessError(message);
}

async function detachSupabaseAccessChannel() {
  const previous = SUPABASE_ACCESS.channel;
  if (SUPABASE_ACCESS.refreshTimer !== null) clearTimeout(SUPABASE_ACCESS.refreshTimer);
  if (SUPABASE_ACCESS.pollTimer !== null) clearInterval(SUPABASE_ACCESS.pollTimer);
  SUPABASE_ACCESS.refreshTimer = null;
  SUPABASE_ACCESS.pollTimer = null;
  SUPABASE_ACCESS.channel = null;
  if (previous && DB) {
    try { await DB.removeChannel(previous); }
    catch (error) { console.warn('[supabase] access channel cleanup failed', error); }
  }
}

async function stopSupabaseAccessRevalidation() {
  SUPABASE_ACCESS.requestId++;
  await detachSupabaseAccessChannel();
  SUPABASE_ACCESS = blankSupabaseAccessState();
}

function queueSupabaseAccessRefresh(reason, failClosed = false) {
  if (!isSupabaseMode() || !AUTH.session || !AUTH.profile) return;
  if (failClosed && SUPABASE_ACCESS.verified) {
    failClosedSupabaseAccessView('DailyOps is rechecking your access. Your operational data will return when access is verified.');
  }
  if (SUPABASE_ACCESS.refreshing) {
    SUPABASE_ACCESS.refreshPending = true;
    return;
  }
  if (SUPABASE_ACCESS.refreshTimer !== null) return;
  SUPABASE_ACCESS.refreshTimer = setTimeout(() => {
    SUPABASE_ACCESS.refreshTimer = null;
    refreshSupabaseAccess(reason);
  }, 120);
}

async function refreshSupabaseAccess(reason) {
  if (!isSupabaseMode() || !DB || !AUTH.session || !AUTH.profile) return;
  if (SUPABASE_ACCESS.refreshing) {
    SUPABASE_ACCESS.refreshPending = true;
    return;
  }
  SUPABASE_ACCESS.refreshing = true;
  const previousSnapshot = supabaseAccessSnapshot();
  const previousSelection = SUPABASE_ACCESS.previousSelection || {
    organisationId: AUTH.selectedOrganisationId,
    venueId: AUTH.selectedVenueId
  };
  const wasUnverified = !SUPABASE_ACCESS.verified;
  SUPABASE_ACCESS.previousSelection = null;
  try {
    await loadAuthenticatedProfile(AUTH.session);
    if (!AUTH.profile.active) {
      failClosedSupabaseAccessView('Your DailyOps account is inactive.');
      await DB.auth.signOut();
      return;
    }
    await loadOrganisationAccess(AUTH.session);
    preserveSupabaseSelection(previousSelection);
    const changed = previousSnapshot !== supabaseAccessSnapshot();
    const needsRebuild = changed || wasUnverified || !S || !AUTH.venueContexts.length;
    SUPABASE_ACCESS.verified = true;
    if (!needsRebuild) return;

    load();
    await loadSupabaseTeam();
    await loadSupabaseTemplates();
    await loadSupabaseToday();
    clearSupabaseManagerState();
    showApp();
    render();
    syncSupabaseRealtimeForCurrentView();
    if (isMgr()) {
      loadSupabaseCoverRequests();
      loadSupabaseNotifications();
      loadSupabaseNotificationRecipients();
      if (R.tab === 'history') loadSupabaseHistory(true);
    } else {
      loadSupabaseMyRosterWeek(rosterWeekStartKey(dayKey()), true);
    }
    console.info('[supabase] access revalidated', { reason, changed });
  } catch (error) {
    console.error('[supabase] access revalidation failed', { reason, error });
    if (error.accessCode === 'inactive' || (AUTH.profile && !AUTH.profile.active)) {
      failClosedSupabaseAccessView('Your DailyOps account is inactive.');
      await DB.auth.signOut();
    } else {
      failClosedSupabaseAccessView('DailyOps could not verify your organisation access. Please try again or sign out.');
    }
  } finally {
    SUPABASE_ACCESS.refreshing = false;
    if (SUPABASE_ACCESS.refreshPending && AUTH.session) {
      SUPABASE_ACCESS.refreshPending = false;
      queueSupabaseAccessRefresh('pending-access-refresh');
    }
  }
}

async function startSupabaseAccessRevalidation() {
  if (!isSupabaseMode() || !DB || !AUTH.session || !AUTH.profile) return;
  const userId = AUTH.profile.id;
  if (SUPABASE_ACCESS.channel && SUPABASE_ACCESS.userId === userId) return;
  const requestId = ++SUPABASE_ACCESS.requestId;
  await detachSupabaseAccessChannel();
  if (requestId !== SUPABASE_ACCESS.requestId || !AUTH.session) return;

  const channel = DB.channel(`dailyops-access-${userId}`)
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'profiles', filter: `id=eq.${userId}`
    }, () => queueSupabaseAccessRefresh('profile-realtime', true))
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'organisation_members', filter: `user_id=eq.${userId}`
    }, () => queueSupabaseAccessRefresh('organisation-membership-realtime', true))
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'venue_members', filter: `user_id=eq.${userId}`
    }, () => queueSupabaseAccessRefresh('venue-membership-realtime', true));

  SUPABASE_ACCESS = {
    ...blankSupabaseAccessState(),
    channel,
    userId,
    status: 'CONNECTING',
    requestId
  };
  SUPABASE_ACCESS.pollTimer = setInterval(() => {
    if (SUPABASE_ACCESS.channel === channel && AUTH.session) {
      queueSupabaseAccessRefresh('periodic-access-refresh');
    }
  }, SUPABASE_ACCESS_REFRESH_MS);
  channel.subscribe(status => {
    if (SUPABASE_ACCESS.channel !== channel) return;
    SUPABASE_ACCESS.status = status;
    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
      console.warn('[supabase] access realtime unavailable; periodic access refresh remains active', { status });
    }
  });
}

function isSupabaseAccessDenied(error) {
  const status = error?.status || error?.context?.status;
  const code = error?.code;
  const message = String(error?.message || '').toLowerCase();
  return status === 401 || status === 403 || code === '42501'
    || message.includes('row-level security')
    || message.includes('permission denied')
    || message.includes('jwt');
}

function refreshSupabaseAccessAfterDeniedOperation(error, operation) {
  if (!isSupabaseAccessDenied(error)) return;
  console.warn('[supabase] manager operation was denied; revalidating access', { operation });
  queueSupabaseAccessRefresh(`denied-${operation}`, true);
}

function currentSupabaseOrganisationId() {
  return (currentVenueContext() && currentVenueContext().organisationId)
    || (AUTH.organisationMemberships[0] && AUTH.organisationMemberships[0].organisation_id)
    || null;
}

function currentSupabaseOrganisationIds() {
  const managedIds = managedOrganisationIds();
  return AUTH.selectedOrganisationId
    ? managedIds.filter(id => id === AUTH.selectedOrganisationId)
    : managedIds;
}

function currentSupabaseRosterScopeKey() {
  return currentSupabaseOrganisationIds().slice().sort().join(',') || 'none';
}

function supabaseMembersForOrganisation(organisationId) {
  return SUPABASE_TEAM.members.filter(member => member.organisationId === organisationId);
}

function supabaseMembersForCurrentScope() {
  const organisationIds = new Set(currentSupabaseOrganisationIds());
  return SUPABASE_TEAM.members.filter(member => organisationIds.has(member.organisationId));
}

function aggregateSupabaseTeamMembers(members) {
  const grouped = new Map();
  members.forEach(member => {
    let combined = grouped.get(member.id);
    if (!combined) {
      combined = {
        ...member,
        memberships: [],
        organisationIds: [],
        organisationNames: [],
        explicitVenueIds: [],
        venueIds: []
      };
      grouped.set(member.id, combined);
    }
    combined.memberships.push(member);
    if (!combined.organisationIds.includes(member.organisationId)) {
      combined.organisationIds.push(member.organisationId);
      combined.organisationNames.push(organisationName(member.organisationId));
    }
    combined.explicitVenueIds = [...new Set([...combined.explicitVenueIds, ...member.explicitVenueIds])];
    combined.venueIds = [...new Set([...combined.venueIds, ...member.venueIds])];
    combined.role = combined.memberships.some(row => row.role === 'employee') ? 'employee' : 'manager';
  });
  return [...grouped.values()];
}

function platformAdminDirectoryMembers() {
  const grouped = aggregateSupabaseTeamMembers(SUPABASE_TEAM.members);
  const byId = new Map(grouped.map(member => [member.id, member]));
  Object.values(SUPABASE_TEAM.profilesById).forEach(profile => {
    if (byId.has(profile.id)) return;
    byId.set(profile.id, {
      id: profile.id,
      organisationId: null,
      role: null,
      displayName: profile.display_name || profileLoginLabel(profile.email) || 'DailyOps user',
      email: profile.email || '',
      phone: profile.phone || '',
      active: !!profile.active,
      platformRole: profile.platform_role || 'user',
      protected: isProtectedProfile(profile.id),
      explicitVenueIds: [],
      venueIds: [],
      memberships: [],
      organisationIds: [],
      organisationNames: []
    });
  });
  return [...byId.values()].sort((a, b) => a.displayName.localeCompare(b.displayName));
}

function isProtectedProfile(userId) {
  return (SUPABASE_TEAM.protectedProfileIds || []).includes(userId);
}

function supabaseDirectoryMemberForUser(userId) {
  return platformAdminDirectoryMembers().find(member => member.id === userId) || null;
}

function canRosterSupabaseMemberAtVenue(member, context) {
  const membership = (member.memberships || [member]).find(row =>
    row.organisationId === context.organisationId && row.role === 'employee'
  );
  return !!membership && membership.active && membership.venueIds.includes(context.realId);
}

function supabaseMemberForUser(userId, organisationId) {
  const orgId = organisationId || currentSupabaseOrganisationId();
  return SUPABASE_TEAM.members.find(member =>
    member.id === userId && (!orgId || member.organisationId === orgId)
  ) || null;
}

function localVenueIdsForMember(member) {
  if (!member) return [];
  return venueCatalog()
    .filter(context => member.venueIds.includes(context.realId))
    .map(context => context.id);
}

function localUserFromSupabaseMember(member) {
  if (!member) return null;
  return {
    id: member.id,
    name: member.displayName || profileLoginLabel(member.email) || 'DailyOps user',
    role: member.role,
    email: member.email || '',
    phone: member.phone || '',
    active: !!member.active,
    venues: localVenueIdsForMember(member)
  };
}

async function loadSupabaseTeam() {
  const platformAdmin = isPlatformAdmin();
  const organisationIds = [...new Set(AUTH.organisationMemberships.map(row => row.organisation_id))];
  const memberQuery = DB.from('organisation_members').select('organisation_id,user_id,role');
  const memberResult = platformAdmin
    ? await memberQuery
    : await memberQuery.in('organisation_id', organisationIds);
  if (memberResult.error) {
    console.error('[supabase] team membership load failed', { organisationIds, error: memberResult.error });
    throw accessError('team-load', 'We could not load your organisation team.');
  }

  const memberRows = memberResult.data || [];
  const memberIds = [...new Set(memberRows.map(row => row.user_id))];
  const profileResult = platformAdmin
    ? await DB.from('profiles').select('id,display_name,email,phone,active,platform_role').order('display_name')
    : memberIds.length
      ? await DB.from('profiles').select('id,display_name,email,phone,active,platform_role').in('id', memberIds)
      : { data: [], error: null };
  if (profileResult.error) {
    console.error('[supabase] team profile load failed', { memberIds, error: profileResult.error });
    throw accessError('team-load', 'We could not load the profiles for your organisation team.');
  }
  const protectedProfileIds = [];
  if ((profileResult.data || []).length) {
    const protectedResults = await Promise.all((profileResult.data || []).map(profile =>
      DB.rpc('is_protected_master_admin', { p_user_id: profile.id })
    ));
    protectedResults.forEach((result, index) => {
      if (result.error) {
        console.warn('[supabase] protected profile flag unavailable', { profileId: profileResult.data[index].id, error: result.error });
      } else if (result.data === true) {
        protectedProfileIds.push(profileResult.data[index].id);
      }
    });
  }
  const missingProfiles = memberIds.filter(userId => !(profileResult.data || []).some(profile => profile.id === userId));
  if (missingProfiles.length) {
    console.error('[supabase] organisation members without profiles', { missingProfiles });
    throw accessError('team-load', 'One or more organisation members do not have a DailyOps profile yet. Contact an administrator.');
  }

  const accessibleVenueIds = AUTH.venueContexts.map(context => context.realId);
  const venueMemberResult = accessibleVenueIds.length
    ? await DB.from('venue_members').select('venue_id,user_id').in('venue_id', accessibleVenueIds)
    : { data: [], error: null };
  if (venueMemberResult.error) {
    console.error('[supabase] venue membership load failed', { accessibleVenueIds, error: venueMemberResult.error });
    throw accessError('team-load', 'We could not load venue memberships for your organisation team.');
  }

  const profilesById = Object.fromEntries((profileResult.data || []).map(profile => [profile.id, profile]));
  const venueIdsByUser = {};
  (venueMemberResult.data || []).forEach(row => {
    venueIdsByUser[row.user_id] = venueIdsByUser[row.user_id] || [];
    venueIdsByUser[row.user_id].push(row.venue_id);
  });

  const members = memberRows.map(row => {
    const profile = profilesById[row.user_id];
    if (!profile) return null;
    const organisationVenueIds = AUTH.venueContexts
      .filter(context => context.organisationId === row.organisation_id)
      .map(context => context.realId);
    const explicitVenueIds = [...new Set(venueIdsByUser[row.user_id] || [])]
      .filter(venueId => organisationVenueIds.includes(venueId));
    return {
      id: row.user_id,
      organisationId: row.organisation_id,
      role: row.role,
      displayName: profile.display_name || profileLoginLabel(profile.email) || 'DailyOps user',
      email: profile.email || '',
      phone: profile.phone || '',
      active: !!profile.active,
      platformRole: profile.platform_role || 'user',
      protected: protectedProfileIds.includes(row.user_id),
      explicitVenueIds,
      // Managers inherit access to every venue in their organisation under the
      // deployed RLS model. Employees use explicit venue_members rows.
      venueIds: row.role === 'manager' ? organisationVenueIds : explicitVenueIds
    };
  }).filter(Boolean);

  SUPABASE_TEAM = { members, profilesById, venueIdsByUser, isGlobalDirectory: platformAdmin, protectedProfileIds };
}

/* ---------------------------------------------------------------- templates */
/* Supabase is the source of truth in normal mode. The local template data is
   used only once, to initialise a venue that has no remote template rows yet. */
async function bootstrapMissingSupabaseTemplates(contexts, existingHeaders) {
  const existing = new Set(existingHeaders.map(row => `${row.venue_id}:${row.list_type}`));
  for (const context of contexts) {
    if (context.organisationRole !== 'manager') continue;
    for (const listType of ['open', 'close']) {
      const key = `${context.realId}:${listType}`;
      if (existing.has(key)) continue;

      const templateId = crypto.randomUUID();
      const { error: templateError } = await DB.from('checklist_templates').insert({
        id: templateId,
        venue_id: context.realId,
        list_type: listType,
        name: LIST_META[listType].full,
        active: true
      });
      if (templateError) {
        if (templateError.code === '23505') continue;
        console.error('[supabase] template bootstrap failed', { venueId: context.realId, listType, error: templateError });
        throw accessError('template-bootstrap', `We could not initialise the ${LIST_META[listType].full} template for ${context.name}.`);
      }

      const localTasks = (S.templates[context.id] && S.templates[context.id][listType]) || [];
      if (!localTasks.length) continue;
      const taskRows = localTasks.map((task, index) => ({
        id: crypto.randomUUID(),
        template_id: templateId,
        sort_order: index,
        title: task.title,
        detail: task.detail || null,
        critical: !!task.critical
      }));
      const { error: taskError } = await DB.from('template_tasks').insert(taskRows);
      if (taskError) {
        console.error('[supabase] template task bootstrap failed', { venueId: context.realId, listType, error: taskError });
        throw accessError('template-bootstrap', `We could not initialise the ${LIST_META[listType].full} routine tasks for ${context.name}.`);
      }
    }
  }
}

async function loadSupabaseTemplates() {
  const contexts = venueCatalog();
  const venueIds = contexts.map(context => context.realId);
  const headerResult = await DB.from('checklist_templates')
    .select('id,venue_id,list_type,name,active')
    .in('venue_id', venueIds);
  if (headerResult.error) {
    console.error('[supabase] template load failed', { venueIds, error: headerResult.error });
    throw accessError('template-load', 'We could not load the recurring shift templates.');
  }

  let headers = headerResult.data || [];
  const managerContexts = contexts.filter(context => context.organisationRole === 'manager');
  const missingManagerTemplates = managerContexts.some(context =>
    ['open', 'close'].some(listType => !headers.some(row => row.venue_id === context.realId && row.list_type === listType))
  );
  if (missingManagerTemplates) {
    await bootstrapMissingSupabaseTemplates(contexts, headers);
    const refreshedHeaders = await DB.from('checklist_templates')
      .select('id,venue_id,list_type,name,active')
      .in('venue_id', venueIds);
    if (refreshedHeaders.error) {
      console.error('[supabase] template reload failed', { venueIds, error: refreshedHeaders.error });
      throw accessError('template-load', 'We could not reload the recurring shift templates.');
    }
    headers = refreshedHeaders.data || [];
  }

  const templateIds = headers.map(row => row.id);
  let taskRows = [];
  if (templateIds.length) {
    const taskResult = await DB.from('template_tasks')
      .select('id,template_id,sort_order,title,detail,critical')
      .in('template_id', templateIds)
      .order('sort_order')
      .order('id');
    if (taskResult.error) {
      console.error('[supabase] template task load failed', { templateIds, error: taskResult.error });
      throw accessError('template-load', 'We could not load the routine tasks in the recurring templates.');
    }
    taskRows = taskResult.data || [];
  }

  const headerById = Object.fromEntries(headers.map(row => [row.id, row]));
  const byVenue = Object.fromEntries(contexts.map(context => [context.realId, {
    open: [],
    close: [],
    templateIds: { open: null, close: null }
  }]));
  headers.forEach(row => {
    if (!byVenue[row.venue_id] || !byVenue[row.venue_id][row.list_type]) return;
    byVenue[row.venue_id].templateIds[row.list_type] = row.id;
  });
  taskRows.forEach(row => {
    const header = headerById[row.template_id];
    if (!header || !byVenue[header.venue_id] || !byVenue[header.venue_id][header.list_type]) return;
    byVenue[header.venue_id][header.list_type].push({
      id: row.id,
      templateId: row.template_id,
      sortOrder: row.sort_order,
      title: row.title,
      detail: row.detail || '',
      critical: !!row.critical
    });
  });
  Object.values(byVenue).forEach(bucket => {
    ['open', 'close'].forEach(listType => bucket[listType].sort((a, b) =>
      a.sortOrder - b.sortOrder || a.id.localeCompare(b.id)
    ));
  });
  SUPABASE_TEMPLATES = { byVenue };
}

function venueCatalog() {
  if (!isSupabaseMode()) return S.venues;

function managedOrganisationIds() {

  const managedIds = new Set(currentSupabaseOrganisationIds());

function accessibleOrganisationIds() {
  if (!isSupabaseMode()) return [];

function accessibleOrganisations() {

  if (!isSupabaseMode()) return null;

  return AUTH.organisationMemberships.find(membership => membership.organisation_id === organisationId)?.role || null;

function organisationName(organisationId) {

function venueDisplayLabel(context) {

function selectedVenueKey() {

function currentVenueContext() {
  const key = selectedVenueKey();
  return venueCatalog().find(v => isSupabaseMode() ? v.realId === key : v.id === key) || null;

function selectVenue(id) {
  const selected = venueCatalog().find(v => v.id === id || (isSupabaseMode() && v.realId === id));
  if (!selected) return false;

async function selectOrganisation(id) {
  if (!isSupabaseMode()) return;
  const accessibleIds = new Set(accessibleOrganisationIds());
  const nextOrganisationId = id || null;
  if (nextOrganisationId && !accessibleIds.has(nextOrganisationId)) return;

  const availableContexts = AUTH.venueContexts.slice();
  const targetContexts = nextOrganisationId
    ? availableContexts.filter(context => context.organisationId === nextOrganisationId)
    : availableContexts;
  if (!targetContexts.length) {
    toast(`${organisationName(nextOrganisationId)} has no accessible venues yet.`, 'warn');
    return;
  }

  const lockKey = 'organisation-switch';
  if (REMOTE_MUTATIONS.has(lockKey)) return;
  REMOTE_MUTATIONS.add(lockKey);
  const previousOrganisationId = AUTH.selectedOrganisationId;
  const previousVenueId = AUTH.selectedVenueId;
  AUTH.selectedOrganisationId = nextOrganisationId;
  const currentStillVisible = targetContexts.some(context => context.realId === previousVenueId);
  const savedVenueId = (() => {
    try {
      return localStorage.getItem(`dailyops.supabase.venue-selection.${AUTH.profile.id}.${nextOrganisationId || 'all'}`);
    } catch (error) { return null; }
  })();
  AUTH.selectedVenueId = currentStillVisible
    ? previousVenueId
    : targetContexts.some(context => context.realId === savedVenueId)
      ? savedVenueId
      : targetContexts[0].realId;

  try {
    localStorage.setItem(`dailyops.supabase.organisation-selection.${AUTH.profile.id}`, nextOrganisationId || 'all');
    selectVenue(AUTH.selectedVenueId);
    await loadSupabaseTeam();
    await loadSupabaseTemplates();
    await loadSupabaseToday();
    SUPABASE_ROSTER_WEEK = { organisationId: null, start: null, end: null, rows: [], loading: false, error: null };
    SUPABASE_COVER_REQUESTS = { rows: [], loading: false, error: null };
    render();
    syncSupabaseRealtimeForCurrentView();
    if (R.tab === 'team' && isMgr()) loadSupabaseRosterWeek(R.rosterWeekStart, true);
    if (R.tab === 'history' && isMgr()) loadSupabaseHistory(true);
    if (isMgr()) loadSupabaseCoverRequests();
    if (isMgr()) loadSupabaseNotificationRecipients();
    toast(`Viewing ${nextOrganisationId ? organisationName(nextOrganisationId) : 'all organisations'}`, 'ok');
  } catch (error) {
    AUTH.selectedOrganisationId = previousOrganisationId;
    AUTH.selectedVenueId = previousVenueId;
    console.error('[supabase] organisation filter load failed', { organisationId: nextOrganisationId, error });
    render();
    toast('Could not load that organisation. Please try again.', 'warn');
  } finally {
    REMOTE_MUTATIONS.delete(lockKey);
  }
}
function organisationRoleForVenue(v) {
  return isSupabaseMode() ? (v && v.organisationRole) : null;
}
function ensureCurrentTabAllowed() {

function user(id) {

const V      = () => currentVenueContext() || venueCatalog()[0];

function applyRemoteTaskRow(task, row) {
  task.id = row.id;

function nextRemoteSortOrder(list) {
  return list.tasks.reduce((max, task, index) => {
    const order = Number.isFinite(task.sortOrder) ? task.sortOrder : index;
    return Math.max(max, order);
  }, -1) + 1;
}

async function insertRemoteDailyTask(list, fields) {
  const taskId = crypto.randomUUID();
  const payload = {
    id: taskId,
    checklist_id: list.id,
    template_task_id: fields.templateTaskId || null,
    sort_order: fields.sortOrder,
    title: fields.title,
    detail: fields.detail || null,
    critical: !!fields.critical,
    source: fields.source,
    status: 'pending',
    added_by: AUTH.profile.id,
    added_at: new Date().toISOString(),
    note: null,
    reason: null
  };
  const { error: insertError } = await DB.from('daily_tasks').insert(payload);
  if (insertError) throw insertError;

  const { data, error: selectError } = await DB.from('daily_tasks')
    .select(REMOTE_TASK_SELECT)
    .eq('id', taskId)
    .single();
  if (selectError) throw selectError;
  return applyRemoteTaskRow({}, data);
}

async function loadSupabaseRosterForVenue(context, date) {
  const result = await DB.from('roster_assignments')
    .select('id,venue_id,user_id,work_date,shift_type,start_time,end_time')
    .eq('venue_id', context.realId)
    .eq('work_date', date);
  if (result.error) {
    console.error('[supabase] roster load failed', { venueId: context.realId, date, error: result.error });
    throw accessError('roster-load', `We could not load today's roster for ${context.name}.`);
  }
  const rosterUserIds = [...new Set((result.data || []).map(row => row.user_id))];
  if (rosterUserIds.length) {
    const profileResult = await DB.from('profiles')
      .select('id,display_name,email,phone,active')
      .in('id', rosterUserIds);
    if (profileResult.error) {
      console.error('[supabase] roster profile load failed', { venueId: context.realId, rosterUserIds, error: profileResult.error });
      throw accessError('roster-load', `We could not load the people assigned to today's roster for ${context.name}.`);
    }
    (profileResult.data || []).forEach(profile => { SUPABASE_TEAM.profilesById[profile.id] = profile; });
  }
  const roster = { open: [], close: [] };
  const assignmentIds = { open: {}, close: {} };
  (result.data || []).forEach(row => {
    if (!roster[row.shift_type]) return;
    roster[row.shift_type].push(row.user_id);
    assignmentIds[row.shift_type][row.user_id] = row.id;
  });
  return { roster, assignmentIds };
}

function rosterWeekStartKey(date) {
  const value = parseKey(date || dayKey());
  const mondayOffset = (value.getDay() + 6) % 7;
  value.setDate(value.getDate() - mondayOffset);
  return dayKey(value);
}

function rosterWeekDates(start) {
  const first = parseKey(start || rosterWeekStartKey(dayKey()));
  return Array.from({ length: 7 }, (_, index) => dayKey(addDays(first, index)));
}

function rosterVenueName(venueId) {
  const context = (isSupabaseMode() ? AUTH.venueContexts : venueCatalog())

async function loadSupabaseRosterWeek(start, force = false) {
  if (!isSupabaseMode() || !isMgr()) return;
  const organisationId = currentSupabaseRosterScopeKey();
  const weekStart = start || rosterWeekStartKey(dayKey());
  const dates = rosterWeekDates(weekStart);
  const weekEnd = dates[dates.length - 1];
  if (!force
    && SUPABASE_ROSTER_WEEK.organisationId === organisationId
    && SUPABASE_ROSTER_WEEK.start === weekStart
    && !SUPABASE_ROSTER_WEEK.error) return;

  SUPABASE_ROSTER_WEEK = {
    organisationId, start: weekStart, end: weekEnd, rows: [], loading: true, error: null
  };
  render();
  const isCurrentRequest = () => SUPABASE_ROSTER_WEEK.organisationId === organisationId
    && SUPABASE_ROSTER_WEEK.start === weekStart;
  try {
    const venueIds = managerVenueCatalog().map(context => context.realId);
    const result = venueIds.length
      ? await DB.from('roster_assignments')
        .select('id,venue_id,user_id,work_date,shift_type,start_time,end_time')
        .in('venue_id', venueIds)
        .gte('work_date', weekStart)
        .lte('work_date', weekEnd)
        .order('work_date')
        .order('venue_id')
        .order('shift_type')
      : { data: [], error: null };
    if (result.error) throw result.error;

    const userIds = [...new Set((result.data || []).map(row => row.user_id))];
    if (userIds.length) {
      const profileResult = await DB.from('profiles')
        .select('id,display_name,email,phone,active')
        .in('id', userIds);
      if (profileResult.error) throw profileResult.error;
      (profileResult.data || []).forEach(profile => { SUPABASE_TEAM.profilesById[profile.id] = profile; });
    }
    if (!isCurrentRequest()) return;
    SUPABASE_ROSTER_WEEK = {
      organisationId,
      start: weekStart,
      end: weekEnd,
      rows: result.data || [],
      loading: false,
      error: null
    };
  } catch (error) {
    if (!isCurrentRequest()) return;
    console.error('[supabase] roster week load failed', { organisationId, weekStart, weekEnd, error });
    refreshSupabaseAccessAfterDeniedOperation(error, 'roster-load');
    SUPABASE_ROSTER_WEEK = {
      organisationId,
      start: weekStart,
      end: weekEnd,
      rows: [],
      loading: false,
      error: 'We could not load the organisation roster for this week.'
    };
  }
  render();
}

    .forEach(profile => profiles.set(profile.id, {
      id: profile.id,
      displayName: profile.display_name || profile.email || 'DailyOps admin',
      email: profile.email || '',
      active: profile.active
    }));
  SUPABASE_TEAM.members
    .filter(member => member.organisationId === context.organisationId && member.role === 'manager' && member.active)
    .forEach(member => profiles.set(member.id, {
      id: member.id,
      displayName: member.displayName,
      email: member.email,
      active: member.active
    }));
  const currentMembership = AUTH.organisationMemberships.find(membership =>
    membership.organisation_id === context.organisationId && membership.role === 'manager'
  );
  if (AUTH.profile && AUTH.profile.active && (AUTH.profile.platform_role === 'admin' || currentMembership)) {
    profiles.set(AUTH.profile.id, {
      id: AUTH.profile.id,
      displayName: AUTH.profile.display_name,
      email: AUTH.profile.email,
      active: AUTH.profile.active
    });
  }
  return [...profiles.values()].sort((a, b) => a.displayName.localeCompare(b.displayName));
}

  if (!isSupabaseMode() || !isMgr() || !V()?.realId) return;
  const venueId = V().realId;

  render();

      .select('id,venue_id,profile_id,telegram_chat_id,enabled,notify_shift_complete,notify_incomplete_submission,notify_shift_reopened,notify_shift_cover,notify_end_of_day,created_by,created_at,updated_at')
      .eq('venue_id', venueId)
      .order('created_at');
    if (result.error) throw result.error;

    const profileResult = profileIds.length
      ? await DB.from('profiles').select('id,display_name,email,active,platform_role').in('id', profileIds)

      rows: (result.data || []).map(row => ({ ...row, profile: profilesById[row.profile_id] || null })),
      eligibleProfiles: eligibleResult.data || [],
      loading: false,
      error: null
    };
  } catch (error) {
    console.error('[supabase] Telegram notification recipient load failed', { venueId, error });
    refreshSupabaseAccessAfterDeniedOperation(error, 'notification-recipient-load');
    SUPABASE_NOTIFICATION_RECIPIENTS = {
      venueId, rows: [], eligibleProfiles: [], loading: false,
      error: 'We could not load Telegram recipients. Apply migration 013 and check manager access.'

  }
